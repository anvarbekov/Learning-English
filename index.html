  const res=q?WORDS.filter(w=>w.en.toLowerCase().includes(q)||w.uz.toLowerCase().includes(q)).slice(0,60):[];
  return`
  <div class="top"><div class="grow"><div class="eyebrow">Lug'at</div><h1 style="margin-top:6px">${WORDS.length} ta eng kerakli so'z</h1></div>
  <button class="btn primary" data-mode="en2uz">${ic('target')} Test boshlash</button></div>
  <div class="search ins">${ic('search')}<input id="wsearch" type="search" placeholder="Inglizcha yoki o'zbekcha qidiring…" value="${esc(R.q||'')}" autocomplete="off" aria-label="So'z qidirish"></div>
  ${q?`<div class="neu pad">${res.length?`<div class="wlist">${res.map(wrow).join('')}</div>`:`<div class="empty">«${esc(q)}» bo'yicha so'z topilmadi.</div>`}</div>`:`
  <div class="grid g3">${WORD_CATS.map(([id,name,lvl])=>{const ws=WORDS.filter(w=>w.cat===id);const l=ws.filter(w=>P.learned[w.en]).length;return`
    <button class="ccard neu-sm" data-cat="${id}"><div class="row"><b>${esc(name)}</b><span class="lvl">${lvl}</span></div>
    <div class="bar"><i style="width:${Math.round(l/ws.length*100)}%"></i></div><small>${l} / ${ws.length} o'rganildi</small></button>`}).join('')}</div>`}`;
}
const wrow=w=>`<div class="wrow">${sayBtn(w.en)}<div class="t"><span class="en">${esc(w.en)}</span><span class="uz">${esc(w.uz)}</span></div><button class="tog ${P.learned[w.en]?'y':''}" data-learn="${esc(w.en)}" aria-label="O'rgandim">${ic('check')}</button></div>`;
function vCat(){
  const c=CAT[R.id];const ws=WORDS.filter(w=>w.cat===R.id);const l=ws.filter(w=>P.learned[w.en]).length;
  return`
  <div class="top"><button class="ibtn" data-go="words" aria-label="Orqaga">${ic('left')}</button>
  <div class="grow"><div class="eyebrow">${c.lvl} · ${ws.length} so'z</div><h1 style="margin-top:4px">${esc(c.name)}</h1></div></div>
  <div class="neu pad" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>Natija</span><span style="font-variant-numeric:tabular-nums">${l} / ${ws.length}</span></div>
    <div class="bar"><i style="width:${Math.round(l/ws.length*100)}%"></i></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
      <button class="btn primary" data-flash="${c.id}">${ic('cards')} Kartochkalar</button>
      <button class="btn" data-mode="en2uz" data-mcat="${c.id}">${ic('target')} Test</button>
      <button class="btn" data-mode="spell" data-mcat="${c.id}">${ic('pen')} Imlo</button>
      <button class="btn" data-mode="listen" data-mcat="${c.id}">${ic('ear')} Eshitish</button>
    </div>
  </div>
  <div class="neu pad"><div class="wlist">${ws.map(wrow).join('')}</div></div>`;
}
let F=null;
function startFlash(cat){const ws=WORDS.filter(w=>w.cat===cat);const nl=ws.filter(w=>!P.learned[w.en]);F={cat,deck:shuf(nl.length?nl:ws),i:0,flip:false,known:0};go('flash')}
function vFlash(){
  const c=CAT[F.cat];
  if(F.i>=F.deck.length)return`
  <div class="sess neu result"><div class="eyebrow">${esc(c.name)}</div><div class="score">${F.known}</div><p class="muted">ta so'zni bilasiz (${F.deck.length} tadan)</p>
  <div class="fbtns"><button class="btn" data-cat="${c.id}">${ic('left')} Ro'yxatga</button><button class="btn primary" data-flash="${c.id}">${ic('refresh')} Yana bir bor</button></div></div>`;
  const w=F.deck[F.i];
  return`
  <div class="top"><button class="ibtn" data-cat="${c.id}" aria-label="Orqaga">${ic('left')}</button><div class="grow"><div class="eyebrow">Kartochkalar</div><h2 style="margin-top:4px">${esc(c.name)}</h2></div><span class="lvl" style="font-size:13px">${F.i+1} / ${F.deck.length}</span></div>
  <div class="bar" style="max-width:520px;width:100%;margin:0 auto"><i style="width:${F.i/F.deck.length*100}%"></i></div>
  <div class="flash"><div class="fcard ${F.flip?'flip':''}" data-flip="1" role="button" tabindex="0" aria-label="Kartani aylantirish">
    <div class="face front neu"><div class="eyebrow">English</div><div class="big">${esc(w.en)}</div><small class="muted">Bosing — tarjimasini ko'ring</small></div>
    <div class="face back neu"><div class="eyebrow">O'zbekcha</div><div class="big">${esc(w.uz)}</div><small class="muted">${esc(w.en)}</small></div>
  </div></div>
  <div class="fbtns">${sayBtn(w.en)}<button class="btn" data-fk="0">${ic('x')} Bilmayman</button><button class="btn primary" data-fk="1">${ic('check')} Bilaman</button></div>`;
}

/* ---------- PHRASES ---------- */
function vPhrases(){
  const tab=R.ptab||'sit';
  const tabs=[['sit','Vaziyatlar'],['idiom','Idiomalar'],['phr','Phrasal verbs'],['irr',"Noto'g'ri fe'llar"]];
  let body='';
  if(tab==='sit')body=`<div class="grid g2">${PHRASES.map(([n,l])=>`<section class="sect neu-sm"><h3 style="margin-bottom:6px">${esc(n)}</h3>${l.map(([e,u])=>`<div class="prow"><div class="t"><div class="en">${esc(e)}</div><div class="uz">${esc(u)}</div></div>${sayBtn(e)}</div>`).join('')}</section>`).join('')}</div>`;
  if(tab==='idiom')body=`<div class="neu pad"><p class="muted" style="margin-bottom:10px">Ona tilida so'zlashuvchilar kundalik nutqda ko'p ishlatadigan iboralar. So'zma-so'z tarjima qilinmaydi — ma'nosini yodlang.</p>${IDIOMS.map(([e,u,x])=>`<div class="prow"><div class="t"><div class="en">${esc(e)}</div><div class="uz">${esc(u)}</div><div class="ex">${esc(x)}</div></div>${sayBtn(x)}</div>`).join('')}</div>`;
  if(tab==='phr')body=`<div class="neu pad">${PHRASAL.map(([e,u,x])=>`<div class="prow"><div class="t"><div class="en">${esc(e)}</div><div class="uz">${esc(u)}</div><div class="ex">${esc(x)}</div></div>${sayBtn(x)}</div>`).join('')}</div>`;
  if(tab==='irr'){const q=(R.iq||'').toLowerCase();const l=IRREG.filter(r=>!q||r.join(' ').toLowerCase().includes(q));
    body=`<div class="top"><div class="search ins grow">${ic('search')}<input id="isearch" type="search" placeholder="Fe'lni qidiring…" value="${esc(R.iq||'')}" aria-label="Fe'l qidirish"></div><button class="btn primary" data-mode="irreg">${ic('target')} Mashq qilish</button></div>
    <div class="neu pad"><div class="tablewrap"><table><thead><tr><th>V1</th><th>V2 (Past)</th><th>V3 (Participle)</th><th>Tarjima</th><th></th></tr></thead><tbody>${l.map(r=>`<tr><td><b>${r[0]}</b></td><td class="m">${r[1]}</td><td class="m">${r[2]}</td><td class="muted">${esc(r[3])}</td><td>${sayBtn(r[0]+', '+r[1].replace(' / ',', ')+', '+r[2].replace(' / ',', '))}</td></tr>`).join('')}</tbody></table></div></div>`}
  return`
  <div class="top"><div class="grow"><div class="eyebrow">Frazalar</div><h1 style="margin-top:6px">Tayyor iboralar — ayting va tushuning</h1></div></div>
  <div class="chips">${tabs.map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-ptab="${k}">${l}</button>`).join('')}</div>
  ${body}`;
}

/* ---------- PRACTICE ---------- */
const MODES=[
['en2uz',"So'z testi",'Inglizcha so\'zning tarjimasini toping','cards'],
['uz2en','Teskari test',"O'zbekchadan inglizchaga",'swap'],
['spell','Imlo',"So'zni o'zingiz yozing",'pen'],
['listen','Eshitish',"Tinglang va to'g'risini tanlang",'ear'],
['grammar','Grammatika testi','Barcha mavzulardan savollar','book'],
['order','Gap tuzish',"So'zlarni to'g'ri tartibda joylang",'puzzle'],
['irreg',"Noto'g'ri fe'llar",'V2 va V3 shakllarini toping','table'],
['phrase','Frazalar testi',"Iboraning ma'nosini toping",'chat'],
['mix','Aralash','Hamma turdan 10 ta savol','bolt'],
];
const modeCard=([k,n,d,i])=>`<button class="mode neu-sm" data-mode="${k}"><div class="ic ins">${ic(i)}</div><div><b>${n}</b><small>${d}</small></div></button>`;
function vPractice(){
  const c=R.mcat||'all';
  return`
  <div class="top"><div class="grow"><div class="eyebrow">Mashq</div><h1 style="margin-top:6px">10 ta savol, har to'g'ri javob +5 XP</h1></div></div>
  <div class="neu-sm pad" style="display:flex;flex-direction:column;gap:12px"><b style="font-size:14px">So'z mashqlari uchun mavzu</b>
  <div class="chips"><button class="chip ${c==='all'?'on':''}" data-pcat="all">Barchasi</button>${WORD_CATS.map(([id,n])=>`<button class="chip ${c===id?'on':''}" data-pcat="${id}">${esc(n)}</button>`).join('')}</div></div>
  <div class="grid g3">${MODES.map(modeCard).join('')}</div>`;
}
let S=null;
function wordPool(cat){return!cat||cat==='all'?WORDS:WORDS.filter(w=>w.cat===cat)}
function distract(val,get,src,n=3){const out=new Set();const pool=shuf(src.length>8?src:WORDS);for(const w of pool){const v=get(w);if(v!==val&&!out.has(v))out.add(v);if(out.size>=n)break}return[...out]}
function mc(prompt,correct,wrongs,extra){const opts=shuf([correct,...wrongs]);return Object.assign({type:'mc',prompt,opts,ans:opts.indexOf(correct)},extra)}
function makeQ(mode,cat){
  const src=wordPool(cat);
  if(mode==='mix')mode=pick(['en2uz','uz2en','spell','listen','grammar','order','irreg','phrase']);
  if(mode==='en2uz'){const w=pick(src);return mc(w.en,w.uz,distract(w.uz,x=>x.uz,src.filter(x=>x.cat===w.cat)),{hint:'Tarjimasini tanlang',say:w.en,word:w})}
  if(mode==='uz2en'){const w=pick(src);return mc(w.uz,w.en,distract(w.en,x=>x.en,src.filter(x=>x.cat===w.cat)),{hint:'Inglizchasini tanlang',word:w,sayAfter:w.en})}
  if(mode==='listen'){const w=pick(src);return mc('',w.en,distract(w.en,x=>x.en,src.filter(x=>x.cat===w.cat)),{hint:'Eshitganingizni tanlang',say:w.en,auto:true,word:w,reveal:w.en+' — '+w.uz})}
  if(mode==='spell'){const w=pick(src.filter(x=>x.en.length<=14));return{type:'in',prompt:w.uz,ans:w.en,hint:'Inglizcha yozing',word:w,sayAfter:w.en}}
  if(mode==='grammar'){const t=pick(GRAMMAR);const q=pick(t.q);const opts=q[1].slice();return{type:'mc',prompt:q[0],opts,ans:q[2],hint:t.t,explain:q[3]}}
  if(mode==='order'){const t=pick(GRAMMAR);const ex=pick(t.ex.filter(e=>e[0].split(' ').length<=10&&!e[0].includes('«')))||t.ex[0];const toks=ex[0].split(' ');let s=shuf(toks.map((x,i)=>({x,i})));if(s.map(o=>o.x).join(' ')===ex[0])s=s.reverse();return{type:'ord',prompt:ex[1],ans:ex[0],toks:s,picked:[],hint:"Gapni tuzing",sayAfter:ex[0]}}
  if(mode==='irreg'){const r=pick(IRREG);const f=x=>x[1]+'  ·  '+x[2];const wr=shuf(IRREG.filter(x=>x!==r)).slice(0,2).map(f);wr.push(r[0]+'ed  ·  '+r[0]+'ed');return mc(r[0],f(r),wr,{hint:"V2 · V3 shakllarini toping — "+r[3],sayAfter:r[0]+', '+r[1]+', '+r[2]})}
  if(mode==='phrase'){const all=[...PHRASES.flatMap(p=>p[1]),...IDIOMS.map(i=>[i[0],i[1]])];const p=pick(all);const wr=shuf(all.filter(x=>x!==p)).slice(0,3).map(x=>x[1]);return mc(p[0],p[1],wr,{hint:"Ma'nosini tanlang",say:p[0]})}
}
function startSession(mode,cat){const qs=[];const seen=new Set();let g=0;while(qs.length<10&&g++<200){const q=makeQ(mode,cat);const k=q.prompt+q.ans;if(seen.has(k))continue;seen.add(k);qs.push(q)}
  S={mode,cat,qs,i:0,ok:0,done:false,miss:[]};go('session')}
function vSession(){
  const m=MODES.find(x=>x[0]===S.mode);
  if(S.i>=S.qs.length){const xp=S.ok*5;return`
    <div class="sess neu result"><div class="eyebrow">${m[1]} · natija</div><div class="score">${S.ok} / ${S.qs.length}</div>
    <p class="muted">${S.ok>=9?"Ajoyib! Siz bu mavzuni yaxshi bilasiz.":S.ok>=6?"Yaxshi natija. Yana bir marta takrorlang.":"Bu mavzuni yana mashq qilish kerak."} +${xp} XP</p>
    ${S.miss.length?`<div class="ins pad" style="width:100%;text-align:left"><b style="font-size:14px">Xatolar ustida ishlang</b>${S.miss.map(x=>`<div class="prow"><div class="t"><div class="en">${esc(x[0])}</div><div class="uz">${esc(x[1])}</div></div></div>`).join('')}</div>`:''}
    <div class="fbtns"><button class="btn" data-go="practice">${ic('left')} Mashqlar</button><button class="btn primary" data-mode="${S.mode}" data-mcat="${S.cat||'all'}">${ic('refresh')} Yana 10 ta</button></div></div>`}
  const q=S.qs[S.i];const a=S.done;
  let body='';
  if(q.type==='mc')body=`<div class="mopts">${q.opts.map((o,i)=>`<button class="opt ${a&&i===q.ans?'right':''} ${a&&i===S.pick&&S.pick!==q.ans?'wrong':''}" data-sa="${i}" ${a?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  if(q.type==='in')body=`<form class="tin" id="tform"><div class="ins"><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Javobni yozing…" ${a?'disabled':''} value="${esc(S.typed||'')}" aria-label="Javob"></div>${a?'':`<button class="btn primary" type="submit">Tekshirish</button>`}</form>`;
  if(q.type==='ord')body=`<div class="slots ins" aria-label="Siz tuzgan gap">${q.picked.length?q.picked.map((ti,k)=>`<button class="tok" data-unpick="${k}" ${a?'disabled':''}>${esc(q.toks[ti].x)}</button>`).join(''):'<span class="muted" style="padding:8px">So\'zlarni bosing…</span>'}</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">${q.toks.map((t,ti)=>`<button class="tok ${q.picked.includes(ti)?'used':''}" data-tok="${ti}" ${a?'disabled':''}>${esc(t.x)}</button>`).join('')}</div>
    ${a?'':`<button class="btn primary" data-check="1" ${q.picked.length===q.toks.length?'':'disabled style="opacity:.5"'}>Tekshirish</button>`}`;
  let fb='';
  if(a){const ok=S.right;const show=q.type==='mc'?q.opts[q.ans]:q.ans;
    fb=`<div class="note ${ok?'y':'n'}">${ok?"To'g'ri!":"Noto'g'ri. To'g'ri javob: <b>"+esc(show)+"</b>"}${q.explain?' — '+esc(q.explain):''}${q.reveal?'<br>'+esc(q.reveal):''}</div>
    <button class="btn primary" data-next="1" id="nextbtn">${S.i+1<S.qs.length?'Keyingisi':'Natijani ko\'rish'} ${ic('right')}</button>`}
  return`
  <div class="top"><button class="ibtn" data-go="practice" aria-label="Chiqish">${ic('x')}</button><div class="grow"><div class="eyebrow">${m[1]}</div></div></div>
  <div class="sess neu">
    <div class="meta"><span>${S.i+1} / ${S.qs.length}</span><span>${S.ok} to'g'ri</span></div>
    <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
    <div class="prompt ins"><div class="hint">${esc(q.hint||'')}</div>${q.prompt?`<div class="big">${esc(q.prompt)}</div>`:''}${q.say?sayBtn(q.say):''}${a&&q.sayAfter?sayBtn(q.sayAfter):''}</div>
    ${body}${fb}
  </div>`;
}
function afterSession(){if(!S||S.i>=S.qs.length)return;const q=S.qs[S.i];
  if(q.auto&&!S.done&&!S.spoke){S.spoke=true;setTimeout(()=>say(q.say),250)}
  const t=$('#tin');if(t&&!S.done)t.focus();const n=$('#nextbtn');if(n)n.focus({preventScroll:true})}
function answer(right){const q=S.qs[S.i];S.done=true;S.right=right;
  if(right){S.ok++;if(q.word&&!P.learned[q.word.en]){P.learned[q.word.en]=1;save()}}
  else S.miss.push([q.type==='mc'?q.prompt||q.say:q.prompt,q.type==='mc'?q.opts[q.ans]:q.ans]);
  if(S.i===S.qs.length-1)addXP(S.ok*5);
  render()}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/\(.*?\)/g,'').trim();

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-flip]');if(!b)return;const d=b.dataset;
  if(d.say!==undefined){say(d.say);return}
  if(d.go){if(d.go==='words')R.q=undefined;go(d.go);return}
  if(d.lvl){go('grammar',{lvl:d.lvl});return}
  if(d.topic){QA={};go('topic',{id:d.topic});return}
  if(d.qa){const[qi,oi]=d.qa.split(':').map(Number);QA[qi]=oi;const t=TOPIC[R.id];
    if(Object.keys(QA).length===t.q.length){const c=t.q.filter((q,i)=>QA[i]===q[2]).length;const prev=P.topics[t.id]||0;
      if(c>prev){addXP((c-prev)*10);P.topics[t.id]=c;save()}if(c>=2)toast(`Mavzu o'tildi: ${c}/3`)}
    const y=scrollY;render();scrollTo(0,y);return}
  if(d.retry){QA={};const y=scrollY;render();scrollTo(0,y);return}
  if(d.learn){const k=d.learn;if(P.learned[k])delete P.learned[k];else{P.learned[k]=1;addXP(1)}save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.cat){go('cat',{id:d.cat});return}
  if(d.flash){startFlash(d.flash);return}
  if(d.flip){F.flip=!F.flip;b.classList.toggle('flip',F.flip);if(F.flip)say(F.deck[F.i].en);return}
  if(d.fk!==undefined){const w=F.deck[F.i];if(d.fk==='1'){F.known++;if(!P.learned[w.en]){P.learned[w.en]=1;addXP(1)}}else F.deck.push(w);if(F.deck.length>200)F.deck.length=200;F.i++;F.flip=false;save();render();return}
  if(d.ptab){go('phrases',{ptab:d.ptab});return}
  if(d.pcat){R.mcat=d.pcat;render();return}
  if(d.mode){startSession(d.mode,d.mcat||R.mcat||'all');return}
  if(d.sa!==undefined&&S&&!S.done){S.pick=+d.sa;answer(S.pick===S.qs[S.i].ans);return}
  if(d.tok!==undefined){const q=S.qs[S.i];q.picked.push(+d.tok);render();return}
  if(d.unpick!==undefined){const q=S.qs[S.i];q.picked.splice(+d.unpick,1);render();return}
  if(d.check){const q=S.qs[S.i];if(q.picked.length<q.toks.length)return;answer(norm(q.picked.map(i=>q.toks[i].x).join(' '))===norm(q.ans));return}
  if(d.next){S.i++;S.done=false;S.spoke=false;S.typed='';S.pick=null;render();return}
});
document.addEventListener('submit',e=>{if(e.target.id==='tform'){e.preventDefault();const v=$('#tin').value;if(!v.trim())return;S.typed=v;const q=S.qs[S.i];
  const alts=q.ans.split(/,|;/).map(norm);answer(alts.includes(norm(v))||norm(v)===norm(q.ans))}});
document.addEventListener('input',e=>{
  if(e.target.id==='wsearch'){R.q=e.target.value;render()}
  if(e.target.id==='isearch'){R.iq=e.target.value;render();const i=$('#isearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
});
document.addEventListener('keydown',e=>{
  if(R.v==='flash'&&F&&F.i<F.deck.length){if(e.key===' '||e.key==='Enter'){if(e.target.closest&&e.target.closest('[data-flip]')){e.preventDefault();F.flip=!F.flip;$('.fcard').classList.toggle('flip',F.flip)}}if(e.key==='ArrowRight'){F.known++;const w=F.deck[F.i];if(!P.learned[w.en]){P.learned[w.en]=1;addXP(1)}F.i++;F.flip=false;save();render()}}
  if(R.v==='session'&&S&&S.done&&e.key==='Enter'&&e.target.id!=='nextbtn'){e.preventDefault();S.i++;S.done=false;S.spoke=false;S.typed='';render()}
  if(R.v==='session'&&S&&!S.done&&S.qs[S.i]&&S.qs[S.i].type==='mc'&&/^[1-4]$/.test(e.key)&&e.target.tagName!=='INPUT'){const i=+e.key-1;if(i<S.qs[S.i].opts.length){S.pick=i;answer(i===S.qs[S.i].ans)}}
});
render();
</script>
