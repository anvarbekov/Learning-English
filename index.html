/* ---------- example sentences from the course corpus ---------- */
let CORPUS=null,CIDX=null;
function buildCorpus(){
  CORPUS=[];
  GRAMMAR.forEach(t=>t.ex.forEach(e=>{if(!/[«»→]/.test(e[0]))CORPUS.push({en:e[0],uz:e[1]})}));
  PHRASES.forEach(p=>p[1].forEach(e=>CORPUS.push({en:e[0],uz:e[1]})));
  SENTS.forEach(e=>CORPUS.push({en:e.en,uz:e.uz}));
  IDIOMS.forEach(i=>CORPUS.push({en:i[2],uz:''}));
  PHRASAL.forEach(i=>CORPUS.push({en:i[2],uz:''}));
  CIDX=new Map();
  CORPUS.forEach((c,i)=>{(c.en.toLowerCase().match(/[a-z']+/g)||[]).forEach(tok=>{if(!CIDX.has(tok))CIDX.set(tok,[]);CIDX.get(tok).push(i)})});
}
function forms(w){const b=w.toLowerCase();const f=[b,b+'s',b+'es',b+'ed',b+'d',b+'ing'];if(b.endsWith('e'))f.push(b.slice(0,-1)+'ing');if(b.endsWith('y'))f.push(b.slice(0,-1)+'ies',b.slice(0,-1)+'ied');const last=b.slice(-1);if(/[bdgmnpt]/.test(last)&&/[aeiou]/.test(b.slice(-2,-1)))f.push(b+last+'ed',b+last+'ing');return f}
function findEx(w){
  const n=noteOf(w.en);if(n.ex)return{en:n.ex,uz:n.exUz||'',src:'note',form:null};
  if(!CORPUS)buildCorpus();
  const base=w.en.toLowerCase().replace(/\(.*?\)/g,'').trim();
  let best=null,form=null;
  if(/\s/.test(base)){CORPUS.forEach(c=>{if(c.en.toLowerCase().includes(base)&&(!best||c.en.length<best.en.length)){best=c;form=base}})}
  else for(const f of forms(base)){const ids=CIDX.get(f);if(ids)ids.forEach(i=>{const c=CORPUS[i];if(!best||c.en.length<best.en.length){best=c;form=f}})}
  return best?{en:best.en,uz:best.uz,src:'corpus',form}:null;
}
function markWord(sentence,w,form){
  const s=esc(sentence);const terms=form?[form]:forms(w.en.toLowerCase());
  for(const t of terms.sort((a,b)=>b.length-a.length)){const re=new RegExp('\\b('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');if(re.test(s))return s.replace(re,'<mark>$1</mark>')}
  return s;
}

/* ---------- SRS core ---------- */
const srsOf=w=>P.srs[w.en];
const isKnown=w=>!!P.srs[w.en];
function srsAdd(w,box=1,inDays=1){if(!P.srs[w.en]){P.srs[w.en]=[box,dayNum()+inDays];save()}}
function dueWords(){const t=dayNum();return WORDS.filter(w=>{const s=P.srs[w.en];return s&&s[1]<=t}).sort((a,b)=>P.srs[a.en][1]-P.srs[b.en][1]||P.srs[a.en][0]-P.srs[b.en][0])}
function focusLevel(){if(P.focus&&LEVELS.includes(P.focus))return P.focus;return LEVELS.find(l=>byLvl(l).some(w=>!isKnown(w)))||'C2'}
function newWords(scope){let ws=scope&&CAT[scope]?WORDS.filter(w=>w.cat===scope):byLvl(scope&&LEVELS.includes(scope)?scope:focusLevel());return ws.filter(w=>!isKnown(w))}
function memStats(){let n=0,l=0,m=0;WORDS.forEach(w=>{const s=P.srs[w.en];if(!s)n++;else if(s[0]>=4)m++;else l++});return{n,l,m}}
function forecast(){const t=dayNum();const f=[0,0,0,0,0,0,0];Object.values(P.srs).forEach(s=>{const d=Math.max(0,s[1]-t);if(d<7)f[d]++});return f}

/* ---------- MATCH game ---------- */
let MG=null;
function startMatch(sel){const pool=shuf(wordPool(sel).filter(w=>w.en.length<=22&&w.uz.length<=28));const seen=new Set();const ws=[];
  for(const w of pool){if(seen.has(w.uz))continue;seen.add(w.uz);ws.push(w);if(ws.length>=18)break}
  MG={sel,ws,round:0,mistakes:0,t0:Date.now(),selL:null,selR:null,done:new Set(),bad:null};nextMatchRound();go('match')}
function nextMatchRound(){const r=MG.ws.slice(MG.round*6,MG.round*6+6);MG.cur=r;MG.L=shuf(r);MG.Rt=shuf(r);MG.done=new Set();MG.selL=MG.selR=null}
function vMatch(){
  if(!MG)return VIEWS.practice();
  const rounds=Math.ceil(MG.ws.length/6);
  if(MG.round>=rounds){const sec=Math.round((MG.t1-MG.t0)/1000);return`<div class="sess neu result"><div class="eyebrow">Juftlik topish</div><div class="score tnum">${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</div><p class="muted">${MG.ws.length} juftlik · ${MG.mistakes} xato</p>
    <div class="fbtns"><button class="btn" data-go="practice">${ic('left')} Mashqlar</button><button class="btn primary" data-mode="match" data-mcat="${MG.sel||'all'}">${ic('refresh')} Yana o'ynash</button></div></div>`}
  const cell=(w,side)=>{const k=w.en;const done=MG.done.has(k);const sel=(side==='L'?MG.selL:MG.selR)===k;const bad=MG.bad&&MG.bad[side]===k;
    return`<button class="mt ${done?'gone':''} ${sel?'sel':''} ${bad?'bad':''}" data-m${side.toLowerCase()}="${esc(k)}" ${done?'disabled':''}>${side==='L'?`${pic(w)}<span>${esc(w.en)}</span>`:`<span>${esc(w.uz)}</span>`}</button>`};
  return`<div class="top"><button class="ibtn" data-go="practice" aria-label="Chiqish">${ic('x')}</button><div class="grow"><div class="eyebrow">Juftlik topish · bosqich ${MG.round+1} / ${rounds}</div><h2 style="margin-top:4px">So'zni tarjimasi bilan juftlang</h2></div><span class="lvl tnum">${MG.mistakes} xato</span></div>
  <div class="matchgrid"><div class="mcol">${MG.L.map(w=>cell(w,'L')).join('')}</div><div class="mcol">${MG.Rt.map(w=>cell(w,'R')).join('')}</div></div>`;
}
function matchPick(side,k){if(side==='L')MG.selL=MG.selL===k?null:k;else MG.selR=MG.selR===k?null:k;MG.bad=null;
  if(MG.selL&&MG.selR){if(MG.selL===MG.selR){const w=MG.cur.find(x=>x.en===MG.selL);MG.done.add(MG.selL);say(w.en);srsAdd(w);MG.selL=MG.selR=null;
      if(MG.done.size===MG.cur.length){MG.round++;if(MG.round*6>=MG.ws.length){MG.t1=Date.now();const sec=Math.round((MG.t1-MG.t0)/1000);MG.rec=setBest('match',sec,false);logSession('match',sec,MG.mistakes);addXP(Math.max(5,MG.ws.length-MG.mistakes))}else nextMatchRound()}}
    else{MG.mistakes++;MG.bad={L:MG.selL,R:MG.selR};MG.selL=MG.selR=null;setTimeout(()=>{if(MG&&MG.bad){MG.bad=null;if(R.v==='match')render()}},600)}}
  render()}

/* ---------- grammar helpers: colored formula & timeline ---------- */
function colorF(line){
  let s=esc(line);
  s=s.replace(/\b(V1 \+ s\/es|V1\+s\/es|V1 \+ s|V1|V2|V3|V-ing|V-ed)\b/g,'<span class="fv">$1</span>');
  s=s.replace(/\b(I|You|He|She|It|We|They|Ega|ega)\b(?![^<]*<\/span>)/g,'<span class="fs">$1</span>');
  s=s.replace(/\b(am not|am|is|are|was|were|be|been|being|have|has|had|do|does|did|don't|doesn't|didn't|isn't|aren't|wasn't|weren't|haven't|hasn't|hadn't|will|won't|would|shall|can|can't|could|must|mustn't|should|shouldn't|might|may|going to|not)\b(?![^<]*<\/span>)/g,'<span class="fa">$1</span>');
  return s;
}

  if(sel.startsWith('T:'))return SENTS.filter(s=>s.top===sel.slice(2));
  const m=/^([ABC][12])-/.exec(sel);if(m)return SENTS.filter(s=>s.lvl===m[1]);
  return SENTS;
}
const scopeName=sel=>!sel||sel==='all'?'Barcha darajalar':sel.startsWith('T:')?(STOP[sel.slice(2)]?STOP[sel.slice(2)].lvl+' · '+STOP[sel.slice(2)].name:sel):CAT[sel]?CAT[sel].lvl+' · '+CAT[sel].name:sel;

/* word-level diff for dictation feedback */
function diffHTML(user,correct){
  const tok=s=>s.replace(/[.,!?;:"«»]/g,'').toLowerCase().replace(/[’]/g,"'").split(/\s+/).filter(Boolean);
  const u=tok(user),cw=correct.split(/\s+/),c=tok(correct);
  const n=u.length,m=c.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=u[i]===c[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Set();let i=0,j=0;while(i<n&&j<m){if(u[i]===c[j]){hit.add(j);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return cw.map((w,k)=>hit.has(k)?`<span class="dok">${esc(w)}</span>`:`<span class="dmiss">${esc(w)}</span>`).join(' ');
}

    </div>`}
    <div class="slist">${list.map((s,i)=>`<div class="srow2"><span class="snum tnum">${i+1}</span><div class="t"><div class="en">${esc(s.en)}</div><div class="uz ${hide?'blur':''}" data-reveal="1" ${hide?'role="button" tabindex="0" title="Ko\'rish uchun bosing"':''}>${esc(s.uz)}</div>${q?`<small class="muted">${s.lvl} · ${esc(STOP[s.top].name)}</small>`:''}</div>${sayBtn(s.en)}</div>`).join('')||'<div class="empty">Hech narsa topilmadi.</div>'}</div>
  </div>`;
}

const VERB_S={go:"goes",do:"does",have:"has",want:"wants",like:"likes",work:"works",live:"lives",play:"plays",watch:"watches",need:"needs",know:"knows",say:"says",make:"makes",take:"takes",come:"comes",see:"sees",get:"gets",think:"thinks",eat:"eats",drink:"drinks",read:"reads",write:"writes",speak:"speaks",study:"studies",love:"loves",teach:"teaches",try:"tries",use:"uses",help:"helps",feel:"feels"};
const IRR_BASE={went:"go",ate:"eat",saw:"see",came:"come",did:"do",took:"take",made:"make",bought:"buy",wrote:"write",spoke:"speak",gave:"give",got:"get",found:"find",left:"leave",told:"tell",said:"say",thought:"think",knew:"know",met:"meet",had:"have",was:"be",were:"be",ran:"run",drank:"drink",slept:"sleep",paid:"pay",sent:"send"};
const GRULES=[
{re:/\b(he|she|it|my \w+|this|that)\s+(go|do|have|want|like|work|live|play|watch|need|know|say|make|take|come|see|get|think|eat|drink|read|write|speak|study|love|teach|try|use|help|feel)\b/gi,
 fix:(m,s,v,off,str)=>{if(MODALS_BEFORE.test(str.slice(0,off)))return null;return s+' '+VERB_S[v.toLowerCase()]},note:"He/she/it bilan Present Simple fe'li -s oladi."},
{re:/\b(I)\s+(is|are)\b/g,fix:()=>"I am",note:"I bilan doim am."},
{re:/\b(he|she|it)\s+are\b/gi,fix:(m,s)=>s+" is",note:"He/she/it bilan is."},
{re:/\b(you|we|they)\s+is\b/gi,fix:(m,s)=>s+" are",note:"You/we/they bilan are."},
{re:/\b(he|she|it)\s+don't\b/gi,fix:(m,s)=>s+" doesn't",note:"He/she/it bilan doesn't."},
{re:/\b(did(?:n't| not)?)\s+(\w+\s+)?(went|ate|saw|came|did|took|made|bought|wrote|spoke|gave|got|found|left|told|said|thought|knew|met|had|ran|drank|slept|paid|sent)\b/gi,fix:(m,d,mid,v)=>d+' '+(mid||'')+IRR_BASE[v.toLowerCase()],note:"did dan keyin fe'l asl (V1) shaklda bo'ladi."},
{re:/\bmore\s+(better|worse|bigger|smaller|easier|harder|faster|cheaper|older|younger|taller|longer|happier|nicer|larger|higher)\b/gi,fix:(m,a)=>a,note:"-er bilan more birga ishlatilmaydi."},
{re:/\b(a)\s+((?!uni|use|usu|eu|one|once)[aeiou]\w*)/gi,fix:(m,a,w)=>(a==='A'?'An':'an')+' '+w,note:"Unli tovushdan oldin an."},
{re:/\b(I|we|they|you)\s+(am|are)\s+agree\b/gi,fix:(m,s)=>s+" agree",note:"agree — fe'l, to be kerak emas: I agree."},
{re:/\b(I|he|she|we|they)\s+(have|has)\s+(\d+)\s+years(\s+old)?\b/gi,fix:(m,s,h,n)=>s+' '+({i:'am',he:'is',she:'is'}[s.toLowerCase()]||'are')+' '+n+' years old',note:"Yosh to be bilan aytiladi: I am 25 years old."},
{re:/\b(peoples|childrens|informations|advices|furnitures|homeworks|equipments|luggages)\b/gi,fix:(m,w)=>({peoples:'people',childrens:'children',informations:'information',advices:'advice',furnitures:'furniture',homeworks:'homework',equipments:'equipment',luggages:'luggage'})[w.toLowerCase()],note:"Bu so'z ko'plik -s olmaydi."},
{re:/\bdepends?\s+of\b/gi,fix:m=>m.replace(/of$/i,'on'),note:"depend ON."},
{re:/\binterested\s+(about|for|with)\b/gi,fix:()=>"interested in",note:"interested IN."},
{re:/\bmarried\s+with\b/gi,fix:()=>"married to",note:"married TO."},
{re:/\b(explain|say)\s+(me|him|her|us|them)\b/gi,fix:(m,v,o)=>v.toLowerCase()==='say'?'tell '+o:'explain to '+o,note:"explain TO me / tell me (say me emas)."},
{re:/\bin\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/gi,fix:(m,d)=>'on '+d,note:"Hafta kunlari bilan ON."},
{re:/\bat\s+(morning|evening|afternoon)\b/gi,fix:(m,p)=>'in the '+p,note:"in the morning / in the evening."},
{re:/\bin\s+night\b/gi,fix:()=>"at night",note:"at night."},
{re:/\b(can|must|should|will|could|would)\s+to\s+(\w+)/gi,fix:(m,mo,v)=>mo+' '+v,note:"Modal fe'ldan keyin to ishlatilmaydi."},
{re:/\b(make|making|made)\s+(homework|exercise|sport|my homework)\b/gi,fix:(m,v,o)=>({make:'do',making:'doing',made:'did'})[v.toLowerCase()]+' '+o,note:"Uy vazifasi va mashq — DO."},
{re:/\bI\s+very\s+(like|love|want|enjoy)\b/gi,fix:(m,v)=>'I really '+v,note:"very fe'ldan oldin kelmaydi: I really like / I like it very much."},
{re:/\bmany\s+(money|time|information|water|work|homework|advice|traffic)\b/gi,fix:(m,n)=>'much '+n,note:"Sanalmaydigan ot bilan much."},
{re:/\bmuch\s+(people|friends|books|cars|students|things|countries|problems)\b/gi,fix:(m,n)=>'many '+n,note:"Sanaladigan ko'plik bilan many."},
{re:/\bevery\s+(days|weeks|years|mornings|evenings|students|people|times)\b/gi,fix:(m,n)=>'every '+({days:'day',weeks:'week',years:'year',mornings:'morning',evenings:'evening',students:'student',people:'person',times:'time'})[n.toLowerCase()],note:"every dan keyin birlik ot."},
{re:/\b(when|if|as soon as|before|after|until)\s+(I|you|he|she|we|they|it)\s+will\s+(\w+)/gi,fix:(m,c,s,v)=>c+' '+s+' '+v,note:"when/if dan keyin kelajakda ham Present Simple."},
{re:/\b(I|you|he|she|it|we|they)\s+(am|is|are)\s+(knowing|wanting|liking|needing|understanding|believing|loving|hating|owning)\b/gi,fix:(m,s,b,v)=>{const base={knowing:'know',wanting:'want',liking:'like',needing:'need',understanding:'understand',believing:'believe',loving:'love',hating:'hate',owning:'own'}[v.toLowerCase()];return s+' '+(/^(he|she|it)$/i.test(s)?VERB_S[base]||base+'s':base)},note:"Holat fe'llari (know, want, like…) Continuous'da ishlatilmaydi."},
{re:/\b(the)\s+(life|nature|music|love|money)\s+(is|are)\b/gi,fix:(m,t,n,b)=>n.charAt(0).toUpperCase()+n.slice(1)+' '+b,note:"Umumiy ma'noda artikl kerak emas: Life is…"},
{re:/\bhow\s+to\s+say\s+in\s+english\b/gi,fix:()=>"how do you say it in English",note:"To'g'ri savol: How do you say it in English?"},
{re:/\bI\s+have\s+(a\s+)?(cold|headache)\s+since\b/gi,fix:m=>m.replace(/have/i,'have had'),note:"since bilan Present Perfect."}
];
function checkGrammar(text){
  let out=text;const notes=[];
  GRULES.forEach(r=>{out=out.replace(r.re,(...a)=>{const m=a[0];const off=a[a.length-2];const res=r.fix(...a);if(res==null||res===m)return m;notes.push({from:m,to:res,note:r.note});return res})});
  out=out.replace(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|june|july|august|september|october|november|december|english|uzbekistan|tashkent)\b/g,w=>w[0].toUpperCase()+w.slice(1));
  out=out.replace(/(^|[.!?]\s+)([a-z])/g,(m,p,c)=>p+c.toUpperCase()).replace(/\bi\b/g,'I');
  return{fixed:out,notes};
}
/* ================= SPEAKING: recognition, dialogues, shadowing, free speech, AI partner ================= */
const SRClass=(typeof window!=='undefined')&&(window.SpeechRecognition||window.webkitSpeechRecognition);
let REC=null;const MIC={on:false,live:''};
function startListen(onDone){
  if(!SRClass){toast("Bu brauzer nutqni tanimaydi. Chrome yoki Safari'dan foydalaning yoki yozib javob bering.");return}
  try{if(REC)REC.abort()}catch(e){}
  let alts=[],interim='';
  try{REC=new SRClass()}catch(e){toast("Mikrofonni ishga tushirib bo'lmadi");return}
  REC.lang='en-US';REC.interimResults=true;REC.maxAlternatives=4;REC.continuous=false;
  REC.onresult=e=>{interim='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){alts=[...r].map(x=>x.transcript.trim())}else interim+=r[0].transcript}
    MIC.live=alts[0]||interim;const el=document.getElementById('miclive');if(el)el.textContent=MIC.live||'…'};
  REC.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast("Mikrofonga ruxsat berilmadi. Brauzer sozlamalaridan ruxsat bering.");else if(e.error==='no-speech')toast("Ovoz eshitilmadi. Yana urinib ko'ring.");};
  REC.onend=()=>{MIC.on=false;const res=alts.length?alts:(interim?[interim]:[]);MIC.live='';if(res.length){P.speak.said=(P.speak.said||0)+1;save()}onDone(res);if(!res.length)rerender()};
  MIC.on=true;MIC.live='';
  try{speechSynthesis.cancel()}catch(e){}
  try{REC.start()}catch(e){MIC.on=false;toast("Mikrofonni ishga tushirib bo'lmadi")}
  rerender();
}
function stopListen(){try{REC&&REC.stop()}catch(e){}}
const micBtn=(act,label='Gapirish')=>`<div class="micwrap"><button class="mic ${MIC.on?'on':''}" data-mic="${act}" aria-label="${MIC.on?'To\'xtatish':label}"><svg viewBox="0 0 24 24" class="i"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button><div class="miclive" id="miclive">${MIC.on?esc(MIC.live||'Eshityapman…'):(SRClass?esc(label):'Mikrofon yo\'q — pastda yozing')}</div></div>`;
const toks=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
function simScore(a,b){const x=toks(a),y=toks(b);if(!x.length||!y.length)return 0;const dp=Array.from({length:x.length+1},()=>new Array(y.length+1).fill(0));
  for(let i=1;i<=x.length;i++)for(let j=1;j<=y.length;j++)dp[i][j]=x[i-1]===y[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  return Math.round(200*dp[x.length][y.length]/(x.length+y.length))}
function bestMatch(alts,targets){let best={s:-1,a:'',t:''};alts.forEach(a=>targets.forEach(t=>{const s=simScore(a,t);if(s>best.s)best={s,a,t}}));return best}
function fixHTML(orig,fixed){const a=orig.split(/\s+/),b=fixed.split(/\s+/);const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  const eq=(p,q)=>p.toLowerCase()===q.toLowerCase();
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=eq(a[i],b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out=[];while(i<n||j<m){if(i<n&&j<m&&eq(a[i],b[j])){out.push(esc(b[j]));i++;j++}else if(j<m&&(i>=n||dp[i][j+1]>=dp[i+1][j])){out.push(`<ins>${esc(b[j])}</ins>`);j++}else{out.push(`<del>${esc(a[i])}</del>`);i++}}
  return out.join(' ')}
const scoreClass=s=>s>=85?'great':s>=60?'ok':'low';
const scoreWord=s=>s>=90?"A'lo!":s>=75?'Juda yaxshi':s>=60?'Yaxshi':s>=40?'Yaxshiroq urinib ko\'ring':'Tushunilmadi';
function sayRate(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u)}catch(e){}}

  ${SRClass?'':`<div class="note n">Bu brauzer nutqni tanimaydi. Mac'da <b>Google Chrome</b> yoki Safari'ning yangi versiyasidan foydalaning. Hozircha javoblarni yozib kiritishingiz mumkin.</div>`}
  <div class="grid g2">
    ${card('dlg','🎭','Rolli dialoglar',`${DIALOGS.length} ta hayotiy vaziyat: kafe, aeroport, shifokor, ishga suhbat… Emma gapiradi, siz javob berasiz.`,`${Object.keys(sp.dlg||{}).length} / ${DIALOGS.length} tugatildi`)}
    ${card('shadow','🗣️','Talaffuz mashqi',`${SENTS.length} ta gapni tinglang va takrorlang — har bir so'z bo'yicha ball olasiz.`,sp.shN?`o'rtacha ${Math.round(sp.shSum/sp.shN)}% · ${sp.shN} ta gap`:'')}
    ${card('free','✍️','Erkin gapirish + tuzatish','Mavzu bo\'yicha gapiring yoki yozing — ilova grammatik xatolarni topib, to\'g\'risini ko\'rsatadi.',sp.freeN?`${sp.freeN} ta tekshiruv`:'')}
    ${card('ai','🤖','AI suhbatdosh',"Haqiqiy erkin suhbat: istalgan mavzuda gaplashadi va har xatoingizni tushuntiradi (bepul Gemini kaliti bilan).",aiKey()?'ulangan':'sozlash kerak')}
  </div>
  <div class="neu-sm pad tipbox"><b>Qanday tez gapirib ketish mumkin?</b>
    <ol><li>Har kuni 1 ta dialog — tayyor iboralarni og'zingizga o'rgatadi.</li><li>10 ta gapni talaffuz qilib takrorlang (shadowing) — tilingiz ingliz tovushlariga ko'nikadi.</li><li>Kun oxirida 1–2 daqiqa erkin gapiring — xatolaringizni ko'rasiz va tuzatasiz.</li></ol></div>`;
}

/* ---------- dialogues ---------- */
let DG=null;
function startDialog(id){const d=DIALOGS.find(x=>x.id===id);DG={d,i:0,log:[{who:'bot',text:d.turns[0].bot,uz:d.turns[0].uz}],tries:0,scores:[],showModel:false,pending:null,spoke:-1,done:false};go('dialog')}
function vDialogList(){
  const sp=P.speak.dlg||{};
  return`<div class="top"><button class="ibtn" data-go="speak" aria-label="Orqaga">${ic('left')}</button><div class="grow"><div class="eyebrow">Suhbat</div><h1 style="margin-top:4px">Rolli dialoglar</h1></div></div>
  <div class="grid g3">${DIALOGS.map(d=>`<button class="dlgcard neu-sm" data-dlg="${d.id}"><span class="dlgic">${d.icon}</span><div class="grow"><b>${esc(d.title)}</b><small>${esc(d.uz)}</small><div class="row"><span class="lvl">${d.lvl}</span><span class="muted tnum" style="font-size:12px;font-weight:700">${d.turns.length} navbat</span>${sp[d.id]!=null?`<span class="badge ${scoreClass(sp[d.id])}">${sp[d.id]}%</span>`:''}</div></div></button>`).join('')}</div>`;
}
function vDialog(){
  if(!DG)return vDialogList();
  const d=DG.d;const t=d.turns[DG.i];
  const bubbles=DG.log.map(m=>m.who==='bot'?`<div class="bub bot"><span class="av">${d.icon}</span><div><p>${esc(m.text)} ${sayBtn(m.text)}</p><small>${esc(m.uz)}</small></div></div>`:
    `<div class="bub me ${m.score!=null?scoreClass(m.score):''}"><div><p>${esc(m.text)}</p>${m.score!=null?`<small class="sc">${m.score}% · ${scoreWord(m.score)}</small>`:''}${m.fix?`<div class="fixline">${fixHTML(m.text,m.fix)}</div>`:''}${m.model?`<small class="model">Namuna: ${esc(m.model)}</small>`:''}</div></div>`).join('');
  if(DG.done){const avg=Math.round(DG.scores.reduce((a,b)=>a+b,0)/Math.max(1,DG.scores.length));
    return`<div class="top"><button class="ibtn" data-sgo="dlg" aria-label="Orqaga">${ic('left')}</button><div class="grow"><div class="eyebrow">${d.lvl} · ${esc(d.title)}</div></div></div>
    <div class="chat neu">${bubbles}</div>
    <div class="sess neu result"><div class="eyebrow">Dialog tugadi</div><div class="score">${avg}%</div><p class="muted">${scoreWord(avg)} · +${Math.round(avg/5)} XP</p>
    <div class="fbtns"><button class="btn" data-sgo="dlg">${ic('left')} Dialoglar</button><button class="btn primary" data-dlg="${d.id}">${ic('refresh')} Qayta o'ynash</button></div></div>`}
  return`<div class="top"><button class="ibtn" data-sgo="dlg" aria-label="Orqaga">${ic('left')}</button><div class="grow"><div class="eyebrow">${d.lvl} · ${esc(d.title)} · ${DG.i+1} / ${d.turns.length}</div></div></div>
  <div class="chat neu" id="chatbox">${bubbles}</div>
  <div class="answerbox neu">
    <div class="task"><span class="eyebrow">Vazifa</span><b>${esc(t.task)}</b>
      ${DG.showModel?`<p class="modelans">${esc(t.ans[0])} ${sayBtn(t.ans[0])}</p>`:`<button class="btn sm" data-dmodel="1">${ic('star')} Namuna javob</button>`}</div>
    ${DG.pending?`<div class="note ${DG.pending.ok?'y':'n'}">${DG.pending.ok?"Yaxshi javob!":"Unchalik tushunilmadi. Namunani tinglab, yana urinib ko'ring."}</div>
      <div class="fbtns">${DG.pending.ok||DG.tries>=2?`<button class="btn primary" data-dnext="1" id="dnext">Davom etish ${ic('right')}</button>`:''}${!DG.pending.ok?`<button class="btn" data-dretry="1">${ic('refresh')} Qayta aytish</button>`:''}</div>`:
    `${micBtn('dlg','Bosing va javob bering')}
    <form class="tin" id="dform"><div class="ins"><input id="din" autocomplete="off" placeholder="…yoki yozing" aria-label="Javob"></div><button class="btn" type="submit">Yuborish</button></form>`}
  </div>`;
}
function afterDialog(){if(!DG||DG.done)return;const t=DG.d.turns[DG.i];if(DG.spoke!==DG.i){DG.spoke=DG.i;setTimeout(()=>say(t.bot),350)}
  const c=$('#chatbox');if(c)c.scrollTop=c.scrollHeight;const n=$('#dnext');if(n)n.focus({preventScroll:true})}
function dialogAnswer(alts){
  if(!alts.length)return;const t=DG.d.turns[DG.i];const b=bestMatch(alts,t.ans);
  const flexible=t.ans.some(a=>a.length<16);const ok=b.s>=60||(flexible&&b.s>=45);
  const g=checkGrammar(b.a);
  DG.log.push({who:'me',text:b.a,score:b.s,fix:g.notes.length?g.fixed:'',model:ok?'':t.ans[0]});
  DG.pending={ok};if(ok){DG.scores.push(b.s)}else{DG.tries++;if(DG.tries>=2)DG.scores.push(b.s)}
  rerender();
}
function dialogNext(){const d=DG.d;DG.i++;DG.tries=0;DG.pending=null;DG.showModel=false;
  if(DG.i>=d.turns.length){DG.done=true;const avg=Math.round(DG.scores.reduce((a,b)=>a+b,0)/Math.max(1,DG.scores.length));P.speak.dlg=P.speak.dlg||{};P.speak.dlg[d.id]=Math.max(P.speak.dlg[d.id]||0,avg);addXP(Math.round(avg/5));logSession('dialog',avg,100);checkAch()}
  else DG.log.push({who:'bot',text:d.turns[DG.i].bot,uz:d.turns[DG.i].uz});
  render()}

/* ---------- shadowing ---------- */
let SH=null;
function nextShadow(){const L=SH&&SH.lvl||focusLevel();const pool=SENTS.filter(s=>s.lvl===L&&s.en.split(' ').length<=14);SH={lvl:L,s:pick(pool),res:null,spoke:false}}
function vShadow(){
  if(!SH)nextShadow();const s=SH.s;const r=SH.res;
  return`<div class="top"><button class="ibtn" data-go="speak" aria-label="Orqaga">${ic('left')}</button><div class="grow"><div class="eyebrow">Suhbat</div><h1 style="margin-top:4px">Talaffuz mashqi</h1></div></div>
  <div class="chips">${LEVELS.map(l=>`<button class="chip ${SH.lvl===l?'on':''}" data-shl="${l}">${l}</button>`).join('')}</div>
  <div class="sess neu">
    <div class="prompt ins"><div class="hint">1. Tinglang · 2. Takrorlang</div><div class="big shbig">${esc(s.en)}</div><small class="muted">${esc(s.uz)}</small>
      <div class="fbtns"><button class="btn sm" data-sayr="1">${ic('say')} Oddiy</button><button class="btn sm" data-sayr="0.6">${ic('say')} Sekin</button></div></div>
    ${r?`<div class="shres ${scoreClass(r.s)}"><div class="ring big" style="--p:${r.s}"><span class="tnum">${r.s}%</span></div><div><b>${scoreWord(r.s)}</b><p class="dictline">${diffHTML(r.a,s.en)}</p><small class="muted">Siz: «${esc(r.a)}»</small></div></div>
      <p class="muted" style="font-size:13px">Qizil so'zlarni alohida tinglab, yana bir bor ayting.</p>
      <div class="fbtns"><button class="btn" data-shretry="1">${ic('refresh')} Qayta</button><button class="btn primary" data-shnext="1" id="shnext">Keyingi gap ${ic('right')}</button></div>`:micBtn('shadow','Bosing va gapni ayting')}
  </div>`;
}
function shadowResult(alts){if(!alts.length)return;const b=bestMatch(alts,[SH.s.en]);SH.res={s:b.s,a:b.a};P.speak.shN=(P.speak.shN||0)+1;P.speak.shSum=(P.speak.shSum||0)+b.s;if(b.s===100)P.speak.perfect=(P.speak.perfect||0)+1;addXP(b.s>=60?2:1);save();checkAch();rerender()}

let FR={topic:0,text:'',res:null};
function vFree(){
  const tp=TALK_TOPICS[FR.topic];const r=FR.res;

function startWordle(sel){let pool=wordPool(sel).filter(w=>/^[a-z]{5}$/.test(w.en));if(pool.length<5)pool=WORDS.filter(w=>/^[a-z]{5}$/.test(w.en)&&(w.lvl==='A1'||w.lvl==='A2'));
  WD={sel,w:pick(pool),rows:[],cur:'',over:false,won:false,keys:{},shake:false,hint:false};go('wordle')}
function wdScore(g,ans){const r=Array(5).fill('b');const a=ans.split('');const used=Array(5).fill(false);
  for(let i=0;i<5;i++)if(g[i]===a[i]){r[i]='g';used[i]=true}
  for(let i=0;i<5;i++)if(r[i]!=='g'){const j=a.findIndex((c,k)=>!used[k]&&c===g[i]);if(j>=0){r[i]='y';used[j]=true}}return r}
function wdKey(k){if(!WD||WD.over)return;if(k==='enter'){if(WD.cur.length<5){WD.shake=true;render();setTimeout(()=>{WD.shake=false},400);return}
    const sc=wdScore(WD.cur,WD.w.en);WD.rows.push({g:WD.cur,sc});[...WD.cur].forEach((c,i)=>{const p={g:3,y:2,b:1}[sc[i]];if((WD.keys[c]||0)<p)WD.keys[c]=p});
    if(WD.cur===WD.w.en){WD.over=true;WD.won=true}else if(WD.rows.length>=6)WD.over=true;WD.cur='';
    if(WD.over){P.wd=P.wd||{played:0,won:0,streak:0,best:0};P.wd.played++;if(WD.won){P.wd.won++;P.wd.streak++;P.wd.best=Math.max(P.wd.best,P.wd.streak);srsAdd(WD.w);addXP(7-WD.rows.length+3)}else P.wd.streak=0;save();logSession('wordle',WD.won?7-WD.rows.length:0,6);checkAch();say(WD.w.en)}
    render();return}
  if(k==='back'){WD.cur=WD.cur.slice(0,-1);render();return}
  if(/^[a-z]$/.test(k)&&WD.cur.length<5){WD.cur+=k;render()}}

let TF=null;
function startTF(){const items=[];const lv=focusLevel();const li=LEVELS.indexOf(lv);
  const ts=GRAMMAR.filter(t=>LEVELS.indexOf(t.lvl)<=Math.min(5,li+1));
  shuf(ts).forEach(t=>{items.push({s:t.m[0],ok:false,fix:t.m[1],t});items.push({s:pick(t.ex.filter(e=>!/[«»→]/.test(e[0])))[0],ok:true,t})});
  const q=[];const bad=shuf(items.filter(x=>!x.ok)).slice(0,8),good=shuf(items.filter(x=>x.ok)).slice(0,7);
  TF={q:shuf([...bad,...good]),i:0,score:0,ans:null,left:10,streak:0};go('tf');tfTimer()}
function tfTimer(){clearInterval(TF.tm);TF.left=10;TF.tm=setInterval(()=>{if(R.v!=='tf'||!TF||TF.ans!==null){clearInterval(TF.tm);return}TF.left-=.1;const b=$('#tftime');if(b)b.style.width=(TF.left*10)+'%';if(TF.left<=0){clearInterval(TF.tm);tfAnswer(null)}},100)}
function tfAnswer(v){if(TF.ans!==null)return;const it=TF.q[TF.i];TF.ans=v;const ok=v===it.ok;if(ok){TF.score++;TF.streak++}else TF.streak=0;render()}
function tfNext(){TF.i++;TF.ans=null;if(TF.i>=TF.q.length){TF.rec=setBest('tf',TF.score);addXP(TF.score*2);logSession('tf',TF.score,TF.q.length);checkAch();render();return}render();tfTimer()}
function vTF(){

const DB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('inglizcha-ustoz-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(mode){return this.db.transaction('img',mode).objectStore('img')},
  put(k,blob){return new Promise((res,rej)=>{const q=this.tx('readwrite').put(blob,k);q.onsuccess=res;q.onerror=()=>rej(q.error)})},
  del(k){return new Promise(res=>{const q=this.tx('readwrite').delete(k);q.onsuccess=res;q.onerror=res})},
  clear(){return new Promise(res=>{const q=this.tx('readwrite').clear();q.onsuccess=res;q.onerror=res})},
  all(){return new Promise((res,rej)=>{const st=this.tx('readonly');const out=[];const c=st.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};

}

let QA={};
const FXAUX=/^(am|is|are|was|were|be|been|being|have|has|had|do|does|did|don't|doesn't|didn't|isn't|aren't|wasn't|weren't|haven't|hasn't|hadn't|will|won't|would|shall|can|can't|could|must|mustn't|should|shouldn't|might|may|not|going to|used to|use to|would like|would have|wouldn't have|must have|can't have|should have|needn't have|didn't need to|will be able to|been able to|be able to|have to|has to|had better|would rather|get|will be|will have|would be|modal|yordamchi|n't|use|been able to)$/i;
function fxClass(s){const t=s.replace(/[?.!]+$/,'').replace(/\s*\(.*\)\s*$/,'').trim();
  if(/^(S\b|Ega\b|kishi\b|I\b(?! \+)|He\b|She\b|It\b(?! \+ is said)|You\b|We\b|They\b)/.test(t)&&!/^It (is|'s|seems|appears)/.test(t))return's';
  if(/\b(V1|V2|V3|V-ing|V-ed)\b|^V$|^V \b/.test(t))return'v';
  if(t.split(/\s*\/\s*/).every(a=>FXAUX.test(a.trim())))return'a';
  if(/^(If|if|When|when|While|Unless|unless|Although|Despite|despite|However|Had|Should|Were|Never|Rarely|Not only|No sooner|Hardly|Little|Such|So|so|such|The|It|What|Whatever|Whoever|However|No matter|for|for \/ since|since|that|than|as|to|because|but|and|or|nor|either|neither|both|until|before|after|as soon as|by|in order to|so that|so as not to|There|Let's|Don't|Wh-|Who|Whose|How long|What would|Could you tell me|Do you know|Would you like|I was wondering|I wish|wish|if \/ whether|who|which|whose|where|than|when \/ as soon as \/ until|Shall|Neither \/ Nor|too|enough|as \+|the|a|an|predlog|than)\b/.test(t))return'c';
  return'o'}
function fxChips(f){const parts=f.replace(/,\s/g,' + , + ').split(' + ');let out='';parts.forEach((p,i)=>{const s=p.trim();if(!s)return;if(s===','){out+='<span class="fxcomma">,</span>';return}if(out&&!out.endsWith('</span><span class="fxcomma">,</span>')&&i>0&&parts[i-1].trim()!==',')out+='<span class="fxplus">+</span>';out+=`<span class="fxc ${fxClass(s)}">${esc(s)}</span>`});return out}
function fxCard(t){const rows=FX[t.id];if(!rows)return'';
  const sign=g=>g==='+'?'<span class="fxs plus" title="Ijobiy">+</span>':g==='−'?'<span class="fxs minus" title="Inkor">−</span>':g==='?'?'<span class="fxs q" title="So\'roq">?</span>':g==='− / ?'?'<span class="fxs q">−?</span>':`<span class="fxs lab">${esc(g)}</span>`;
  return`<div class="fxcard">${rows.map(([g,f,e])=>`<div class="fxrow">${sign(g)}<div class="fxbody"><div class="fxf">${fxChips(f)}</div><div class="fxe"><span>${esc(e)}</span>${sayBtn(e)}</div></div></div>`).join('')}
    <div class="flegend"><span><i class="fxdot s"></i>Ega (S)</span><span><i class="fxdot a"></i>Yordamchi fe'l</span><span><i class="fxdot v"></i>Asosiy fe'l</span><span><i class="fxdot c"></i>Bog'lovchi / signal so'z</span><span><i class="fxdot o"></i>Boshqa qism</span></div></div>`}

function loadStudioImage(file){if(!file||!/^image\//.test(file.type)){toast('Bu rasm fayli emas');return}

function cellCanvas(idx,size=320){
  const im=ST.img,g=ST.grid,W=im.naturalWidth,H=im.naturalHeight;const cw=W/g,ch=H/g;const r=Math.floor(idx/g),c=idx%g;
  const p=ST.inset/100;let sx=c*cw+cw*p,sy=r*ch+ch*p,sw=cw*(1-2*p),sh=ch*(1-2*p);
  const s=Math.min(sw,sh);sx+=(sw-s)/2;sy+=(sh-s)/2;
  const cv=document.createElement('canvas');cv.width=cv.height=size;const cx=cv.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(im,sx,sy,s,s,0,0,size,size);return cv}

  if(d.npage){const {pages}=notesBatch();ST.npage=(ST.npage+(+d.npage)+pages)%pages;rerender();return}
  /* studio */
  if(d.studio){ST.sel=d.studio;ST.page=0;ST.img=null;go('studio');return}
  if(d.ssel){ST.sel=d.ssel;ST.page=0;ST.img=null;rerender();return}
  if(d.spage){const {pages}=studioBatch();ST.page=(ST.page+(+d.spage)+pages)%pages;ST.img=null;rerender();return}
  if(d.scopy){const ta=$('#sprompt');const txt=ta.value;
    const done=()=>toast("Prompt nusxalandi — Gemini'ga qo'ying");
    const fallback=()=>{ta.focus();ta.select();try{document.execCommand('copy');done()}catch(err){toast('Matn belgilandi — ⌘C bosing')}};
    try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}return}
  if(d.sreset){ST.img=null;ST.tiles=null;rerender();return}
  if(d.ssave){saveTiles();return}
  if(d.szip){exportZip().catch(err=>toast('ZIP xatosi: '+err.message));return}
  if(d.sclear){if(d.sclear==='1'){ST.confirmClear=true;rerender()}else if(d.sclear==='0'){ST.confirmClear=false;rerender()}else{DB.clear().then(()=>{LOCAL.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});LOCAL.clear();ST.confirmClear=false;rerender();toast("Rasmlar o'chirildi")})}return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='aiauto'){AI.auto=e.target.checked;return}
  if(e.target.id==='restore'&&e.target.files[0]){backupRestore(e.target.files[0]);return}
  if(e.target.id==='ftext'){FR.text=e.target.value;return}
  if(e.target.id==='hideuz'){P.hideUz=e.target.checked;save();rerender();return}
  if(e.target.dataset&&e.target.dataset.mnote){const k=e.target.dataset.mnote;NOTES[k]=Object.assign({},NOTES[k]||{},{mn:e.target.value.trim()});saveNotes();toast('Eslatma saqlandi')}
  if(e.target.id==='sgrid'){ST.grid=+e.target.value;ST.page=0;ST.img=null;rerender()}
  if(e.target.id==='sall'){ST.showAll=e.target.checked;ST.page=0;ST.img=null;rerender()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='wsearch'){R.q=e.target.value;R.focus='wsearch';render()}
  if(e.target.id==='ssearch'){R.sq=e.target.value;R.focus='ssearch';render()}
  if(e.target.id==='isearch'){R.iq=e.target.value;R.focus='isearch';render()}
  if(e.target.id==='sinset'){ST.inset=+e.target.value;const l=e.target.previousElementSibling;if(l)l.textContent="Chetidan kesish: "+ST.inset+"%";drawTiles()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='dform'){e.preventDefault();const v=$('#din').value.trim();if(v)dialogAnswer([v]);return}
  if(e.target.id==='aiform'){e.preventDefault();const v=$('#aiin').value.trim();if(v)aiSend(v);return}
  if(e.target.id==='rnform'){e.preventDefault();const i=$('#rnin');const ok=rainType(i.value);i.classList.toggle('wrongin',!ok&&!!i.value.trim());if(ok)i.value='';else{i.select()}if(RN&&RN.over)return;return}if(e.target.id==='lform'){e.preventDefault();const v=$('#lin').value;if(!v.trim())return;LN.typed=v;LN.pick=-1;const t=LN.tasks[LN.ti];learnAnswer(norm(v)===norm(t.w.en)||t.w.en.split(/[,/]/).map(norm).includes(norm(v)));return}
  if(e.target.id==='tform'){e.preventDefault();const v=$('#tin').value;if(!v.trim())return;S.typed=v;const q=S.qs[S.i];
  if(q.type==='dict'){answer(norm(v)===norm(q.ans));return}
  const alts=q.ans.split(/,|;|\//).map(norm);answer(alts.includes(norm(v))||norm(v)===norm(q.ans))}});
document.addEventListener('paste',e=>{if(R.v!=='studio'||ST.img)return;const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.type.startsWith('image/'));if(it){e.preventDefault();loadStudioImage(it.getAsFile())}});
document.addEventListener('keydown',e=>{
  const inField=e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT');
  if(R.v==='wordle'&&WD&&!WD.over&&!inField&&!e.metaKey&&!e.ctrlKey){if(e.key==='Enter'){e.preventDefault();wdKey('enter');return}if(e.key==='Backspace'){wdKey('back');return}if(/^[a-zA-Z]$/.test(e.key)){wdKey(e.key.toLowerCase());return}}
  if(R.v==='speed'&&SP&&!SP.over&&/^[1-4]$/.test(e.key)&&!inField){speedAnswer(+e.key-1);return}
  if(R.v==='tf'&&TF&&TF.i<TF.q.length&&!inField){if(TF.ans===null){if(e.key==='ArrowLeft'||e.key==='1'){tfAnswer(false);return}if(e.key==='ArrowRight'||e.key==='2'){tfAnswer(true);return}}else if(e.key==='Enter'&&e.target.id!=='tfnext'){e.preventDefault();tfNext();return}}
  if(R.v==='flash'&&F&&F.i<F.deck.length){if((e.key===' '||e.key==='Enter')&&e.target.closest&&e.target.closest('[data-flip]')){e.preventDefault();F.flip=!F.flip;$('.fcard').classList.toggle('flip',F.flip)}}
  if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')&&R.v!=='session')return;
  if(R.v==='review'&&RV&&RV.i<RV.q.length){if(!RV.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();RV.shown=true;render();return}if(RV.shown&&/^[123]$/.test(e.key)){reviewRate(+e.key);return}}
  if(R.v==='learn'&&LN&&LN.phase==='quiz'&&LN.ans!==null&&e.key==='Enter'&&e.target.id!=='lgo'){e.preventDefault();learnNext();return}
  if(R.v==='learn'&&LN&&LN.phase==='quiz'&&LN.ans===null&&/^[1-4]$/.test(e.key)){const t=LN.tasks[LN.ti];if(t.opts){LN.pick=+e.key-1;learnAnswer(t.opts[LN.pick]===(t.k==='rec'?t.w.uz:t.w.en))}return}
  if(R.v==='session'&&S&&S.done&&e.key==='Enter'&&e.target.id!=='nextbtn'){e.preventDefault();nextQ()}
  if(R.v==='session'&&S&&!S.done&&S.qs[S.i]&&S.qs[S.i].type==='mc'&&/^[1-4]$/.test(e.key)&&e.target.tagName!=='INPUT'){const i=+e.key-1;if(i<S.qs[S.i].opts.length){S.pick=i;answer(i===S.qs[S.i].ans)}}
});
if(location.hash==='#studio')R={v:'studio'};
render();loadManifest();loadLocal();loadDeployNotes();
</script>
</body>
</html>
