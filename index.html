<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ingliz tilini o'rganish ilovasi: grammatika, 1000+ so'z, frazalar va mashqlar">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Inglizcha Ustoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: soft clay surface; sidebar on desktop, bottom tab bar on phones; content in raised neumorphic panels */
:root{
  --bg:#E6EBF2; --hi:#FFFFFF; --lo:#C1C9D7; --fg:#273044; --muted:#626D84; --line:#D3DAE5;
  --accent:#4660DC; --accent-2:#6E7FF0; --accent-soft:#D9DFFA; --on-accent:#FFFFFF;
  --ok:#17946A; --ok-soft:#D3EFE3; --bad:#CC4339; --bad-soft:#F6DCD9; --gold:#B7800C;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-lg:26px; --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#242932; --hi:#2E343F; --lo:#181C22; --fg:#E3E8F1; --muted:#9BA5B7; --line:#353C48;
  --accent:#8B9CFF; --accent-2:#A9B6FF; --accent-soft:#30385A; --on-accent:#141A33;
  --ok:#4DCB9B; --ok-soft:#1F3A31; --bad:#FF7F74; --bad-soft:#47282A; --gold:#E3B34A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#242932; --hi:#2E343F; --lo:#181C22; --fg:#E3E8F1; --muted:#9BA5B7; --line:#353C48;
  --accent:#8B9CFF; --accent-2:#A9B6FF; --accent-soft:#30385A; --on-accent:#141A33;
  --ok:#4DCB9B; --ok-soft:#1F3A31; --bad:#FF7F74; --bad-soft:#47282A; --gold:#E3B34A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(22px,3.4vw,30px)}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* neumorphic primitives */
.neu{background:var(--bg);border-radius:var(--r-lg);box-shadow:9px 9px 20px var(--lo),-9px -9px 20px var(--hi)}
.neu-sm{background:var(--bg);border-radius:var(--r);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi)}
.ins{background:var(--bg);border-radius:var(--r);box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;background:var(--bg);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);transition:box-shadow .15s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active,.btn.on{box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);transform:none}
.btn.primary{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:5px 5px 14px var(--lo),-5px -5px 12px var(--hi)}
.btn.primary:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.25)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.ibtn{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);color:var(--accent);flex:none}
.ibtn:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.ibtn svg.i{width:18px;height:18px}

/* app frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:28px 18px 28px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--accent);font-size:17px}
.brand b{font-family:var(--display);font-size:15px;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:12px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;font-weight:700;color:var(--muted);transition:color .15s}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--accent);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.side-foot{margin-top:auto;padding:16px;font-size:13px;color:var(--muted)}
.side-foot b{color:var(--fg);font-variant-numeric:tabular-nums}
main{min-width:0;padding-block:30px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:20px 120px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;gap:4px;background:var(--bg);
    padding:10px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    box-shadow:0 -6px 18px var(--lo)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:7px 8px;border-radius:13px;flex:1;min-width:0}
  .bnav button.on{color:var(--accent);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
}

/* shared bits */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 9px;border-radius:999px;font-family:var(--mono);font-size:11.5px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pad{padding:22px}
.bar{height:10px;border-radius:99px;overflow:hidden;background:var(--bg);box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:8px 15px;border-radius:999px;font-weight:700;font-size:13px;background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);color:var(--muted)}
.chip.on{color:var(--accent);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* home */
.hero{padding:28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr);padding:22px}}
.hero p{color:var(--muted);margin-top:8px;max-width:46ch}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.wotd{padding:22px;text-align:center}
.wotd .w{font-family:var(--display);font-size:clamp(24px,4vw,32px);color:var(--accent);margin:8px 0 4px;word-break:break-word}
.stat{padding:18px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700}
.stat .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--accent)}
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:600px){.path{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.ring{--p:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500}
.mode{padding:18px;display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.mode .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--accent)}
.mode b{display:block;font-size:15px}
.mode small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:2px}
.mode:active{box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}

/* grammar */
.tcard{padding:18px 20px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tcard b{font-size:15.5px;line-height:1.3}
.tcard small{color:var(--muted);font-size:13px}
.done{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.done.y{background:var(--ok);color:var(--bg)}
.done.y svg.i{width:14px;height:14px;stroke-width:3}
.done.n{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
.lesson{padding:28px;display:flex;flex-direction:column;gap:24px}
@media (max-width:600px){.lesson{padding:20px}}
.lesson .lead{font-size:16px;max-width:68ch}
.formula{padding:18px 20px;display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:13.5px;overflow-x:auto}
.formula div{white-space:nowrap}
.formula div::before{content:"›";color:var(--accent);margin-right:10px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:12px;max-width:72ch}
.rules li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.ex{display:flex;flex-direction:column;gap:14px}
.exrow{display:flex;gap:14px;align-items:center;padding:14px 16px}
.exrow .t{min-width:0;flex:1}
.exrow .en{font-weight:700;font-size:15.5px}
.exrow .uz{color:var(--muted);font-size:14px}
.mist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:600px){.mist{grid-template-columns:minmax(0,1fr)}}
.mist div{padding:14px 16px;border-radius:var(--r);font-weight:600}
.mist .w{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.mist .r{background:var(--ok-soft);color:var(--ok)}
.mist small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;text-decoration:none;margin-bottom:4px;opacity:.85}
.quiz{display:flex;flex-direction:column;gap:22px}
.qq{display:flex;flex-direction:column;gap:12px}
.qq .s{font-weight:700;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{padding:11px 18px;border-radius:14px;font-weight:700;background:var(--bg);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi);min-width:84px;transition:transform .12s}
.opt:hover:not([disabled]){transform:translateY(-1px)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok);color:var(--bg);box-shadow:none}
.opt.wrong{background:var(--bad);color:var(--bg);box-shadow:none}
.note{font-size:14px;padding:12px 14px;border-radius:var(--r-sm);max-width:72ch}
.note.y{background:var(--ok-soft);color:var(--ok)}
.note.n{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.m{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* words */
.search{display:flex;align-items:center;gap:10px;padding:4px 16px}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font:inherit;font-size:15px;color:var(--fg)}
.search input:focus{outline:none}
.search:focus-within{box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi),0 0 0 2px var(--accent)}
.ccard{padding:18px;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px}
.ccard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard b{font-size:15px}
.ccard small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-direction:column}
.wrow{display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .t{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:520px){.wrow .t{grid-template-columns:minmax(0,1fr)}}
.wrow .en{font-weight:700}
.wrow .uz{color:var(--muted)}
.tog{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);color:var(--muted)}
.tog svg.i{width:15px;height:15px;stroke-width:3}
.tog.y{background:var(--ok);color:var(--bg);box-shadow:none}
.flash{perspective:1200px;max-width:520px;width:100%;margin:0 auto}
.fcard{position:relative;height:280px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--display);font-size:clamp(24px,6vw,36px);word-break:break-word}
.face.back .big{color:var(--accent)}
.fbtns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}*{scroll-behavior:auto}}

/* phrases */
.sect{padding:22px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .t{flex:1;min-width:0}
.prow .en{font-weight:700}
.prow .uz{color:var(--muted);font-size:14px}
.prow .ex{font-style:italic;font-size:13.5px;color:var(--muted)}

/* practice session */
.sess{max-width:640px;width:100%;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:22px}
@media (max-width:600px){.sess{padding:20px}}
.sess .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.prompt .big{font-family:var(--display);font-size:clamp(20px,5vw,30px);word-break:break-word;line-height:1.3}
.prompt .hint{font-size:13px;color:var(--muted);font-weight:700}
.mopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:480px){.mopts{grid-template-columns:minmax(0,1fr)}}
.mopts .opt{width:100%;padding:15px 14px;text-align:center}
.tin{display:flex;gap:12px;flex-wrap:wrap}
.tin .ins{flex:1;min-width:0;display:flex}
.tin input{flex:1;min-width:0;border:0;background:none;padding:14px 16px;font:inherit;font-size:17px;font-weight:700;color:var(--fg)}
.tin input:focus{outline:none}
.slots{min-height:64px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tok{padding:9px 13px;border-radius:12px;font-weight:700;background:var(--bg);box-shadow:3px 3px 8px var(--lo),-3px -3px 8px var(--hi)}
.tok.used{opacity:.25;pointer-events:none}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.result .score{font-family:var(--display);font-size:46px;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(28px + env(safe-area-inset-bottom,0px));padding:12px 18px;border-radius:14px;font-weight:700;background:var(--fg);color:var(--bg);opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo neu-sm">En</div><div><b>Inglizcha Ustoz</b><small>A1 → C1 yo'l xaritasi</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot neu-sm" id="sidefoot"></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const GRAMMAR = [
{id:"tobe",lvl:"A1",t:"To be (am / is / are)",uz:"«Bo'lmoq» fe'li",
d:"To be — ingliz tilidagi eng asosiy fe'l. U kim ekanligimizni, qayerdaligimizni va holatimizni bildiradi. O'zbek tilida bu ma'no qo'shimcha bilan beriladi (-man, -san, -dir), ingliz tilida esa alohida so'z shart.",
f:["I + am","He / She / It + is","You / We / They + are","Inkor: am not · isn't · aren't","So'roq: Am I …? · Is she …? · Are you …?"],
r:["Qisqartmalar: I'm, you're, he's, it's, we're, they're.","O'tgan zamonda: was (I/he/she/it), were (you/we/they).","Ingliz gapida fe'l bo'lishi shart: «Men talabaman» = I am a student."],
ex:[["I am a teacher at a school.","Men maktabda o'qituvchiman."],["She is tired today.","U bugun charchagan."],["We are from Uzbekistan.","Biz O'zbekistondanmiz."],["Is your brother at home?","Akang uydami?"],["They aren't ready yet.","Ular hali tayyor emas."]],
m:["He very happy.","He is very happy."],
q:[["My parents ___ at work now.",["is","am","are"],2,"Parents — ko'plik (they), shuning uchun are."],["___ you hungry?",["Are","Is","Am"],0,"You bilan doim are ishlatiladi."],["It ___ cold outside.",["are","is","am"],1,"It — birlik, demak is."]]},

{id:"articles",lvl:"A1",t:"Articles: a / an / the",uz:"Artikllar",
d:"Artikl — otdan oldin keladigan kichik so'z. «a/an» — noaniq: biror, bitta (birinchi marta tilga olinganda). «the» — aniq: ikkala tomon ham qaysi narsa haqida gap ketayotganini biladi.",
f:["a + undosh tovush: a car, a university","an + unli tovush: an apple, an hour","the + aniq narsa: the sun, the book on the table"],
r:["a/an faqat birlikdagi sanaladigan otlar bilan.","Tovushga qarang, harfga emas: an hour (h o'qilmaydi), a uniform (yu tovushi).","Dunyoda yagona narsalar: the sun, the moon, the internet.","Umumiy ma'noda ko'plik va sanalmaydigan otlarda artikl yo'q: I like coffee."],
ex:[["I bought a new phone. The phone is black.","Yangi telefon sotib oldim. Telefon qora rangda."],["She is an engineer.","U muhandis."],["Can you close the door, please?","Eshikni yopib qo'ya olasizmi?"],["Dogs are friendly animals.","Itlar do'stona hayvonlar."],["It takes an hour to get there.","U yerga borish bir soat oladi."]],
m:["She is engineer.","She is an engineer."],
q:[["I need ___ umbrella.",["a","an","the"],1,"umbrella unli tovush bilan boshlanadi."],["___ moon is bright tonight.",["A","An","The"],2,"Oy — yagona, shuning uchun the."],["He is ___ university student.",["a","an","the"],0,"university «yu» tovushi bilan boshlanadi — undosh."]]},

{id:"plurals",lvl:"A1",t:"Plural nouns",uz:"Otlarning ko'plik shakli",
d:"Ko'plik ko'pincha -s qo'shish orqali yasaladi. Lekin ba'zi so'zlar -es oladi, ba'zilari esa butunlay o'zgaradi. O'zbek tilidan farqli, son bilan ham ko'plik ishlatiladi: «uchta kitob» = three books.",
f:["Ko'p hollarda: + s → book → books","-s, -sh, -ch, -x, -o: + es → box → boxes","undosh + y: y → ies → city → cities","-f / -fe: → ves → knife → knives"],
r:["Noto'g'ri ko'plik: man → men, woman → women, child → children, foot → feet, tooth → teeth, mouse → mice, person → people.","O'zgarmaydiganlar: sheep, fish, deer.","Sondan keyin ham ko'plik: two cats (two cat emas)."],
ex:[["I have three brothers.","Mening uchta akam bor."],["The children are playing in the garden.","Bolalar bog'da o'ynashyapti."],["There are many cities in Uzbekistan.","O'zbekistonda ko'plab shaharlar bor."],["Put the knives on the table.","Pichoqlarni stolga qo'ying."],["My feet hurt after the long walk.","Uzoq yurishdan keyin oyoqlarim og'riyapti."]],
m:["I saw five sheeps.","I saw five sheep."],
q:[["There are two ___ in the box.",["watchs","watches","watch"],1,"-ch bilan tugagani uchun -es."],["How many ___ are in your class?",["childs","children","childrens"],1,"child → children (noto'g'ri ko'plik)."],["We visited three ___.",["countries","countrys","countryes"],0,"undosh + y → ies."]]},

{id:"pronouns",lvl:"A1",t:"Pronouns & possessives",uz:"Olmoshlar va egalik",
d:"Olmoshlar otning o'rnini bosadi. Gapda kim harakat qilsa — subject (I, he), kimga harakat qilinsa — object (me, him). Egalik «kimniki?» savoliga javob beradi (my, his) va 's bilan ham yasaladi: Ali's car.",
f:["Subject: I · you · he · she · it · we · they","Object: me · you · him · her · it · us · them","Possessive adj: my · your · his · her · its · our · their","Possessive pron: mine · yours · his · hers · ours · theirs","Ega + 's: my sister's room"],
r:["Possessive adjective otdan oldin keladi: my book. Possessive pronoun yolg'iz turadi: This book is mine.","its (egalik) va it's (it is) ni adashtirmang.","Ko'plikdagi egalik: my parents' house (apostrof oxirida)."],
ex:[["She loves him, and he loves her.","U uni sevadi, u ham uni sevadi."],["This is my phone. Where is yours?","Bu mening telefonim. Seniki qayerda?"],["Tell them about the meeting.","Ularga yig'ilish haqida ayt."],["My friend's father is a doctor.","Do'stimning otasi shifokor."],["The cat is eating its food.","Mushuk o'z ovqatini yeyapti."]],
m:["Me and him went to the park.","He and I went to the park."],
q:[["Can you help ___ ?",["I","me","my"],1,"Fe'ldan keyin object shakli: me."],["This bag isn't mine. It's ___ .",["her","hers","she"],1,"Yolg'iz turgan egalik: hers."],["The company changed ___ logo.",["it's","its","their"],1,"Egalik ma'nosida its (apostrofsiz)."]]},

{id:"presimple",lvl:"A1",t:"Present Simple",uz:"Hozirgi oddiy zamon",
d:"Odatlar, muntazam takrorlanadigan ishlar, umumiy haqiqatlar va jadvallar uchun ishlatiladi. Asosiy qiyinchilik: he / she / it bilan fe'lga -s qo'shiladi.",
f:["I / You / We / They + V1","He / She / It + V1 + s/es","Inkor: don't / doesn't + V1","So'roq: Do / Does + ega + V1 …?"],
r:["Signal so'zlar: always, usually, often, sometimes, never, every day.","doesn't va does dan keyin fe'l -s olmaydi: She doesn't work.","-o, -sh, -ch, -x, -ss: goes, washes, watches; undosh + y: study → studies."],
ex:[["I drink tea every morning.","Men har kuni ertalab choy ichaman."],["My sister works in a bank.","Opam bankda ishlaydi."],["Water boils at 100 degrees.","Suv 100 darajada qaynaydi."],["He doesn't eat meat.","U go'sht yemaydi."],["What time does the train leave?","Poyezd soat nechada jo'naydi?"]],
m:["She don't like coffee.","She doesn't like coffee."],
q:[["My father ___ to work by bus.",["go","goes","going"],1,"He/she/it bilan -es: goes."],["___ they live near here?",["Does","Do","Are"],1,"They bilan Do."],["She doesn't ___ English.",["speaks","speak","speaking"],1,"doesn't dan keyin V1 (-s siz)."]]},

{id:"precont",lvl:"A1",t:"Present Continuous",uz:"Hozirgi davomli zamon",
d:"Ayni paytda sodir bo'layotgan harakatlar, vaqtinchalik holatlar va aniq rejalashtirilgan kelajak uchun. O'zbekchadagi «-yapman, -yapti» ga to'g'ri keladi.",
f:["am / is / are + V-ing","Inkor: am not / isn't / aren't + V-ing","So'roq: Am / Is / Are + ega + V-ing …?"],
r:["Signal so'zlar: now, right now, at the moment, look!, listen!","Holat fe'llari odatda -ing olmaydi: know, like, want, need, believe (I know, I am knowing emas).","Imlo: write → writing, swim → swimming, lie → lying."],
ex:[["I am reading a book right now.","Men hozir kitob o'qiyapman."],["Look! It's raining.","Qara! Yomg'ir yog'yapti."],["She is staying with her aunt this week.","U bu hafta xolasinikida turibdi."],["We are meeting the client tomorrow.","Ertaga mijoz bilan uchrashamiz."],["What are you doing?","Nima qilyapsan?"]],
m:["I am wanting a coffee.","I want a coffee."],
q:[["Be quiet! The baby ___ .",["sleeps","is sleeping","sleep"],1,"Ayni paytdagi harakat."],["They ___ football at the moment.",["are playing","play","plays"],0,"at the moment — davomli zamon."],["I ___ the answer.",["am knowing","know","knowing"],1,"know — holat fe'li, -ing olmaydi."]]},

{id:"thereis",lvl:"A1",t:"There is / There are",uz:"…bor / …mavjud",
d:"Biror joyda nimadir borligini aytish uchun ishlatiladi. O'zbekchada «stolda kitob bor» deymiz, inglizchada gap «There is» bilan boshlanadi.",
f:["There is + birlik / sanalmaydigan ot","There are + ko'plik ot","Inkor: There isn't / There aren't","So'roq: Is there …? / Are there …?"],
r:["Ro'yxatda birinchi otga qarab tanlanadi: There is a pen and two books.","O'tgan zamonda: there was / there were.","«Have» bilan adashtirmang: odamga tegishli bo'lsa — have (I have a car)."],
ex:[["There is a supermarket near my house.","Uyim yonida supermarket bor."],["There are 30 students in our class.","Sinfimizda 30 ta o'quvchi bor."],["Is there any milk in the fridge?","Muzlatgichda sut bormi?"],["There aren't any chairs in the room.","Xonada birorta ham stul yo'q."],["There was a big storm last night.","Kecha kechasi kuchli bo'ron bo'ldi."]],
m:["In my city have a big park.","There is a big park in my city."],
q:[["___ any eggs in the kitchen?",["Is there","Are there","There are"],1,"eggs — ko'plik, so'roq: Are there."],["There ___ some water on the floor.",["is","are","have"],0,"water — sanalmaydigan."],["There ___ two banks on this street.",["is","are","be"],1,"two banks — ko'plik."]]},

{id:"can",lvl:"A1",t:"Can / Can't",uz:"Qobiliyat va ruxsat",
d:"Can — «qila olmoq» ma'nosini beradi: qobiliyat, imkoniyat, ruxsat va iltimos. U barcha shaxslar uchun bir xil, -s olmaydi va undan keyin fe'l to toʻsiz keladi.",
f:["Ega + can + V1","Inkor: can't (cannot) + V1","So'roq: Can + ega + V1 …?","O'tgan zamon: could / couldn't"],
r:["She can swim (She cans swim yoki can to swim emas).","Muloyim iltimos: Could you …? — Can you …? dan xushmuomalaroq.","Kelajakdagi qobiliyat: will be able to."],
ex:[["I can speak three languages.","Men uch tilda gapira olaman."],["She can't drive a car.","U mashina hayday olmaydi."],["Can I open the window?","Derazani ochsam bo'ladimi?"],["Could you help me with this bag?","Sumkani ko'tarishga yordam bera olasizmi?"],["When I was five, I could read.","Besh yoshimda o'qiy olardim."]],
m:["He can to play the piano.","He can play the piano."],
q:[["My grandfather ___ use a smartphone.",["can't","don't can","not can"],0,"Inkor: can't."],["___ you swim?",["Do","Can","Are"],1,"Qobiliyat so'rog'i: Can you …?"],["She can ___ very well.",["sings","to sing","sing"],2,"can dan keyin V1."]]},

{id:"prepplace",lvl:"A1",t:"Prepositions of place",uz:"Joy predloglari",
d:"Predloglar narsaning qayerdaligini ko'rsatadi. O'zbekchada bu ko'pincha qo'shimcha bilan beriladi (-da, ustida, ostida), ingliz tilida esa otdan oldin predlog qo'yiladi.",
f:["in — ichida: in the box, in Tashkent","on — ustida (sirtda): on the table, on the wall","at — aniq nuqtada: at the door, at school","under · next to · between · behind · in front of · opposite · above"],
r:["Shahar va mamlakat: in. Ko'cha: on (on Navoi Street). Aniq manzil: at (at 12 Navoi Street).","at home, at work, at school — biror faoliyat joyi.","between — ikki narsa orasida; among — ko'pchilik orasida."],
ex:[["The keys are on the table.","Kalitlar stol ustida."],["My cat is hiding under the bed.","Mushugim karavot ostida yashirinib olgan."],["The bank is between the cafe and the pharmacy.","Bank kafe va dorixona o'rtasida."],["I'll wait for you in front of the cinema.","Seni kinoteatr oldida kutaman."],["She lives in Andijan.","U Andijonda yashaydi."]],
m:["I am in home.","I am at home."],
q:[["The picture is ___ the wall.",["in","on","at"],1,"Devor sirtida — on."],["We met ___ the bus stop.",["at","in","on"],0,"Aniq nuqta — at."],["My parents live ___ Samarkand.",["at","on","in"],2,"Shahar — in."]]},

{id:"preptime",lvl:"A1",t:"Prepositions of time",uz:"Vaqt predloglari: at / on / in",
d:"Vaqtni aytishda uchta asosiy predlog bor. Qoidani piramida kabi eslab qoling: kichik vaqt — at, kun — on, katta davr — in.",
f:["at + aniq vaqt: at 7 o'clock, at noon, at night","on + kun / sana: on Monday, on 5 May, on my birthday","in + oy, yil, fasl, kun qismi: in June, in 2026, in winter, in the morning"],
r:["at the weekend (BrE) / on the weekend (AmE).","this, next, last, every oldidan predlog qo'yilmaydi: next Monday, last year.","for — davomiylik (for two hours), since — boshlanish nuqtasi (since 2020)."],
ex:[["The lesson starts at 8:30.","Dars 8:30 da boshlanadi."],["I was born in 1998.","Men 1998-yilda tug'ilganman."],["We have a meeting on Friday.","Jumada yig'ilishimiz bor."],["It gets dark early in winter.","Qishda erta qorong'i tushadi."],["I'll call you next week.","Senga keyingi hafta qo'ng'iroq qilaman."]],
m:["See you in Monday.","See you on Monday."],
q:[["My birthday is ___ March.",["on","at","in"],2,"Oy — in."],["The shop closes ___ 9 pm.",["in","at","on"],1,"Aniq soat — at."],["What did you do ___ New Year's Day?",["on","in","at"],0,"Aniq kun — on."]]},

{id:"wh",lvl:"A1",t:"Question words",uz:"So'roq so'zlari",
d:"So'roq so'zlari gapning boshida keladi, keyin yordamchi fe'l, keyin ega. Tartib: Wh- + yordamchi fe'l + ega + asosiy fe'l.",
f:["What — nima · Who — kim · Where — qayerda","When — qachon · Why — nega · How — qanday","Which — qaysi · Whose — kimniki","How much / many — qancha · How long — qancha vaqt · How often — qanchalik tez-tez"],
r:["Where do you live? (Where you live? emas)","Ega haqida so'ralsa yordamchi fe'l kerak emas: Who called you?","How much — sanalmaydigan (money), How many — sanaladigan (people)."],
ex:[["Where do you work?","Qayerda ishlaysiz?"],["Why are you late?","Nega kechikding?"],["How many languages do you speak?","Nechta tilda gaplashasiz?"],["Whose bag is this?","Bu kimning sumkasi?"],["Who wrote this book?","Bu kitobni kim yozgan?"]],
m:["What you are doing?","What are you doing?"],
q:[["___ old are you?",["What","How","Which"],1,"Yosh so'raladi: How old."],["___ sugar do you need?",["How many","How much","How long"],1,"sugar — sanalmaydigan."],["___ is your favourite colour?",["Who","What","Where"],1,"Narsa so'raladi: What."]]},

{id:"imperative",lvl:"A1",t:"Imperatives",uz:"Buyruq gaplar",
d:"Buyruq, ko'rsatma, maslahat va taklif bildiradi. Ega tushib qoladi, gap to'g'ridan-to'g'ri fe'l bilan boshlanadi.",
f:["V1 …: Open the door.","Inkor: Don't + V1: Don't touch it.","Taklif: Let's + V1: Let's go."],
r:["please qo'shsangiz muloyimroq: Please sit down.","Retseptlar, yo'riqnomalar va yo'l ko'rsatishda juda ko'p ishlatiladi.","Never + V1 — qat'iy taqiq: Never give up."],
ex:[["Turn left at the traffic lights.","Svetofordan chapga buriling."],["Don't forget your passport.","Pasportingizni unutmang."],["Let's have lunch together.","Keling, birga tushlik qilamiz."],["Please wait here.","Iltimos, shu yerda kuting."],["Add salt and mix well.","Tuz qo'shing va yaxshilab aralashtiring."]],
m:["You no smoke here.","Don't smoke here."],
q:[["___ late again!",["Not be","Don't be","No be"],1,"Inkor buyruq: Don't + V1."],["___ go to the cinema tonight.",["Let's","Lets","Let us to"],0,"Taklif: Let's + V1."],["___ the window, please. It's cold.",["Closing","Close","To close"],1,"Buyruq V1 bilan boshlanadi."]]},

{id:"countable",lvl:"A1",t:"Some / any · much / many",uz:"Sanaladigan va sanalmaydigan otlar",
d:"Sanaladigan otlar (apple, chair) birlik va ko'plikka ega. Sanalmaydiganlar (water, money, advice, information) ko'plik olmaydi. Miqdorni bildiruvchi so'z otning turiga qarab tanlanadi.",
f:["some — darak gapda: some apples, some water","any — inkor va so'roqda: any questions?","many + sanaladigan: many books","much + sanalmaydigan: much time","a lot of — ikkalasi bilan"],
r:["Taklif va iltimosda some: Would you like some tea?","a few (bir nechta) + sanaladigan, a little (biroz) + sanalmaydigan.","advice, information, news, furniture, luggage — sanalmaydi (an advice emas, a piece of advice)."],
ex:[["We need some eggs and some flour.","Bizga tuxum va un kerak."],["Do you have any brothers?","Akang yoki ukang bormi?"],["I don't have much free time.","Bo'sh vaqtim ko'p emas."],["How many people came to the party?","Ziyofatga necha kishi keldi?"],["Can you give me some advice?","Menga maslahat bera olasizmi?"]],
m:["I need an information.","I need some information."],
q:[["There isn't ___ milk left.",["many","much","a few"],1,"milk — sanalmaydigan, inkor: much."],["Are there ___ messages for me?",["some","any","much"],1,"So'roqda any."],["She has ___ friends in London.",["a few","a little","much"],0,"friends — sanaladigan."]]},

{id:"pastsimple",lvl:"A2",t:"Past Simple",uz:"O'tgan oddiy zamon",
d:"O'tmishda boshlanib, tugagan harakatlar uchun. Vaqt ko'pincha aniq: yesterday, last week, in 2020. To'g'ri fe'llar -ed oladi, noto'g'ri fe'llarni yodlash kerak (go → went).",
f:["Ega + V2 (V-ed yoki noto'g'ri shakl)","Inkor: didn't + V1","So'roq: Did + ega + V1 …?"],
r:["did / didn't dan keyin fe'l asosiy shaklga qaytadi: Did you go? (Did you went emas).","Signal so'zlar: yesterday, ago, last …, in 2019, when I was a child.","Imlo: stop → stopped, study → studied, live → lived."],
ex:[["I watched a great film yesterday.","Kecha ajoyib film ko'rdim."],["We went to Samarkand last summer.","O'tgan yozda Samarqandga bordik."],["She didn't call me.","U menga qo'ng'iroq qilmadi."],["Did you finish your homework?","Uy vazifangni tugatdingmi?"],["He bought this car two years ago.","U bu mashinani ikki yil oldin sotib olgan."]],
m:["I didn't went to school.","I didn't go to school."],
q:[["They ___ in Bukhara in 2015.",["live","lived","living"],1,"O'tgan zamon: lived."],["___ you see the news?",["Do","Did","Was"],1,"O'tgan zamon so'rog'i: Did."],["I ___ my keys yesterday.",["lose","losed","lost"],2,"lose — noto'g'ri fe'l: lost."]]},

{id:"pastcont",lvl:"A2",t:"Past Continuous",uz:"O'tgan davomli zamon",
d:"O'tmishning ma'lum bir paytida davom etayotgan harakatni bildiradi. Ko'pincha Past Simple bilan birga: uzoq harakat (Past Continuous) qisqa harakat bilan bo'linadi (Past Simple).",
f:["was / were + V-ing","Inkor: wasn't / weren't + V-ing","So'roq: Was / Were + ega + V-ing …?"],
r:["when + qisqa harakat: I was cooking when the phone rang.","while + ikki parallel harakat: While I was reading, she was sleeping.","Hikoyaning fonini tasvirlash uchun: The sun was shining…"],
ex:[["I was sleeping at 11 pm last night.","Kecha soat 11 da uxlayotgan edim."],["She was driving when the accident happened.","Avariya bo'lganida u mashina haydayotgan edi."],["What were you doing at that moment?","O'sha paytda nima qilayotgan eding?"],["While we were having dinner, the lights went out.","Kechki ovqat qilayotganimizda chiroq o'chib qoldi."],["It was raining all morning.","Ertalab bo'yi yomg'ir yog'di."]],
m:["When he arrived, I cooked dinner. (ma'no: davom etayotgan edi)","When he arrived, I was cooking dinner."],
q:[["I ___ TV when you called.",["watched","was watching","am watching"],1,"Uzoq harakat — Past Continuous."],["They ___ playing chess at 5 pm.",["was","were","are"],1,"They — were."],["While she ___ , I cleaned the house.",["was studying","studied","studies"],0,"while + davomli harakat."]]},

{id:"future",lvl:"A2",t:"Future: will vs be going to",uz:"Kelasi zamon",
d:"Will — gapirayotgan paytda qabul qilingan qaror, va'da, taxmin. Be going to — oldindan tuzilgan reja yoki hozirgi belgilarga asoslangan bashorat.",
f:["will + V1 (won't + V1)","am / is / are + going to + V1","Aniq kelishilgan reja: Present Continuous"],
r:["Qaror hozir: I'm thirsty. I'll get some water.","Reja oldindan: I'm going to visit my grandma on Sunday.","Belgi bor: Look at those clouds! It's going to rain."],
ex:[["Don't worry, I'll help you.","Xavotir olma, senga yordam beraman."],["We're going to buy a new house next year.","Kelasi yili yangi uy sotib olmoqchimiz."],["I think it will be sunny tomorrow.","Menimcha, ertaga quyoshli bo'ladi."],["She's going to have a baby.","U farzand ko'rmoqchi (homilador)."],["I won't tell anyone, I promise.","Hech kimga aytmayman, va'da beraman."]],
m:["I will to call you later.","I will call you later."],
q:[["The phone is ringing. I ___ answer it.",["am going to","will","going"],1,"Hozir qabul qilingan qaror — will."],["I ___ study medicine. I've already applied.",["will","am going to","going to"],1,"Oldindan reja — going to."],["Watch out! You ___ fall!",["are going to","will to","go"],0,"Ko'rinib turgan belgi — going to."]]},

{id:"compar",lvl:"A2",t:"Comparatives & superlatives",uz:"Sifat darajalari",
d:"Ikki narsani solishtirish uchun qiyosiy daraja (bigger, more expensive), uchtadan ko'p narsa ichida eng zo'rini ajratish uchun orttirma daraja (the biggest, the most expensive).",
f:["Qisqa sifat: + er / the + est → tall, taller, the tallest","Uzun sifat: more / the most → more beautiful, the most beautiful","Solishtirish: … than …","Tenglik: as + sifat + as"],
r:["Noto'g'ri: good → better → the best; bad → worse → the worst; far → further → the furthest.","Imlo: big → bigger, happy → happier.","Kamaytirish: less … than, not as … as."],
ex:[["Tashkent is bigger than Andijan.","Toshkent Andijondan kattaroq."],["This is the most interesting book I've ever read.","Bu men o'qigan eng qiziqarli kitob."],["My English is better than last year.","Ingliz tilim o'tgan yilgidan yaxshiroq."],["He is as tall as his father.","U otasi bilan bir xil bo'yda."],["Today is the hottest day of the year.","Bugun yilning eng issiq kuni."]],
m:["She is more taller than me.","She is taller than me."],
q:[["A plane is ___ than a train.",["fast","faster","fastest"],1,"Ikkitasini solishtirish — faster."],["It was the ___ day of my life.",["better","best","good"],1,"good → the best."],["This phone is ___ than that one.",["expensiver","more expensive","most expensive"],1,"Uzun sifat — more."]]},

{id:"freq",lvl:"A2",t:"Adverbs of frequency",uz:"Takrorlanish ravishlari",
d:"Harakat qanchalik tez-tez bo'lishini ko'rsatadi. Asosiy qiyinchilik — gapdagi o'rni.",
f:["always 100% · usually · often · sometimes · rarely · never 0%","Asosiy fe'ldan oldin: I usually walk to work.","to be dan keyin: She is always late."],
r:["sometimes gap boshida ham kelishi mumkin.","never bilan inkor yasalmaydi: I never eat (I don't never eat emas).","Ifodalar oxirda keladi: every day, twice a week, once a month."],
ex:[["I always brush my teeth before bed.","Uxlashdan oldin doim tishimni yuvaman."],["He is never late for work.","U ishga hech qachon kechikmaydi."],["We sometimes go to the mountains.","Biz ba'zan tog'ga boramiz."],["She rarely eats fast food.","U kamdan-kam fast-fud yeydi."],["I go to the gym three times a week.","Haftada uch marta sport zalga boraman."]],
m:["I go always to school by bus.","I always go to school by bus."],
q:[["She ___ coffee in the evening.",["drinks never","never drinks","never drink"],1,"Ravish fe'ldan oldin, she bilan -s."],["They ___ happy.",["are usually","usually are","usually is"],0,"to be dan keyin."],["How ___ do you visit your parents?",["much","often","many"],1,"Takrorlanish: How often."]]},

{id:"musthave",lvl:"A2",t:"Must / have to / should",uz:"Majburiyat va maslahat",
d:"Must — so'zlovchining o'zi zarur deb bilgan majburiyat yoki qat'iy qoida. Have to — tashqi majburiyat (qoida, ish talabi). Should — maslahat, to'g'ri ish.",
f:["must / mustn't + V1","have to / has to + V1 · don't have to + V1","should / shouldn't + V1"],
r:["mustn't = taqiqlangan. don't have to = shart emas. Bu katta farq!","O'tgan zamonda must o'rniga had to.","should — yumshoq maslahat: You should see a doctor."],
ex:[["You must wear a seatbelt.","Xavfsizlik kamarini taqishingiz shart."],["I have to get up at six for work.","Ish uchun soat oltida turishim kerak."],["You don't have to come if you're busy.","Band bo'lsang, kelishing shart emas."],["You mustn't use your phone during the exam.","Imtihon paytida telefondan foydalanish taqiqlanadi."],["You should drink more water.","Ko'proq suv ichishingiz kerak."]],
m:["She musts work today.","She has to work today."],
q:[["It's a free museum. You ___ pay.",["mustn't","don't have to","should"],1,"Shart emas — don't have to."],["You ___ smoke in the hospital.",["mustn't","don't have to","should"],0,"Taqiq — mustn't."],["You look tired. You ___ rest.",["should","mustn't","has to"],0,"Maslahat — should."]]},

{id:"presperf",lvl:"A2",t:"Present Perfect",uz:"Hozirgi tugallangan zamon",
d:"O'tmish bilan hozirni bog'laydi: tajriba (hayotimda), natijasi hozir ko'rinib turgan harakat, hali davom etayotgan holat. Aniq o'tgan vaqt aytilmaydi — aks holda Past Simple ishlatiladi.",
f:["have / has + V3","Inkor: haven't / hasn't + V3","So'roq: Have / Has + ega + V3 …?"],
r:["Signal so'zlar: ever, never, already, yet, just, so far, for, since.","Aniq vaqt bo'lsa Past Simple: I saw him yesterday (I have seen him yesterday emas).","been va gone: She has been to Paris (borib qaytgan); She has gone to Paris (hozir u yerda)."],
ex:[["I have visited London twice.","Men Londonda ikki marta bo'lganman."],["She has just finished her report.","U hozirgina hisobotini tugatdi."],["Have you ever eaten sushi?","Hech sushi yeganmisan?"],["I haven't seen him since Monday.","Uni dushanbadan beri ko'rmadim."],["We have lived here for ten years.","Biz bu yerda o'n yildan beri yashaymiz."]],
m:["I have seen this film last week.","I saw this film last week."],
q:[["I ___ my homework. Can I go out?",["have finished","finished yesterday","finish"],0,"Natija hozir muhim — Present Perfect."],["___ you ever ___ to Japan?",["Did / go","Have / been","Have / went"],1,"Tajriba: Have you ever been."],["She has worked here ___ 2019.",["for","since","ago"],1,"Boshlanish nuqtasi — since."]]},

{id:"gerund",lvl:"A2",t:"Gerund vs infinitive",uz:"-ing shakl va to + fe'l",
d:"Ba'zi fe'llardan keyin -ing shakli, boshqalaridan keyin to + fe'l keladi. Bu qoidadan ko'ra yodlash masalasi, shuning uchun eng ko'p ishlatiladiganlarini o'rganing.",
f:["+ V-ing: enjoy, finish, avoid, mind, suggest, keep, practise","+ to V1: want, decide, hope, plan, need, promise, agree, learn","Predlogdan keyin doim -ing: interested in learning"],
r:["like, love, hate, start, begin — ikkalasi ham mumkin.","stop smoking (chekishni tashlash) ≠ stop to smoke (chekish uchun to'xtash).","remember doing (o'tmishni eslash) ≠ remember to do (unutmay bajarish)."],
ex:[["I enjoy reading before bed.","Uxlashdan oldin kitob o'qishni yoqtiraman."],["She decided to study abroad.","U chet elda o'qishga qaror qildi."],["Would you mind opening the window?","Derazani ochib yuborsangiz maylimi?"],["I'm looking forward to seeing you.","Sizni ko'rishni intiqlik bilan kutyapman."],["Don't forget to lock the door.","Eshikni qulflashni unutma."]],
m:["I want going home.","I want to go home."],
q:[["He finished ___ the report.",["to write","writing","write"],1,"finish + -ing."],["We hope ___ you soon.",["seeing","to see","see"],1,"hope + to V1."],["She is good at ___ .",["to draw","drawing","draw"],1,"Predlogdan keyin -ing."]]},

{id:"ppcont",lvl:"B1",t:"Present Perfect Continuous",uz:"Hozirgi tugallangan davomli zamon",
d:"O'tmishda boshlanib, hozirgacha davom etayotgan (yoki hozirgina to'xtagan) harakatning davomiyligiga urg'u beradi. «Qancha vaqtdan beri?» savoliga javob beradi.",
f:["have / has + been + V-ing","How long have you been + V-ing …?"],
r:["for + davr (for three hours), since + boshlanish (since morning).","Natija ko'rinadi: You're wet. Have you been swimming?","Holat fe'llari bilan Present Perfect: I've known him for years."],
ex:[["I have been learning English for two years.","Ikki yildan beri ingliz tilini o'rganyapman."],["It has been raining since morning.","Ertalabdan beri yomg'ir yog'yapti."],["How long have you been waiting?","Qancha vaqtdan beri kutyapsiz?"],["She's tired because she has been working all day.","U kun bo'yi ishlagani uchun charchagan."],["We've been living in this flat since 2021.","Biz 2021-yildan beri bu kvartirada yashayapmiz."]],
m:["I am waiting for you for an hour.","I have been waiting for you for an hour."],
q:[["They ___ football for two hours.",["have been playing","are playing","played since"],0,"Davomiylik + hozirgacha."],["He ___ here since 2018.",["is working","has been working","works"],1,"since bilan Perfect Continuous."],["Your eyes are red. ___ crying?",["Did you","Have you been","Are you been"],1,"Natijasi ko'rinib turgan harakat."]]},

{id:"pastperf",lvl:"B1",t:"Past Perfect",uz:"O'tgan tugallangan zamon",
d:"O'tmishdagi ikki harakatdan qaysi biri oldinroq bo'lganini ko'rsatadi. «O'tmishning o'tmishi».",
f:["had + V3","Inkor: hadn't + V3","So'roq: Had + ega + V3 …?"],
r:["Oldingi harakat — Past Perfect, keyingisi — Past Simple.","Signal so'zlar: before, after, already, by the time, when.","Reported speech va third conditional da ham ishlatiladi."],
ex:[["When I arrived, the film had already started.","Men kelganimda film allaqachon boshlangan edi."],["She had never seen snow before she moved to Moscow.","Moskvaga ko'chishdan oldin u hech qachon qor ko'rmagan edi."],["We had finished dinner by the time he came.","U kelguniga qadar biz kechki ovqatni tugatgan edik."],["I realised I had left my phone at home.","Telefonimni uyda qoldirganimni angladim."],["Had you met her before the party?","Ziyofatdan oldin u bilan tanishganmiding?"]],
m:["When we arrived, the train left. (u allaqachon ketgan edi)","When we arrived, the train had left."],
q:[["After she ___ her work, she went home.",["finished already","had finished","has finished"],1,"Oldingi harakat — had + V3."],["I couldn't get in because I ___ my key.",["had lost","have lost","lose"],0,"Kalit oldinroq yo'qolgan."],["By the time we got there, everyone ___ .",["left","had left","has left"],1,"by the time — Past Perfect."]]},

{id:"cond1",lvl:"B1",t:"First Conditional",uz:"Birinchi shart gap (real kelajak)",
d:"Kelajakda haqiqatan sodir bo'lishi mumkin bo'lgan shart va uning natijasi. If qismida kelasi zamon ishlatilmaydi!",
f:["If + Present Simple, will + V1","Zero conditional (doimiy haqiqat): If + Present, Present"],
r:["If it rains, we will stay home (If it will rain emas).","unless = if … not: Unless you hurry, you'll miss the bus.","when, as soon as, before ham xuddi shunday: I'll call you when I arrive."],
ex:[["If you study hard, you will pass the exam.","Qattiq o'qisang, imtihondan o'tasan."],["If it rains tomorrow, we'll cancel the picnic.","Ertaga yomg'ir yog'sa, piknikni bekor qilamiz."],["I'll be angry if you're late again.","Yana kechiksang, jahlim chiqadi."],["If you heat ice, it melts.","Muzni qizdirsangiz, eriydi."],["Unless you hurry, you'll miss the train.","Shoshilmasang, poyezddan qolasan."]],
m:["If I will see him, I will tell him.","If I see him, I will tell him."],
q:[["If she ___ early, she will catch the bus.",["will leave","leaves","left"],1,"If qismida Present Simple."],["We ___ late if we don't hurry.",["will be","are","would be"],0,"Natija — will."],["I'll call you as soon as I ___ .",["will arrive","arrive","arrived"],1,"as soon as dan keyin ham Present."]]},

{id:"cond2",lvl:"B1",t:"Second Conditional",uz:"Ikkinchi shart gap (xayoliy hozir)",
d:"Hozirgi yoki kelajakdagi xayoliy, haqiqatga to'g'ri kelmaydigan holat. O'tgan zamon shakli ishlatilsa ham, ma'no hozirgi.",
f:["If + Past Simple, would + V1","Maslahat: If I were you, I would …"],
r:["to be barcha shaxslarda were bo'lishi mumkin: If I were rich…","could va might ham would o'rnida: If I had time, I could help.","1-shart: real imkoniyat. 2-shart: kam ehtimolli yoki xayol."],
ex:[["If I had a million dollars, I would travel the world.","Bir million dollarim bo'lsa, dunyo bo'ylab sayohat qilardim."],["If I were you, I would accept the offer.","Sening o'rningda bo'lsam, taklifni qabul qilardim."],["What would you do if you lost your job?","Ishingni yo'qotsang, nima qilarding?"],["If she lived closer, we would see her more often.","U yaqinroq yashaganida, uni tez-tez ko'rardik."],["I would buy that car if it weren't so expensive.","Shunchalik qimmat bo'lmaganida, o'sha mashinani olardim."]],
m:["If I would know, I would tell you.","If I knew, I would tell you."],
q:[["If I ___ wings, I would fly.",["have","had","would have"],1,"Xayoliy — Past Simple."],["If I were you, I ___ apologise.",["will","would","am"],1,"Maslahat — would."],["She would be happier if she ___ more.",["slept","sleeps","will sleep"],0,"If qismida Past."]]},

{id:"passive",lvl:"B1",t:"Passive voice",uz:"Majhul nisbat",
d:"Harakatni kim bajarganidan ko'ra, harakatning o'zi yoki natijasi muhim bo'lganda ishlatiladi. Rasmiy matnlar, yangiliklar va ilmiy ishlarda juda keng tarqalgan.",
f:["be (zamonga mos) + V3","Present: is made · Past: was built · Perfect: has been sold","Future: will be done · Modal: can be seen","Bajaruvchi: by + …"],
r:["Faqat to'ldiruvchi oladigan fe'llar majhul bo'ladi.","by + bajaruvchi faqat muhim bo'lsa aytiladi.","Zamon «be» fe'li orqali beriladi, asosiy fe'l doim V3."],
ex:[["This bridge was built in 1965.","Bu ko'prik 1965-yilda qurilgan."],["English is spoken all over the world.","Ingliz tilida butun dunyoda gaplashiladi."],["My phone has been stolen!","Telefonim o'g'irlab ketildi!"],["The results will be announced tomorrow.","Natijalar ertaga e'lon qilinadi."],["The book was written by Abdulla Qodiriy.","Kitob Abdulla Qodiriy tomonidan yozilgan."]],
m:["The house built in 1990.","The house was built in 1990."],
q:[["The letters ___ every morning.",["deliver","are delivered","delivered"],1,"Present Passive: are + V3."],["The car ___ last night.",["was stolen","stole","is stealing"],0,"Past Passive: was + V3."],["The project ___ by Friday.",["will finish","will be finished","is finish"],1,"Future Passive: will be + V3."]]},

{id:"reported",lvl:"B1",t:"Reported speech",uz:"O'zlashtirma gap",
d:"Boshqa birovning gapini o'z so'zlaringiz bilan yetkazish. Asosiy qoida: zamon bir pog'ona orqaga suriladi, olmoshlar va vaqt so'zlari o'zgaradi.",
f:["am/is → was · do → did · did → had done","will → would · can → could · have done → had done","now → then · today → that day · tomorrow → the next day","say (that) … · tell someone (that) …"],
r:["tell dan keyin doim kishi: She told me… (She said me emas).","So'roqlar: She asked where I lived (so'z tartibi darak gapdek).","Ha/yo'q so'roqlari: if / whether: He asked if I was ready.","Buyruqlar: told me to + V1."],
ex:[["«I'm tired.» → She said she was tired.","U charchaganini aytdi."],["«I will call you.» → He said he would call me.","U menga qo'ng'iroq qilishini aytdi."],["«Where do you live?» → She asked where I lived.","U qayerda yashashimni so'radi."],["«Sit down.» → The teacher told us to sit down.","O'qituvchi bizga o'tirishimizni aytdi."],["«Can you swim?» → He asked if I could swim.","U suza olishimni so'radi."]],
m:["She said me that she was busy.","She told me that she was busy."],
q:[["«I like pizza.» → He said he ___ pizza.",["likes","liked","like"],1,"Zamon orqaga: like → liked."],["She asked me where I ___ .",["work","worked","did I work"],1,"Darak tartibi + zamon siljishi."],["He ___ me to wait outside.",["said","told","asked to"],1,"tell + kishi + to V1."]]},

{id:"relative",lvl:"B1",t:"Relative clauses",uz:"Aniqlovchi ergash gaplar",
d:"Ot haqida qo'shimcha ma'lumot beradi va ikki gapni bittaga birlashtiradi. O'zbekchada bu «-gan» sifatdoshiga to'g'ri keladi: «men ko'rgan film» = the film that I saw.",
f:["who — odamlar uchun","which — narsa va hayvonlar uchun","that — odam va narsa (rasmiy bo'lmagan)","whose — egalik · where — joy · when — vaqt"],
r:["Agar relative olmosh to'ldiruvchi bo'lsa, tushirib qoldirish mumkin: The book (that) I read.","Vergulli (qo'shimcha) gaplarda that ishlatilmaydi: My father, who is 60, still works.","which butun gapga ham ishora qiladi: He passed, which surprised everyone."],
ex:[["The woman who lives next door is a doctor.","Qo'shnimiz bo'lgan ayol shifokor."],["This is the phone that I bought yesterday.","Bu men kecha sotib olgan telefon."],["That's the house where I grew up.","Bu men o'sgan uy."],["I have a friend whose brother is a pilot.","Akasi uchuvchi bo'lgan do'stim bor."],["Samarkand, which is very old, attracts many tourists.","Juda qadimiy bo'lgan Samarqand ko'plab sayyohlarni jalb qiladi."]],
m:["The man which called you is my boss.","The man who called you is my boss."],
q:[["The girl ___ won the prize is my sister.",["which","who","whose"],1,"Odam — who."],["This is the city ___ I was born.",["which","where","who"],1,"Joy — where."],["He's the man ___ car was stolen.",["who","whose","which"],1,"Egalik — whose."]]},

{id:"deduction",lvl:"B1",t:"Modals of deduction",uz:"Taxmin modallari",
d:"Dalillarga asoslanib, qanchalik ishonch bilan taxmin qilayotganimizni bildiradi.",
f:["must + V1 — deyarli aniq (ha)","might / may / could + V1 — ehtimol","can't + V1 — deyarli aniq (yo'q)","O'tmish: must / might / can't + have + V3"],
r:["Taxminda mustn't emas, can't ishlatiladi: It can't be true.","O'tmish taxmini: She must have forgotten.","Davom etayotgan: He might be sleeping."],
ex:[["He has been working all day. He must be tired.","U kun bo'yi ishladi. Charchagan bo'lsa kerak."],["She isn't answering. She might be busy.","U javob bermayapti. Band bo'lishi mumkin."],["That can't be Ali. He's in London.","U Ali bo'lishi mumkin emas. U Londonda."],["The ground is wet. It must have rained.","Yer ho'l. Yomg'ir yoqqan bo'lsa kerak."],["I can't find my wallet. I may have left it at work.","Hamyonimni topa olmayapman. Ishda qoldirgan bo'lishim mumkin."]],
m:["He mustn't be at home, the lights are off.","He can't be at home, the lights are off."],
q:[["She's got a Ferrari. She ___ be rich.",["can't","must","mustn't"],1,"Deyarli aniq — must."],["He ___ be hungry. He just ate.",["must","can't","might"],1,"Deyarli imkonsiz — can't."],["They ___ have missed the bus.",["might","must to","can"],0,"O'tmish ehtimoli: might have V3."]]},

{id:"usedto",lvl:"B1",t:"Used to / be used to",uz:"O'tmishdagi odat va ko'nikish",
d:"Used to + V1 — o'tmishdagi, endi davom etmaydigan odat yoki holat. Be used to + V-ing — biror narsaga ko'nikkan bo'lish. Get used to — ko'nikib qolish jarayoni.",
f:["used to + V1 (didn't use to + V1)","be used to + V-ing / ot","get used to + V-ing / ot"],
r:["Inkor va so'roqda use (d yo'q): Did you use to …?","used to faqat o'tmish uchun; hozirgi odat uchun usually.","be used to dan keyin -ing: I'm used to getting up early."],
ex:[["I used to play football every day.","Har kuni futbol o'ynardim (endi o'ynamayman)."],["There used to be a cinema here.","Bu yerda ilgari kinoteatr bor edi."],["She didn't use to like coffee.","U ilgari qahvani yoqtirmasdi."],["I'm used to working at night.","Kechasi ishlashga ko'nikkanman."],["You'll soon get used to the cold weather.","Tez orada sovuq ob-havoga ko'nikasan."]],
m:["I am used to wake up early.","I am used to waking up early."],
q:[["When I was a child, I ___ climb trees.",["use to","used to","was used to"],1,"O'tmishdagi odat."],["She is used to ___ alone.",["live","living","lived"],1,"be used to + -ing."],["Did you ___ have long hair?",["used to","use to","using to"],1,"So'roqda use to."]]},

{id:"cond3",lvl:"B2",t:"Third & mixed conditionals",uz:"Uchinchi va aralash shart gaplar",
d:"Uchinchi shart — o'tmishdagi xayoliy holat: sodir bo'lmagan narsa va uning natijasi. Ko'pincha afsus yoki tanqidni bildiradi. Aralash shart — o'tmishdagi sabab va hozirgi natija.",
f:["3rd: If + had + V3, would have + V3","Mixed: If + had + V3, would + V1 (hozir)"],
r:["Qisqartma: I'd have = I would have; If I'd known = If I had known.","could have / might have ham ishlatiladi.","Sodir bo'lmagan haqiqatni tasvirlaydi — o'tmishni o'zgartirib bo'lmaydi."],
ex:[["If I had studied harder, I would have passed.","Ko'proq o'qiganimda, o'tgan bo'lardim."],["If we had left earlier, we wouldn't have missed the plane.","Ertaroq chiqqanimizda, samolyotdan qolmagan bo'lardik."],["She would have come if you had invited her.","Taklif qilganingda, u kelgan bo'lardi."],["If I had taken that job, I would be rich now.","O'sha ishni olganimda, hozir boy bo'lardim."],["What would you have done if you had been there?","U yerda bo'lganingda nima qilgan bo'larding?"]],
m:["If I would have known, I would have helped.","If I had known, I would have helped."],
q:[["If he ___ the alarm, he wouldn't have been late.",["heard","had heard","has heard"],1,"3rd: had + V3."],["I ___ you if I had had your number.",["would call","would have called","will call"],1,"would have + V3."],["If I had learned English as a child, I ___ fluent now.",["would be","would have been","am"],0,"Aralash: hozirgi natija."]]},

{id:"futperf",lvl:"B2",t:"Future Continuous & Future Perfect",uz:"Kelasi davomli va tugallangan zamon",
d:"Future Continuous — kelajakning ma'lum paytida davom etayotgan harakat. Future Perfect — kelajakdagi ma'lum vaqtgacha tugallangan bo'ladigan harakat.",
f:["will be + V-ing","will have + V3","by + vaqt — Future Perfect signali"],
r:["This time tomorrow I'll be flying to Istanbul.","By 2030, I will have finished my PhD.","Muloyim so'roq: Will you be using the car tonight?"],
ex:[["At 9 pm I'll be watching the match.","Kechqurun soat 9 da o'yinni tomosha qilayotgan bo'laman."],["This time next week we'll be lying on the beach.","Kelasi hafta shu paytda sohilda yotgan bo'lamiz."],["I will have finished the report by Monday.","Dushanbagacha hisobotni tugatgan bo'laman."],["By the time you arrive, we will have eaten.","Sen kelguningcha biz ovqatlanib bo'lgan bo'lamiz."],["Will you be coming to the meeting?","Yig'ilishga kelasizmi?"]],
m:["By next year I will finish university.","By next year I will have finished university."],
q:[["Don't call at 8. I ___ dinner.",["will have","will be having","have"],1,"Ma'lum paytda davom etadi."],["By 2027 they ___ the new airport.",["will have built","will build","are building"],0,"by + vaqt — Future Perfect."],["This time tomorrow I ___ to Dubai.",["will fly","will be flying","fly"],1,"Ayni paytdagi kelajak harakati."]]},

{id:"wish",lvl:"B2",t:"Wish / If only",uz:"Istak va afsus",
d:"Hozirgi yoki o'tmishdagi holat boshqacha bo'lishini xohlash. Zamon bir pog'ona orqaga suriladi, xuddi shart gaplardagi kabi.",
f:["Hozir: wish + Past Simple","O'tmish: wish + Past Perfect","Boshqalarning xatti-harakati: wish + would + V1"],
r:["I wish I were taller (rasmiy uslubda were).","If only — kuchliroq his-tuyg'u bilan.","O'zingiz haqida would ishlatilmaydi: I wish I could… (I wish I would… emas)."],
ex:[["I wish I spoke Chinese.","Xitoy tilida gapira olsam edi."],["I wish I had saved more money.","Ko'proq pul yig'ganimda edi."],["She wishes she lived near the sea.","U dengiz yonida yashashni xohlaydi."],["I wish you would stop talking during the film.","Film paytida gapirishni bas qilsang edi."],["If only I had listened to my parents!","Qani endi ota-onamga quloq solganimda!"]],
m:["I wish I have a car.","I wish I had a car."],
q:[["I wish I ___ more free time.",["have","had","will have"],1,"Hozirgi istak — Past."],["I wish I ___ that. I'm sorry.",["didn't say","hadn't said","don't say"],1,"O'tmishdagi afsus — Past Perfect."],["I wish it ___ raining.",["would stop","stops","stopped already"],0,"Tashqi holatning o'zgarishi — would."]]},

{id:"tags",lvl:"B2",t:"Question tags",uz:"Tasdiq so'roqlar",
d:"Gap oxiriga qo'shiladigan qisqa so'roq: «shunday emasmi?», «-a?». Tasdiqni so'rash yoki suhbatni davom ettirish uchun.",
f:["Darak gap → inkor tag: You're tired, aren't you?","Inkor gap → darak tag: She doesn't smoke, does she?","Yordamchi fe'l + olmosh"],
r:["I am → aren't I? (I'm right, aren't I?)","Let's → shall we? · Buyruq → will you?","never, nobody, nothing — inkor ma'no, tag darak: He never comes, does he?"],
ex:[["It's a beautiful day, isn't it?","Ajoyib kun, shundaymi?"],["You live in Tashkent, don't you?","Siz Toshkentda yashaysiz, shundaymi?"],["She can't swim, can she?","U suza olmaydi, to'g'rimi?"],["They went home, didn't they?","Ular uyga ketishdi, shundaymi?"],["Let's start, shall we?","Boshlaymizmi?"]],
m:["You are a student, isn't it?","You are a student, aren't you?"],
q:[["He works here, ___ ?",["doesn't he","isn't he","don't he"],0,"Present Simple: doesn't he."],["You haven't seen my keys, ___ ?",["haven't you","have you","did you"],1,"Inkor gap → darak tag."],["I'm late, ___ ?",["amn't I","aren't I","isn't I"],1,"Istisno: aren't I."]]},

{id:"causative",lvl:"B2",t:"Causative: have / get something done",uz:"Ishni boshqaga bajartirish",
d:"Ishni o'zimiz emas, boshqa birov (odatda xizmat ko'rsatuvchi) bajarganini bildiradi. O'zbekchadagi «sochimni oldirdim» (-dir, -tir) ma'nosi.",
f:["have + narsa + V3","get + narsa + V3 (so'zlashuvda)","have someone do something · get someone to do something"],
r:["I cut my hair = o'zim kesdim; I had my hair cut = sartaroshda kesdirdim.","Barcha zamonlarda: I'm having my car repaired.","Yoqimsiz hodisalar uchun ham: She had her bag stolen."],
ex:[["I had my hair cut yesterday.","Kecha sochimni oldirdim."],["We're getting our kitchen painted.","Oshxonamizni bo'yatyapmiz."],["You should have your eyes tested.","Ko'zingizni tekshirtirishingiz kerak."],["He had his phone stolen on the bus.","Avtobusda uning telefoni o'g'irlandi."],["I'll get my brother to help me.","Akamni menga yordam berishga ko'ndiraman."]],
m:["I repaired my car at the garage. (mexanik ta'mirladi)","I had my car repaired at the garage."],
q:[["She ___ her nails done every month.",["has","is","does"],0,"have + narsa + V3."],["I need to get my watch ___ .",["repair","repaired","repairing"],1,"get + narsa + V3."],["We are having our house ___ .",["clean","cleaned","cleaning"],1,"V3 shakli."]]},

{id:"phrasal",lvl:"B2",t:"Phrasal verbs",uz:"Frazali fe'llar",
d:"Fe'l + predlog yoki ravish birikmasi bo'lib, ko'pincha yangi ma'no beradi (give up = taslim bo'lmoq). So'zlashuv tilining asosi. Ro'yxatini «Frazalar» bo'limida topasiz.",
f:["Ajraladigan: turn off the light / turn the light off","Olmosh o'rtada: turn it off (turn off it emas)","Ajralmaydigan: look after the kids, get on the bus"],
r:["Bitta fe'l turli ma'no beradi: take off (yechmoq / samolyot ko'tarilishi).","Rasmiy matnda ko'pincha bir so'zli sinonim: find out = discover.","Kontekstda yodlang, ro'yxat bilan emas."],
ex:[["Please turn off your phones.","Iltimos, telefonlaringizni o'chiring."],["I gave up smoking last year.","O'tgan yili chekishni tashladim."],["Can you look after my cat this weekend?","Dam olish kunlari mushugimga qarab tura olasanmi?"],["We ran out of milk.","Sutimiz tugab qoldi."],["I'm looking forward to the holidays.","Ta'tilni intiqlik bilan kutyapman."]],
m:["Pick up it, please.","Pick it up, please."],
q:[["Don't ___ ! You can do it!",["give up","give in up","give out"],0,"give up — taslim bo'lmoq."],["Could you ___ the radio? It's too loud.",["turn up","turn down","turn on"],1,"turn down — ovozni pasaytirish."],["I need to ___ this word in the dictionary.",["look for","look up","look after"],1,"look up — lug'atdan qidirmoq."]]},

{id:"linking",lvl:"B2",t:"Linking words",uz:"Bog'lovchi so'zlar",
d:"Fikrlarni mantiqiy bog'laydi va nutqingizni ravon qiladi. Yozma ish va IELTS uchun juda muhim.",
f:["Qarama-qarshilik: but, however, although, despite, whereas","Sabab: because, since, as, due to","Natija: so, therefore, as a result","Qo'shimcha: and, also, moreover, in addition"],
r:["although + gap: Although it rained, we went out.","despite / in spite of + ot yoki -ing: Despite the rain, we went out.","however — gap boshida, vergul bilan: However, it was too late."],
ex:[["Although he was tired, he finished the work.","Charchagan bo'lsa ham, u ishni tugatdi."],["Despite the traffic, we arrived on time.","Tirbandlikka qaramay, vaqtida yetib keldik."],["It was expensive. However, it was worth it.","Qimmat edi. Biroq, bunga arziydi."],["The flight was cancelled due to bad weather.","Yomon ob-havo tufayli reys bekor qilindi."],["He didn't study; as a result, he failed.","U o'qimadi; natijada, imtihondan yiqildi."]],
m:["Despite it was cold, we swam.","Although it was cold, we swam."],
q:[["___ being ill, she went to work.",["Although","Despite","However"],1,"-ing bilan Despite."],["I like tea, ___ my wife prefers coffee.",["whereas","despite","therefore"],0,"Ikki tomonni qarama-qarshi qo'yish."],["He was late. ___ , he missed the start.",["Although","As a result","Despite"],1,"Natija."]]},

{id:"inversion",lvl:"C1",t:"Inversion",uz:"Teskari so'z tartibi (urg'u)",
d:"Inkor yoki cheklovchi ravish gap boshiga chiqqanda, ega va yordamchi fe'l o'rin almashadi. Rasmiy, adabiy va ta'sirli nutqda ishlatiladi.",
f:["Never have I … · Rarely do we …","Not only … but also …","Hardly / No sooner had … when / than …","Only then / Only after … did …"],
r:["So'roq tartibi: yordamchi fe'l + ega + asosiy fe'l.","Shart gaplarda if tushadi: Had I known = If I had known.","Should you need help = If you need help."],
ex:[["Never have I seen such a beautiful place.","Bunday go'zal joyni hech qachon ko'rmaganman."],["Not only is she smart, but she is also kind.","U nafaqat aqlli, balki mehribon ham."],["Rarely do we get such an opportunity.","Bunday imkoniyat kamdan-kam bo'ladi."],["Had I known, I would have come earlier.","Bilganimda, ertaroq kelgan bo'lardim."],["No sooner had we arrived than it started to rain.","Yetib kelishimiz bilan yomg'ir boshlandi."]],
m:["Never I have been so happy.","Never have I been so happy."],
q:[["Never ___ such a mess!",["I have seen","have I seen","I saw"],1,"Inversiya: have + I."],["___ I known, I would have helped.",["Had","If","Have"],0,"If tushib, Had boshga chiqadi."],["Not only ___ late, but he also forgot the tickets.",["he was","was he","he is"],1,"Not only + inversiya."]]},

{id:"cleft",lvl:"C1",t:"Cleft sentences",uz:"Ajratilgan gaplar (urg'u berish)",
d:"Gapning bir qismiga urg'u berish uchun uni ikki qismga ajratamiz. O'zbekchadagi «aynan», «-ki» urg'u yuklamalariga o'xshaydi.",
f:["It is / was + urg'u + that / who …","What + ega + fe'l + is / was …","All I want is …"],
r:["It was Ali who broke the window (boshqa hech kim emas, aynan Ali).","What I need is a holiday — muhim narsani oxirga qo'yadi.","Nutqni ta'sirli va aniq qiladi."],
ex:[["It was my mother who taught me to cook.","Menga ovqat pishirishni aynan onam o'rgatgan."],["What I really need is a good night's sleep.","Menga aslida kerak bo'lgan narsa — yaxshi uyqu."],["It's not the money that matters, it's the experience.","Muhimi pul emas, tajriba."],["All I want is some peace and quiet.","Faqat tinchlik va osoyishtalikni xohlayman."],["What surprised me was his calm reaction.","Meni hayratlantirgan narsa uning xotirjamligi bo'ldi."]],
m:["It was him who he called me.","It was him who called me."],
q:[["___ I like about her is her honesty.",["That","What","Which"],1,"What + gap + is."],["It was in 2020 ___ we met.",["that","what","which"],0,"It was … that."],["___ was Sara who found the solution.",["What","It","This"],1,"It was + kishi + who."]]}
];

let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-(US|GB)/i.test(x.lang)&&/Google|Samantha|Daniel|Natural/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,'').replace(/ \/ /g,', '));u.lang='en-US';if(voice)u.voice=voice;u.rate=.88;speechSynthesis.speak(u)}catch(e){toast("Bu qurilmada ovoz mavjud emas")}}

const dstr=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function streakNow(){const y=new Date();y.setDate(y.getDate()-1);return(P.last===dstr()||P.last===dstr(y))?P.streak:0}
function addXP(n){if(n<=0)return;const t=dstr();P.xp+=n;if(P.today.d!==t)P.today={d:t,xp:0};P.today.xp+=n;
  if(P.last!==t){const y=new Date();y.setDate(y.getDate()-1);P.streak=P.last===dstr(y)?P.streak+1:1;P.last=t}save();foot()}
