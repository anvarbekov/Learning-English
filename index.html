["Bitta fe'l — ko'p ma'no: take off (yechmoq / ko'tarilmoq).","Rasmiy matnda bir so'zli sinonim: find out = discover.","Kontekstda yodlang."],
[["Please turn off your phones.","Iltimos, telefonlaringizni o'chiring."],["I gave up smoking last year.","O'tgan yili chekishni tashladim."],["Can you look after my cat this weekend?","Dam olish kunlari mushugimga qarab tura olasanmi?"],["We've run out of milk.","Sutimiz tugab qoldi."],["She came up with a great idea.","U ajoyib g'oya o'ylab topdi."]],
["Pick up it, please.","Pick it up, please."],
[["Don't ___ ! You can do it!",["give up","give in up","give out"],0,"give up."],["Could you ___ the radio? It's loud.",["turn up","turn down","turn on"],1,"turn down — pasaytirish."],["I need to ___ this word.",["look for","look up","look after"],1,"look up — lug'atdan qidirish."]]);

T("B1","indirectq","Indirect questions","Muloyim (bilvosita) savollar",
"Could you tell me where the station is? — muloyim so'roqdan keyin darak tartibi.",
"Notanish odamga, do'konda yoki rasmiy joyda to'g'ridan-to'g'ri so'rash qo'polroq eshitiladi. Bilvosita savol muloyimroq.",
["Could you tell me + wh- + ega + fe'l?","Do you know + wh- + ega + fe'l?","Ha/yo'q: Do you know if/whether …?","I wonder + wh- …"],
["do/does/did tushib qoladi: where the bank is (where is the bank emas).","Could you tell me what time it is?","Savol belgisi butun gapga qarab."],
[["Could you tell me where the station is?","Vokzal qayerdaligini ayta olasizmi?"],["Do you know what time the shop opens?","Do'kon soat nechada ochilishini bilasizmi?"],["I wonder why he left so early.","U nega erta ketganiga hayronman."],["Do you know if there's a bank near here?","Yaqin atrofda bank bor-yo'qligini bilasizmi?"],["Can you tell me how much this costs?","Bu qancha turishini ayta olasizmi?"]],
["Can you tell me where is the bank?","Can you tell me where the bank is?"],
[["Do you know where ___ ?",["does he live","he lives","lives he"],1,"Darak tartibi."],["Could you tell me what time ___ ?",["it is","is it","does it"],0,"Darak tartibi."],["I'd like to know ___ you're free tomorrow.",["if","that","what"],0,"Ha/yo'q — if."]]);

T("B1","causative","Causative: have / get something done","Ishni birovga bajartirish",
"have + narsa + V3 — ishni o'zim emas, boshqa odam (usta) qildi. O'zbekchadagi -dir/-tir.",
"«Sochimni oldirdim» — o'zim kesmadim, sartarosh kesdi: I had my hair cut. I cut my hair — o'zim kesdim degani.",
["have + narsa + V3","get + narsa + V3 (so'zlashuv)","Barcha zamonlarda: I'm having my car repaired."],
["Yoqimsiz hodisalar: She had her bag stolen.","have sb do sth: I'll have the mechanic check it.","get sb to do sth: I got him to fix it."],
[["I had my hair cut yesterday.","Kecha sochimni oldirdim."],["We're getting our kitchen painted.","Oshxonamizni bo'yatyapmiz."],["You should have your eyes tested.","Ko'zingizni tekshirtirishingiz kerak."],["He had his phone stolen on the bus.","Avtobusda uning telefoni o'g'irlandi."],["Where do you get your clothes made?","Kiyimlaringizni qayerda tiktirasiz?"]],
["I repaired my car at the garage. (usta ta'mirladi)","I had my car repaired at the garage."],
[["She ___ her nails done every month.",["has","is","does"],0,"have + narsa + V3."],["I need to get my watch ___ .",["repair","repaired","repairing"],1,"V3."],["We are having our house ___ .",["clean","cleaned","cleaning"],1,"V3."]]);

T("B1","linking","Linking words: contrast, reason, result","Bog'lovchi so'zlar",
"although + gap; despite + ot/-ing; however — yangi gap boshida. because/since/as — sabab. so/therefore — natija.",
"Fikrlarni mantiqiy bog'laydi. Yozma ish va IELTS uchun eng muhim mavzulardan biri.",
["Qarama-qarshilik: but, although, even though, however, despite, in spite of, whereas","Sabab: because, since, as, because of, due to","Natija: so, therefore, as a result, consequently","Qo'shimcha: also, moreover, in addition, furthermore"],
["Although it rained, we went out.","Despite the rain / Despite raining … (despite of — xato).","However, … — gap boshida, vergul bilan."],
[["Although he was tired, he finished the work.","Charchagan bo'lsa ham, u ishni tugatdi."],["Despite the traffic, we arrived on time.","Tirbandlikka qaramay, vaqtida yetib keldik."],["It was expensive. However, it was worth it.","Qimmat edi. Biroq, bunga arziydi."],["The flight was cancelled due to bad weather.","Yomon ob-havo tufayli reys bekor qilindi."],["He didn't study; as a result, he failed.","U o'qimadi; natijada yiqildi."]],
["Despite it was cold, we swam.","Although it was cold, we swam."],
[["___ being ill, she went to work.",["Although","Despite","However"],1,"-ing bilan Despite."],["I like tea, ___ my wife prefers coffee.",["whereas","despite","therefore"],0,"Qarama-qarshi qo'yish."],["He was late. ___ , he missed the start.",["Although","As a result","Despite"],1,"Natija."]]);

T("B1","articles2","Articles: advanced uses","Artikllar: chuqurroq",
"Umumiy ma'no — artiklsiz; aniq guruh — the. Ko'p geografik nomlar: the + daryo/dengiz/tog' tizmasi.",
"A1 da asosiy qoidalarni o'rgandik. Endi umumlashtirish, joy nomlari va muassasalar bilan ishlashni o'rganamiz.",
["Umumiy: Life is short. I love music.","Aniq: The music in this film is great.","the + daryo, dengiz, okean, tog' tizmasi, cho'l: the Amu Darya, the Alps","Artiklsiz: ko'p mamlakat, shahar, ko'l, alohida tog': Uzbekistan, Lake Baikal, Everest"],
["the + ko'plikdagi yoki «State/Kingdom» li davlatlar: the USA, the UK, the Netherlands.","go to school/hospital/prison (vazifa bo'yicha) ≠ go to the school (bino sifatida).","the + sifat = guruh: the rich, the elderly."],
[["Children need love and attention.","Bolalarga mehr va e'tibor kerak."],["The children in this class are very clever.","Bu sinfdagi bolalar juda aqlli."],["The Amu Darya flows into the Aral Sea.","Amudaryo Orol dengiziga quyiladi."],["She went to hospital after the accident.","Avariyadan keyin u kasalxonaga yotdi."],["We should help the poor.","Kambag'allarga yordam berishimiz kerak."]],
["The life is beautiful.","Life is beautiful."],
[["___ Pacific is the largest ocean.",["A","The","—"],1,"Okean — the."],["I love ___ chocolate.",["the","a","—"],2,"Umumiy ma'no."],["She lives in ___ USA.",["the","—","a"],0,"States — the."]]);

T("B1","reflexive","Reflexive pronouns & each other","O'zlik olmoshlari",
"myself, yourself, himself … — harakat o'ziga qaytadi. each other — bir-birini.",
"«O'zimni kesib oldim» = I cut myself. «Bir-birimizni yaxshi ko'ramiz» = We love each other.",
["myself · yourself · himself · herself · itself","ourselves · yourselves · themselves","by + o'zlik = yolg'iz: by myself","each other / one another — bir-birini"],
["Urg'u: I did it myself — o'zim qildim.","Odatda kerak emas: I washed (myself emas), I feel (myself emas).","Enjoy yourself! — Maroqli vaqt o'tkazing!"],
[["Be careful! Don't cut yourself.","Ehtiyot bo'l! O'zingni kesib olma."],["She made the cake herself.","U tortni o'zi pishirdi."],["I live by myself.","Men yolg'iz yashayman."],["They love each other very much.","Ular bir-birini juda yaxshi ko'rishadi."],["Help yourselves to some food!","Ovqatdan oling, tortinmang!"]],
["He looked at himself and she looked at herself. (ma'no: bir-birlariga)","They looked at each other."],
[["We enjoyed ___ at the party.",["us","ourselves","ourself"],1,"we → ourselves."],["She lives by ___ .",["her","herself","hers"],1,"by herself."],["Ali and Aziz help ___ .",["themselves","each other","theirselves"],1,"Bir-biriga."]]);
T("B2","narrative","Narrative tenses","Hikoya zamonlari",
"Hikoyada: Past Simple — asosiy voqealar; Past Continuous — fon; Past Perfect — undan oldin bo'lgan; Past Perfect Continuous — oldin davom etgan.",
"Yaxshi hikoya bir nechta o'tgan zamonni birga ishlatadi. Bu IELTS Speaking Part 2 va yozma hikoyalarda baho oshiradi.",
["Fon: It was raining and people were hurrying home.","Voqealar zanjiri: I opened the door, saw a man and screamed.","Oldingi voqea: I realised someone had taken my bag.","Oldingi davomiylik: I had been waiting for an hour when he arrived."],
["Voqealarni ketma-ket aytsangiz — faqat Past Simple.","Past Perfect faqat orqaga qaytish kerak bo'lganda.","Bog'lovchilar: as soon as, by the time, just as, while."],
[["It was getting dark and it had started to rain.","Qorong'i tushayotgan edi, yomg'ir ham boshlangan edi."],["While I was walking home, I saw an old friend.","Uyga ketayotganimda eski do'stimni ko'rdim."],["When I got to the station, the train had already left.","Vokzalga yetganimda poyezd allaqachon ketgan edi."],["She had been working there for ten years before she was promoted.","Lavozimi ko'tarilishidan oldin u o'n yil ishlagan edi."],["Just as I was leaving, the phone rang.","Endi chiqayotganimda telefon jiringladi."]],
["When I arrived, she already left.","When I arrived, she had already left."],
[["I ___ along the street when I heard a noise.",["walked","was walking","had walked"],1,"Fon harakati."],["He was tired because he ___ all night.",["had been driving","was driving","drove"],0,"Oldingi davomiylik."],["She ___ the door, turned on the light and sat down.",["opened","was opening","had opened"],0,"Voqealar zanjiri."]]);

T("B2","pastperfcont","Past Perfect Continuous","O'tgan tugallangan davomli",
"had been + -ing — o'tmishdagi bir nuqtagacha qancha vaqt davom etganini ko'rsatadi.",
"Present Perfect Continuous ning o'tmishdagi varianti. «U kelganida men bir soatdan beri kutayotgan edim».",
["had been + V-ing","for / since bilan ko'p ishlatiladi","Sabab ko'rsatish: Her eyes were red because she had been crying."],
["Holat fe'llari bilan Past Perfect: I had known him for years.","Tugagan son-sanoq — Past Perfect: I had written 3 letters.","by the time, before, when bilan."],
[["I had been waiting for an hour when he arrived.","U kelganida bir soatdan beri kutayotgan edim."],["She was tired because she had been running.","U yugurgani uchun charchagan edi."],["They had been living in Paris for years before they moved.","Ko'chishdan oldin ular yillar davomida Parijda yashagan edilar."],["How long had you been studying before the exam?","Imtihondan oldin qancha vaqt o'qigan eding?"],["The ground was wet. It had been raining.","Yer ho'l edi. Yomg'ir yog'ib turgan edi."]],
["I was waiting for two hours when she called.","I had been waiting for two hours when she called."],
[["He ___ for 3 hours when he finally stopped.",["was driving","had been driving","has been driving"],1,"O'tmish nuqtasigacha davomiylik."],["I ___ him for years before we married.",["had been knowing","had known","knew since"],1,"know — holat fe'li."],["Her clothes were dirty. She ___ in the garden.",["had been working","has worked","works"],0,"Sabab."]]);

T("B2","futperf","Future Continuous & Future Perfect","Kelasi davomli va tugallangan",
"will be + -ing — kelajakdagi ma'lum paytda davom etadi. will have + V3 — ma'lum vaqtgacha tugagan bo'ladi.",
"«Ertaga shu paytda samolyotda bo'laman» va «2030-yilgacha uy qurib bo'lgan bo'laman» — kelajakka qarab turib aytilgan ikki xil fikr.",
["will be + V-ing — This time tomorrow I'll be flying.","will have + V3 — By 6 pm I'll have finished.","by + vaqt — Future Perfect signali"],
["Muloyim so'roq: Will you be using the car tonight?","Future Perfect Continuous: By May I'll have been working here for a year.","by the time + Present Simple."],
[["At 9 pm I'll be watching the match.","Kechqurun 9 da o'yinni ko'rayotgan bo'laman."],["This time next week we'll be lying on the beach.","Kelasi hafta shu paytda sohilda yotgan bo'lamiz."],["I will have finished the report by Monday.","Dushanbagacha hisobotni tugatgan bo'laman."],["By the time you arrive, we will have eaten.","Sen kelguningcha biz ovqatlanib bo'lgan bo'lamiz."],["Will you be coming to the meeting?","Yig'ilishga kelasizmi?"]],
["By next year I will finish university.","By next year I will have finished university."],
[["Don't call at 8. I ___ dinner.",["will have","will be having","have"],1,"Ma'lum paytda davom etadi."],["By 2030 they ___ the new airport.",["will have built","will build","are building"],0,"by + vaqt."],["This time tomorrow I ___ to Dubai.",["will fly","will be flying","fly"],1,"Ayni paytdagi kelajak."]]);

T("B2","cond3","Third Conditional","Uchinchi shart gap",
"If + had + V3, would have + V3 — o'tmishda bo'lmagan voqea va uning natijasi. Afsus yoki tanqid.",
"«Ko'proq o'qiganimda, o'tgan bo'lardim» — lekin o'qimadim va o'tmadim. O'tmishni o'zgartirib bo'lmaydi, faqat tasavvur qilamiz.",
["If + had + V3, would have + V3","could have / might have — would have o'rnida","Qisqa: If I'd known, I'd have come."],
["If I would have known — xato.","'d = had (If qismida) yoki would (natija qismida).","Inkor: If you hadn't helped me, I wouldn't have finished."],
[["If I had studied harder, I would have passed.","Ko'proq o'qiganimda, o'tgan bo'lardim."],["If we had left earlier, we wouldn't have missed the plane.","Ertaroq chiqqanimizda, samolyotdan qolmasdik."],["She would have come if you had invited her.","Taklif qilganingda u kelgan bo'lardi."],["If you hadn't helped me, I couldn't have done it.","Sen yordam bermaganingda, buni qila olmasdim."],["What would you have done if you had been there?","U yerda bo'lganingda nima qilgan bo'larding?"]],
["If I would have known, I would have helped.","If I had known, I would have helped."],
[["If he ___ the alarm, he wouldn't have been late.",["heard","had heard","has heard"],1,"had + V3."],["I ___ you if I had had your number.",["would call","would have called","will call"],1,"would have + V3."],["If it hadn't rained, we ___ to the beach.",["would go","would have gone","went"],1,"would have gone."]]);

T("B2","mixedcond","Mixed conditionals","Aralash shart gaplar",
"O'tmishdagi sabab → hozirgi natija: If + had V3, would + V1. Hozirgi sabab → o'tmishdagi natija: If + Past, would have V3.",
"Hayotda sabab va natija har doim bir zamonda bo'lmaydi. «O'sha ishni olganimda (o'tmish), hozir boy bo'lardim (hozir)».",
["O'tmish → hozir: If I had taken that job, I would be rich now.","Hozir → o'tmish: If I spoke French, I would have got the job.","Hozirgi xususiyat → o'tmish natijasi: If she weren't so shy, she would have spoken."],
["now, today — hozirgi natija belgisi.","Har bir qism o'z zamoniga mos.","Ko'pincha afsus ifodalaydi."],
[["If I had taken that job, I would be rich now.","O'sha ishni olganimda, hozir boy bo'lardim."],["If I had learned English as a child, I would be fluent now.","Bolalikda ingliz tilini o'rganganimda, hozir ravon gapirardim."],["If she weren't so busy, she would have come yesterday.","U shunchalik band bo'lmaganida, kecha kelgan bo'lardi."],["If we hadn't missed the bus, we would be there by now.","Avtobusdan qolmaganimizda, hozir u yerda bo'lardik."],["If I knew him, I would have said hello.","Uni tanisam, salom bergan bo'lardim."]],
["If I had studied medicine, I would have been a doctor now.","If I had studied medicine, I would be a doctor now."],
[["If I had saved money, I ___ a car now.",["would have","would have had","will have"],0,"Hozirgi natija."],["If he ___ so lazy, he would have finished.",["isn't","weren't","hadn't"],1,"Hozirgi xususiyat."],["If you'd taken the medicine, you ___ better now.",["would feel","would have felt","feel"],0,"now — hozir."]]);

T("B2","wish2","Wish / if only: past & would","Afsus va norozilik",
"wish + Past Perfect — o'tmishdagi afsus. wish + would — boshqalarning xatti-harakatiga norozilik.",
"«Buni aytmaganimda edi» = I wish I hadn't said that. «Shovqin qilishni bas qilsang edi» = I wish you would stop.",
["O'tmish: wish + had + V3","Boshqalar: wish + sb + would + V1","Hozir: wish + Past Simple (B1)"],
["O'zingiz haqida would emas: I wish I could …","If only — kuchli his: If only I had listened!","would — o'zgarishi mumkin bo'lgan narsalar uchun: I wish it would stop raining."],
[["I wish I had saved more money.","Ko'proq pul yig'ganimda edi."],["I wish I hadn't said that. I'm sorry.","Buni aytmaganimda edi. Kechir."],["I wish you would stop interrupting me.","Gapimni bo'lishni bas qilsang edi."],["If only I had listened to my parents!","Qani endi ota-onamga quloq solganimda!"],["I wish it would stop raining.","Yomg'ir to'xtasa edi."]],
["I wish I didn't eat so much last night.","I wish I hadn't eaten so much last night."],
[["I wish I ___ that. I'm sorry.",["didn't say","hadn't said","don't say"],1,"O'tmish — Past Perfect."],["I wish he ___ his music down.",["would turn","turned","turns"],0,"Boshqaga norozilik."],["If only I ___ earlier!",["left","had left","would leave"],1,"O'tmish afsusi."]]);

T("B2","pastmodals","Past modals: must have / should have","O'tgan zamon modallari",
"must have + V3 — o'tmishda aniq bo'lgan; can't have — bo'lmagan; might have — ehtimol; should have — qilish kerak edi (afsus).",
"O'tmish haqida taxmin va afsus. «U unutgan bo'lsa kerak», «Ertaroq chiqishimiz kerak edi».",
["must have + V3 — deyarli aniq","might / may / could have + V3 — ehtimol","can't / couldn't have + V3 — imkonsiz","should / shouldn't have + V3 — tanqid, afsus","could have + V3 — imkon bor edi, lekin bo'lmadi"],
["needn't have + V3 — qildim, lekin kerak emas ekan (C1).","would have — 3-shartda.","Talaffuz: must've, should've, could've."],
[["The ground is wet. It must have rained.","Yer ho'l. Yomg'ir yoqqan bo'lsa kerak."],["She can't have seen me — she didn't say hello.","U meni ko'rmagan bo'lsa kerak — salom bermadi."],["I may have left my wallet at work.","Hamyonimni ishda qoldirgan bo'lishim mumkin."],["You should have told me earlier.","Menga oldinroq aytishing kerak edi."],["We could have won, but we didn't try hard.","Yutishimiz mumkin edi, lekin harakat qilmadik."]],
["He must forget about the meeting yesterday.","He must have forgotten about the meeting yesterday."],
[["He isn't here. He ___ the train.",["must miss","must have missed","should miss"],1,"O'tmish taxmini."],["I failed. I ___ harder.",["should study","should have studied","must have studied"],1,"Afsus."],["She ___ stolen it — she was with me.",["must have","can't have","should have"],1,"Imkonsiz."]]);

T("B2","passive2","Passive: all tenses & modals","Majhul: barcha zamonlar",
"Har qanday zamonda: be ning shu zamondagi shakli + V3.",
"B1 da hozirgi va o'tgan majhulni o'rgandik. Endi barcha zamonlar va modal fe'llar bilan.",
["Present Cont: is being built","Present Perfect: has been sold","Past Perfect: had been stolen","Future: will be done","Modal: can be seen · must be paid · should have been told"],
["Ikki to'ldiruvchili fe'llar: I was given a prize.","get passive (so'zlashuv): He got arrested.","Infinitiv: wants to be promoted · -ing: hates being criticised."],
[["The road is being repaired, so we have to take a detour.","Yo'l ta'mirlanyapti, shuning uchun aylanib o'tishimiz kerak."],["My phone has been stolen!","Telefonim o'g'irlandi!"],["The results will be announced tomorrow.","Natijalar ertaga e'lon qilinadi."],["The tickets must be paid for in advance.","Chiptalar oldindan to'lanishi shart."],["I was given a scholarship.","Menga stipendiya berildi."]],
["The project will finished by Friday.","The project will be finished by Friday."],
[["A new school ___ in our street right now.",["is building","is being built","has built"],1,"Present Continuous Passive."],["The windows ___ cleaned yet.",["haven't been","hasn't been","weren't been"],0,"Present Perfect Passive."],["This form must ___ in English.",["complete","be completed","completed"],1,"Modal passive."]]);

T("B2","passivereport","Impersonal passive: It is said that …","Shaxssiz majhul",
"It is said / believed / thought that … yoki He is said to … — «aytishlaricha, … deb hisoblanadi».",
"Yangiliklar va rasmiy matnlarda ma'lumot manbasini aniq aytmasdan xabar berish uchun.",
["It + is said / thought / believed / reported + that + gap","Ega + is said + to V1 (hozir)","Ega + is said + to have V3 (o'tmish)","Ega + is said + to be V-ing (davom etayotgan)"],
["Fe'llar: say, believe, think, report, expect, know, consider, claim.","O'tmishda: It was believed that …","IELTS Writing uchun juda foydali."],
[["It is said that the castle is haunted.","Aytishlaricha, qal'ada arvoh bor."],["He is believed to be the richest man in the city.","U shahardagi eng boy odam deb hisoblanadi."],["The thieves are thought to have escaped abroad.","O'g'rilar chet elga qochib ketgan deb taxmin qilinmoqda."],["It is expected that prices will rise.","Narxlar oshishi kutilmoqda."],["She is reported to be working on a new book.","Xabarlarga ko'ra, u yangi kitob ustida ishlayapti."]],
["He is said that he is rich.","He is said to be rich. / It is said that he is rich."],
[["It ___ that he lives abroad.",["says","is said","is saying"],1,"It is said that."],["She is believed ___ the money.",["to steal","to have stolen","stealing"],1,"O'tmish — to have V3."],["The president is expected ___ today.",["to arrive","arrive","arriving"],0,"to V1."]]);

T("B2","reportingverbs","Reporting verbs","Yetkazish fe'llari",
"say/tell o'rniga aniqroq fe'llar: suggest, deny, admit, refuse, promise, warn, advise … Har biri o'z tuzilishiga ega.",
"«U … dedi» o'rniga «U tan oldi», «U rad etdi», «U ogohlantirdi» deyish nutqni boyitadi va aniqroq qiladi.",
["+ to V1: agree, refuse, promise, offer, threaten","+ kishi + to V1: advise, warn, persuade, remind, ask, encourage","+ V-ing: deny, admit, suggest, recommend","+ predlog + V-ing: apologise for, insist on, accuse sb of, blame sb for"],
["suggest + that/-ing (suggest me to — xato).","warn sb not to …","apologise for + -ing."],
[["He admitted stealing the money.","U pulni o'g'irlaganini tan oldi."],["She refused to answer the question.","U savolga javob berishdan bosh tortdi."],["The doctor advised me to rest.","Shifokor menga dam olishni maslahat berdi."],["They accused him of lying.","Ular uni yolg'onchilikda aybladilar."],["I suggested going to the cinema.","Men kinoga borishni taklif qildim."]],
["He suggested me to go home.","He suggested that I go home. / He suggested going home."],
[["She denied ___ the window.",["to break","breaking","break"],1,"deny + -ing."],["He promised ___ me.",["calling","to call","call"],1,"promise + to."],["They warned us ___ swim there.",["not to","to not","don't"],0,"warn sb not to."]]);

T("B2","relative2","Relative clauses: advanced","Nisbiy gaplar: murakkab",
"Predlog + whom/which (rasmiy): the man to whom I spoke. Miqdor + of which/whom: some of whom.",
"Rasmiy va yozma nutqda predlog gap oxiriga emas, olmosh oldiga qo'yiladi. Shuningdek miqdor ifodalari bilan.",
["Norasmiy: the man I spoke to","Rasmiy: the man to whom I spoke","all / some / most / none of whom (odamlar)","many / both / half of which (narsalar)"],
["Predlogdan keyin who emas, whom; that emas, which.","whose — narsalar uchun ham: a company whose profits rose.","what = the thing that: What I need is time."],
[["The person to whom I spoke was very helpful.","Men gaplashgan odam juda yordam berdi."],["I have three brothers, all of whom are engineers.","Uchta akam bor, hammasi muhandis."],["She bought two dresses, neither of which fitted her.","U ikkita ko'ylak oldi, ikkalasi ham to'g'ri kelmadi."],["The company, whose profits doubled, hired more staff.","Foydasi ikki baravar oshgan kompaniya ko'proq xodim oldi."],["That's exactly what I wanted.","Aynan men xohlagan narsa shu."]],
["I have two sisters, both of them are doctors.","I have two sisters, both of whom are doctors."],
[["The topic ___ we talked was interesting.",["about which","about that","which about"],0,"Predlog + which."],["He has many friends, most of ___ live abroad.",["them","whom","who"],1,"most of whom."],["___ he said was true.",["That","What","Which"],1,"What = the thing that."]]);

T("B2","participle","Participle clauses","Sifatdosh/ravishdosh oborotlari",
"Gapni qisqartirish: -ing (faol), V3 (majhul), Having + V3 (oldin bo'lgan).",
"Ikki gapni bitta ixcham gapga aylantiradi. Akademik yozuv va adabiy matnlarda juda ko'p uchraydi.",
["Faol: Feeling tired, I went to bed. (= Because I felt tired)","Majhul: Built in 1900, the house is very old. (= which was built)","Oldin: Having finished work, she went home. (= After she had finished)","Nisbiy gap o'rnida: The man standing there is my uncle."],
["Ega ikkala qismda bir xil bo'lishi shart.","Inkor: Not knowing the answer, I stayed silent.","Bog'lovchi bilan: While waiting, I read a book."],
[["Feeling tired, I went to bed early.","Charchaganim uchun erta yotdim."],["Having finished her homework, she went out.","Uy vazifasini tugatib, u ko'chaga chiqdi."],["Built in the 15th century, the mosque attracts thousands of tourists.","XV asrda qurilgan masjid minglab sayyohlarni jalb qiladi."],["The girl sitting next to me is my cousin.","Yonimda o'tirgan qiz amakimning qizi."],["Not knowing what to say, he left.","Nima deyishni bilmay, u chiqib ketdi."]],
["Walking in the park, the rain started. (yomg'ir yurmaydi!)","Walking in the park, I got caught in the rain."],
[["___ the letter, she started to cry.",["Read","Having read","To read"],1,"Oldin bo'lgan."],["The books ___ on the table are mine.",["lying","lain","lay"],0,"Faol — -ing."],["___ in English, the book is popular worldwide.",["Writing","Written","Having writing"],1,"Majhul — V3."]]);

T("B2","gerundmeaning","Verbs that change meaning: -ing vs to","Ma'nosi o'zgaradigan fe'llar",
"remember/forget/stop/try/regret — -ing va to bilan boshqa-boshqa ma'no beradi.",
"«Chekishni tashladi» va «chekish uchun to'xtadi» — bitta fe'l, ikki xil ma'no. Bu farqni bilish B2 darajasining belgisi.",
["remember doing — o'tmishni eslash · remember to do — unutmay bajarish","stop doing — tashlash · stop to do — biror ish uchun to'xtash","try doing — sinab ko'rish · try to do — harakat qilish (qiyin)","regret doing — qilganiga afsus · regret to tell — afsus bilan aytmoq","go on doing — davom ettirmoq · go on to do — keyin boshqa ishga o'tmoq"],
["forget ham remember kabi.","need doing = need to be done: The car needs washing.","like doing (umumiy) / like to do (odat sifatida to'g'ri deb bilish)."],
[["I remember meeting him in 2015.","U bilan 2015-yilda uchrashganimni eslayman."],["Remember to lock the door.","Eshikni qulflashni unutma."],["He stopped smoking last year.","U o'tgan yili chekishni tashladi."],["We stopped to buy some water.","Suv olish uchun to'xtadik."],["Try restarting the computer.","Kompyuterni qayta ishga tushirib ko'r."]],
["I stopped to smoke. (ma'no: chekishni tashladim)","I stopped smoking."],
[["Did you remember ___ the bills?",["paying","to pay","pay"],1,"Unutmay bajarish."],["I'll never forget ___ the sea for the first time.",["seeing","to see","see"],0,"O'tmish xotirasi."],["We regret ___ you that the flight is cancelled.",["informing","to inform","inform"],1,"Rasmiy afsus — to."]]);

T("B2","quantifiers2","All / each / every / whole / none","Murakkab miqdor so'zlari",
"every/each + birlik; all + ko'plik; whole — butun; none of — hech biri.",
"Barchasi, har biri, butun va hech biri — o'xshash, lekin grammatikasi farq qiladi.",
["every + birlik ot (umumiy): every student","each + birlik ot (alohida-alohida): each student","all (of) + ko'plik / sanalmaydigan: all students, all the money","the whole + birlik: the whole day","none of + ot/olmosh: none of them"],
["every — kamida 3 ta; each — 2 ta ham bo'lishi mumkin.","all day = the whole day.","none of + ko'plik — rasmiyda birlik fe'l, so'zlashuvda ikkalasi."],
[["Every child needs love.","Har bir bolaga mehr kerak."],["Each student received a certificate.","Har bir talaba sertifikat oldi."],["All of my friends came to the wedding.","To'yga hamma do'stlarim keldi."],["I spent the whole day in bed.","Butun kunni to'shakda o'tkazdim."],["None of us knew the answer.","Hech birimiz javobni bilmasdik."]],
["Every students passed the test.","Every student passed the test."],
[["___ person has a different opinion.",["All","Every","Whole"],1,"every + birlik."],["She ate ___ cake.",["the whole","all whole","whole the"],0,"the whole + birlik."],["___ of the answers were correct.",["None","No","Every"],0,"none of."]]);

T("B2","unreal","It's time / would rather / had better","Xayoliy o'tgan shakllar",
"It's time + Past (vaqti keldi); would rather + sb + Past (afzal ko'rardim); had better + V1 (yaxshisi … qil).",
"Bu iboralar o'tgan zamon shaklini ishlatadi, ammo hozir yoki kelajak haqida gapiradi.",
["It's (high) time + ega + Past: It's time we left.","It's time + to V1: It's time to go.","would rather + V1 (o'zim): I'd rather stay home.","would rather + sb + Past: I'd rather you didn't smoke.","had better + V1: You'd better hurry."],
["had better — kuchli maslahat yoki ogohlantirish (yoki yomon bo'ladi).","Inkor: You'd better not be late.","would rather … than: I'd rather walk than take a bus."],
[["It's time we went home.","Uyga ketish vaqti keldi."],["It's high time you got a job.","Ishga kirishing vaqti allaqachon keldi."],["I'd rather stay at home tonight.","Bugun kechqurun uyda qolganim ma'qul."],["I'd rather you didn't tell anyone.","Hech kimga aytmasang yaxshi bo'lardi."],["You'd better take an umbrella.","Yaxshisi soyabon olib ol."]],
["You had better to go now.","You had better go now."],
[["It's time we ___ .",["leave","left","leaving"],1,"It's time + Past."],["I'd rather you ___ here.",["stay","stayed","staying"],1,"would rather sb + Past."],["You'd better ___ late again.",["not be","not to be","don't be"],0,"had better not + V1."]]);

T("B2","soneither","So do I / Neither do I","Qo'shilish: men ham",
"Darakka qo'shilish: So + yordamchi + ega. Inkorga qo'shilish: Neither/Nor + yordamchi + ega.",
"«Men ham» deyishning inglizcha usuli — yordamchi fe'l orqali, gapning zamoniga mos.",
["I like tea. — So do I.","I can't swim. — Neither can I.","I went there. — So did I.","I'm tired. — So am I."],
["Qo'shilmaslik: I like tea. — I don't. / I can't swim. — I can.","So'zlashuvda: Me too. / Me neither.","Yordamchi fe'l birinchi gapdagi bilan bir xil turda."],
[["I love this song. — So do I.","Bu qo'shiq menga juda yoqadi. — Menga ham."],["I haven't finished. — Neither have I.","Men tugatmadim. — Men ham."],["She was tired. — So was I.","U charchagan edi. — Men ham."],["I won't go. — Nor will I.","Men bormayman. — Men ham."],["I can drive. — Oh, I can't.","Men mashina hayday olaman. — Men esa yo'q."]],
["I don't like it. — So don't I.","I don't like it. — Neither do I."],
[["I've been to Paris. — So ___ I.",["did","have","am"],1,"have."],["She doesn't eat meat. — Neither ___ I.",["do","don't","am"],0,"do."],["I was late. — So ___ I.",["did","was","were"],1,"was."]]);

T("B2","compadv","Advanced comparisons","Murakkab solishtirish",
"the … -er, the … -er (qanchalik … shunchalik). far/much/slightly + qiyos. -er and -er (tobora).",
"Solishtirishni kuchaytirish, kamaytirish va o'zgarishni ko'rsatish usullari.",
["the + qiyos …, the + qiyos: The more you read, the more you learn.","Kuchli farq: far / much / a lot / considerably better","Kichik farq: slightly / a bit / a little cheaper","Tobora: better and better, more and more expensive"],
["nowhere near as … as — umuman … emas.","twice as … as — ikki barobar.","the same as / different from / similar to."],
[["The more you practise, the better you get.","Qancha ko'p mashq qilsang, shuncha yaxshi bo'lasan."],["This phone is far more expensive than that one.","Bu telefon unisidan ancha qimmat."],["It's getting colder and colder.","Havo tobora sovuqlashyapti."],["Our flat is twice as big as yours.","Kvartiramiz siznikidan ikki barobar katta."],["The exam was nowhere near as hard as I expected.","Imtihon men kutganchalik qiyin emas edi."]],
["The more I study, more I understand.","The more I study, the more I understand."],
[["The sooner we leave, ___ we'll arrive.",["the earlier","earlier","the earliest"],0,"the … the."],["Prices are getting ___ .",["higher and higher","more high","the higher"],0,"Tobora."],["This one is ___ better.",["very","far","more"],1,"far + qiyos."]]);
T("C1","inversion","Inversion after negative adverbials","Inversiya (teskari tartib)",
"Inkor yoki cheklovchi so'z gap boshiga chiqsa, ega va yordamchi fe'l o'rin almashadi: Never have I seen…",
"Rasmiy, adabiy va ta'sirli nutqda urg'u berish usuli. So'z tartibi so'roq gapdagidek bo'ladi, lekin gap darak.",
["Never / Rarely / Seldom + yordamchi + ega: Rarely do we meet.","Not only … but also: Not only is she smart, but she is also kind.","Hardly / Scarcely … when; No sooner … than: No sooner had I arrived than it rained.","Only then / Only after / Not until + … + inversiya","Under no circumstances / On no account + inversiya"],
["Yordamchi yo'q bo'lsa — do/does/did: Little did I know.","Rasmiy yozuvda (IELTS Writing 8+) juda foydali.","Oddiy suhbatda kam ishlatiladi."],
[["Never have I seen such a beautiful place.","Bunday go'zal joyni hech qachon ko'rmaganman."],["Not only is she smart, but she is also kind.","U nafaqat aqlli, balki mehribon ham."],["Rarely do we get such an opportunity.","Bunday imkoniyat kamdan-kam bo'ladi."],["No sooner had we arrived than it started to rain.","Yetib kelishimiz bilan yomg'ir boshlandi."],["Under no circumstances should you open this door.","Hech qanday holatda bu eshikni ochmang."]],
["Never I have been so happy.","Never have I been so happy."],
[["Never ___ such a mess!",["I have seen","have I seen","I saw"],1,"have + I."],["Not until he left ___ the truth.",["I realised","did I realise","I did realise"],1,"Not until + inversiya."],["Hardly ___ sat down when the phone rang.",["I had","had I","I have"],1,"Hardly had I."]]);

T("C1","cleft","Cleft sentences","Ajratilgan gaplar (urg'u)",
"It is/was … that/who …; What … is … — gapning bir qismini «aynan shu» deb ajratadi.",
"O'zbekchadagi «aynan», «-ki» yuklamalari kabi. Diqqatni kerakli ma'lumotga qaratadi.",
["It was + urg'u + that/who + qolgani: It was Ali who broke it.","What + gap + is/was + urg'u: What I need is a holiday.","All + gap + is: All I want is peace.","The thing / reason / place + … + is"],
["What … is — muhim narsani oxirga qo'yadi.","It is … that — taqqoslash yoki tuzatish uchun: It's not the money that matters.","What happened was (that) … — hikoyada."],
[["It was my mother who taught me to cook.","Menga ovqat pishirishni aynan onam o'rgatgan."],["What I really need is a good night's sleep.","Menga aslida kerak narsa — yaxshi uyqu."],["It's not the money that matters, it's the experience.","Muhimi pul emas, tajriba."],["All I want is some peace and quiet.","Faqat tinchlik-osoyishtalikni xohlayman."],["The reason I called is to apologise.","Qo'ng'iroq qilishimning sababi — uzr so'rash."]],
["It was him who he called me.","It was him who called me."],
[["___ I like about her is her honesty.",["That","What","Which"],1,"What + gap + is."],["It was in 2020 ___ we met.",["that","what","which"],0,"It was … that."],["___ was Sara who found it.",["What","It","This"],1,"It was … who."]]);

T("C1","advcond","Advanced conditionals","Murakkab shart gaplar",
"if o'rnida: unless, provided (that), as long as, on condition that, suppose, otherwise, but for. Inversiya: Had I known… / Should you need… / Were I…",
"Rasmiy va aniq shart ifodalash uchun if dan boshqa vositalar ham bor. Ular nozik ma'no farqlarini beradi.",
["provided / providing (that), as long as, on condition that — faqat … sharti bilan","unless = if not","Suppose / Supposing … — faraz qilaylik","But for + ot = If it hadn't been for","Inversiya: Had I known = If I had known · Should you need = If you need · Were I you = If I were you"],
["even if — hatto … bo'lsa ham.","in case — ehtiyot uchun (shart emas!).","otherwise — aks holda."],
[["You can borrow my car provided that you drive carefully.","Ehtiyot bo'lib haydash sharti bilan mashinamni olishing mumkin."],["Had I known you were coming, I would have cooked.","Kelishingni bilganimda, ovqat pishirardim."],["Should you need any help, please call me.","Yordam kerak bo'lsa, menga qo'ng'iroq qiling."],["But for your help, I would have failed.","Sizning yordamingiz bo'lmaganida, muvaffaqiyatsizlikka uchrardim."],["Take an umbrella in case it rains.","Yomg'ir yog'ib qolsa deb soyabon ol."]],
["If I would have known, I would have come.","Had I known, I would have come."],
[["___ you need anything, just ask.",["Should","Would","Had"],0,"Should + ega."],["I'll go ___ you come with me.",["unless","provided","in case"],1,"Sharti bilan."],["___ I been there, I would have helped.",["If","Had","Were"],1,"Had I been."]]);

T("C1","subjunctive","The subjunctive","Subyunktiv (buyruq-istak mayli)",
"suggest/insist/demand/recommend that + ega + V1 (-s siz). It is essential/vital that + V1.",
"Rasmiy ingliz tilida talab, tavsiya va zaruratni bildiruvchi so'zlardan keyin fe'l oddiy shaklda qoladi — hatto he/she bilan ham.",
["suggest / recommend / insist / demand / request + that + ega + V1","It is essential / important / vital / necessary that + ega + V1","Inkor: that he not be late","Qotib qolgan iboralar: God save the King. Be that as it may. If need be."],
["BrE da should bilan ham: I suggest that he should go.","He be emas, he is deb ishlatish so'zlashuvda keng, lekin rasmiyda subyunktiv.","were-subyunktiv: If I were you; as if he were king."],
[["The doctor recommended that she rest for a week.","Shifokor unga bir hafta dam olishni tavsiya qildi."],["It is essential that every student attend the meeting.","Har bir talaba yig'ilishda qatnashishi shart."],["They insisted that he pay the full price.","Ular uning to'liq narxni to'lashini talab qilishdi."],["I suggest that she not be told yet.","Unga hozircha aytmaslikni taklif qilaman."],["He behaves as if he were the boss.","U o'zini go'yo boshliqdek tutadi."]],
["I suggest that he goes to a doctor. (rasmiy)","I suggest that he go to a doctor."],
[["The teacher insisted that he ___ the test again.",["takes","take","took"],1,"Subyunktiv — V1."],["It is vital that she ___ informed.",["is","be","was"],1,"be."],["I recommend that he ___ smoke.",["doesn't","not","won't"],1,"that he not …"]]);

T("C1","futureinpast","Future in the past","O'tmishdagi kelajak",
"O'tmishdan qaraganda kelajak: was going to, would, was about to, was to.",
"«Men unga qo'ng'iroq qilmoqchi edim, lekin unutdim» — o'tmishdagi reja. Hikoyalarda va bahona aytganda juda kerakli.",
["was / were going to + V1 — reja (ko'pincha amalga oshmagan)","would + V1 — o'tmishdagi bashorat: I knew he would win.","was about to + V1 — endi … moqchi edi","was to + V1 — taqdir/reja: She was to become famous.","was to have + V3 — amalga oshmagan reja"],
["I was going to call you, but … — bahona.","Reported speech da will → would.","was on the point of + -ing = was about to."],
[["I was going to call you, but I forgot.","Senga qo'ng'iroq qilmoqchi edim, lekin unutibman."],["I knew she would pass the exam.","U imtihondan o'tishini bilardim."],["We were about to leave when it started to snow.","Endi chiqmoqchi edikki, qor yog'a boshladi."],["He was to become one of the greatest poets.","U eng buyuk shoirlardan biriga aylanishi kerak edi (va aylandi)."],["The meeting was to have taken place on Monday.","Yig'ilish dushanba kuni bo'lishi kerak edi (bo'lmadi)."]],
["I knew he will come.","I knew he would come."],
[["I ___ buy it, but it was sold out.",["will","was going to","am going to"],1,"Amalga oshmagan reja."],["She said she ___ help me.",["will","would","is going"],1,"will → would."],["I ___ to leave when he arrived.",["was about","am about","would about"],0,"was about to."]]);

T("C1","emphasis","Emphasis: do, very, such, ever","Urg'u berish vositalari",
"Darak gapda do/does/did — kuchli tasdiq: I DO love you. the very — aynan. ever — so'roqni kuchaytiradi.",
"Nutqda his-tuyg'u va qat'iylikni ifodalash. Yozuvda bu vositalar matnni jonliroq qiladi.",
["do/does/did + V1: I did call you! She does look tired.","the very + ot: the very best, at the very end","on earth / ever: What on earth …? Why ever …?","Takror: I waited and waited.","Buyruqda: Do sit down! (muloyim taklif)"],
["Talaffuzda do urg'u oladi.","at all — inkor/so'roqni kuchaytiradi: not at all.","whatsoever — inkorni kuchaytiradi: no doubt whatsoever."],
[["I did lock the door — I'm sure!","Eshikni qulfladim — aniq!"],["She does speak English, just not very well.","U inglizcha gapiradi-ku, faqat juda yaxshi emas."],["This is the very book I was looking for.","Aynan men qidirgan kitob shu."],["What on earth are you doing?","Nima balo qilyapsan?"],["There's no evidence whatsoever.","Hech qanday dalil yo'q."]],
["I do called you yesterday.","I did call you yesterday."],
[["You ___ look tired today!",["do","does","are"],0,"You + do."],["He ___ tell me — I just forgot.",["did","does","was"],0,"O'tmish urg'usi."],["That's the ___ thing I need!",["very","much","so"],0,"the very."]]);

T("C1","ellipsis","Ellipsis & substitution","Tushirib qoldirish va almashtirish",
"Takrorlamaslik uchun: so, not, one/ones, do so, yordamchi fe'l bilan qisqartirish.",
"Ona tilida so'zlashuvchilar bir xil so'zlarni takrorlamaydi. Bu nutqni tabiiy qiladi.",
["so / not: I think so. I hope not. I'm afraid so.","one / ones: I want the red one.","do so: He promised to help, and he did so.","Yordamchida to'xtash: I can't swim, but she can.","to bilan: I'd like to. / I didn't want to."],
["I don't think so (I think not — rasmiy).","Ega va yordamchi tushishi: Sounds good. (It sounds good.)","Bog'lovchidan keyin: She came in and (she) sat down."],
[["Will it rain? — I hope not.","Yomg'ir yog'adimi? — Umid qilamanki, yo'q."],["I don't like this shirt. Have you got a bigger one?","Bu ko'ylak yoqmadi. Kattarog'i bormi?"],["He said he would apologise, and he did so.","U uzr so'rashini aytdi va so'radi ham."],["Are you coming? — I'd love to.","Kelasanmi? — Jon deb."],["She can play the piano, but I can't.","U pianino chala oladi, men esa yo'q."]],
["Is he coming? — I think yes.","Is he coming? — I think so."],
[["Is it going to rain? — I'm afraid ___ .",["so","yes","it"],0,"I'm afraid so."],["These shoes are too small. I need bigger ___ .",["one","ones","them"],1,"Ko'plik — ones."],["Do you want to come? — Yes, I'd like ___ .",["to","it","so"],0,"I'd like to."]]);

T("C1","nominal","Nominalisation","Otlashtirish",
"Fe'l/sifat o'rniga ot: decide → decision, important → importance. Akademik uslubning asosi.",
"Akademik va rasmiy matnlarda harakatlar ot shaklida beriladi. Bu matnni ob'ektiv va ixcham qiladi. IELTS Writing Task 2 uchun juda muhim.",
["Fe'l → ot: analyse → analysis, develop → development, fail → failure","Sifat → ot: able → ability, aware → awareness","Tuzilish: The + ot + of: the reduction of costs","Dinamik: The government decided … → The government's decision …"],
["Ortiqchasi matnni og'irlashtiradi — me'yorni saqlang.","Qo'shimchalar: -tion, -ment, -ance/-ence, -ity, -ness, -al.","Otdan keyin of + to'ldiruvchi."],
[["Prices increased rapidly. → There was a rapid increase in prices.","Narxlar tez oshdi. → Narxlarning keskin o'sishi kuzatildi."],["The company failed because it planned badly. → The company's failure was due to poor planning.","Kompaniyaning muvaffaqiyatsizligi yomon rejalashtirish tufayli edi."],["People are becoming more aware of the problem.","Muammodan xabardorlik oshmoqda."],["The introduction of new laws reduced crime.","Yangi qonunlarning joriy etilishi jinoyatchilikni kamaytirdi."],["Her ability to adapt impressed everyone.","Uning moslashish qobiliyati hammani hayratda qoldirdi."]],
["The analyse of the data showed…","The analysis of the data showed…"],
[["decide → ?",["decidement","decision","decidance"],1,"decision."],["There has been a sharp ___ in unemployment.",["rise","rising","risen"],0,"Ot — rise."],["The ___ of the bridge took two years.",["construct","construction","constructing"],1,"Ot — construction."]]);

T("C1","hedging","Hedging & distancing","Ehtiyotkor fikr bildirish",
"Qat'iy aytmaslik: It seems that, tend to, appear to, may, likely, to some extent.",
"Akademik va professional nutqda faktni haddan tashqari qat'iy aytish xato hisoblanadi. Ehtiyotkor iboralar fikrni xolis va ishonchli qiladi.",
["Fe'llar: seem, appear, tend, suggest, indicate","Modal: may, might, could","Sifat/ravish: likely, possible, probably, arguably, relatively","Iboralar: to some extent, in some cases, it could be argued that","Shaxssiz: It is thought that … / There is evidence that …"],
["Hammasi → ko'pchilik: All people → Most people.","Har doim → odatda: always → tend to.","Ortiqcha hedging fikrni noaniq qiladi."],
[["It seems that the policy has been successful.","Siyosat muvaffaqiyatli bo'lganga o'xshaydi."],["Young people tend to spend more time online.","Yoshlar onlayn ko'proq vaqt o'tkazishga moyil."],["The results appear to support this theory.","Natijalar bu nazariyani qo'llab-quvvatlaganga o'xshaydi."],["It could be argued that technology isolates people.","Texnologiya odamlarni yolg'izlatadi, deyish mumkin."],["This is likely to cause further problems.","Bu yana muammolar keltirib chiqarishi ehtimoli bor."]],
["Social media destroys all teenagers' lives.","Social media can have a negative effect on some teenagers."],
[["Women ___ live longer than men.",["always","tend to","must"],1,"Umumlashtirish — tend to."],["It ___ that the economy is recovering.",["appears","appear","is appearing"],0,"It appears that."],["This is ___ to increase costs.",["likely","probable","maybe"],0,"be likely to."]]);

T("C1","modalperf","Needn't have vs didn't need to","Modal nozikliklari",
"needn't have + V3 — qildim, lekin kerak emas ekan. didn't need to + V1 — kerak emas edi (ehtimol qilmadim).",
"C1 darajasida modal fe'llarning nozik ma'nolarini farqlash kerak.",
["needn't have done — bajarilgan, lekin befoyda","didn't need to do — zarurat yo'q edi","would — o'tmishdagi qat'iylik: He wouldn't listen. (umuman tinglamadi)","could vs was able to: muvaffaqiyatli bir martalik ish uchun was able to / managed to","may as well / might as well — boshqa yaxshiroq variant yo'q"],
["I could swim when I was 5 (umumiy qobiliyat). I was able to swim to the shore (bir martalik).","Inkorda couldn't ikkala holatda ham.","be supposed to — kutilgan, qoida bo'yicha."],
[["You needn't have bought flowers, but thank you!","Gul olishing shart emas edi, lekin rahmat!"],["I didn't need to wake up early, so I slept in.","Erta turishim kerak emas edi, shuning uchun uxlab yotdim."],["Despite the storm, we were able to reach the village.","Bo'ronga qaramay, qishloqqa yetib bora oldik."],["The car wouldn't start this morning.","Mashina bugun ertalab umuman o't olmadi."],["The bus isn't coming. We might as well walk.","Avtobus kelmayapti. Piyoda ketaveramiz."]],
["I could pass the exam yesterday.","I was able to pass the exam yesterday."],
[["I took an umbrella but it didn't rain. I ___ it.",["didn't need to take","needn't have taken","mustn't take"],1,"Olib bordim — keraksiz."],["After hours of trying, he ___ open the door.",["could","was able to","can"],1,"Bir martalik muvaffaqiyat."],["You ___ to be here at 8. Why are you late?",["are supposed","must","should"],0,"be supposed to."]]);

T("C1","fronting","Fronting","Urg'u uchun oldinga chiqarish",
"Gapning bir qismini boshga chiqarib, unga urg'u berish: Strange as it may seem, … · Into the room walked a tall man.",
"Adabiy va rasmiy matnlarda ta'sirli boshlanish uchun. So'z tartibi ba'zan o'zgaradi.",
["Sifat + as/though + ega + fe'l: Tired as she was, she kept working.","Joy ravishi + fe'l + ega: Into the room walked a stranger.","To'ldiruvchi oldinda: That I don't believe.","So + sifat + to be + ega + that: So strong was the wind that …"],
["Tired as she was = Although she was very tired.","Joy inversiyasi ega ot bo'lganda: Here comes the bus (Here it comes).","Asosan yozma uslub."],
[["Strange as it may seem, I actually enjoy exams.","G'alati tuyulsa ham, imtihonlar menga yoqadi."],["Tired as she was, she finished the report.","Charchagan bo'lsa ham, u hisobotni tugatdi."],["On the hill stood an old castle.","Tepalikda eski qal'a turardi."],["Here comes the bus!","Mana, avtobus kelyapti!"],["So strong was the wind that trees fell down.","Shamol shunchalik kuchli ediki, daraxtlar yiqildi."]],
["Here the bus comes!","Here comes the bus!"],
[["Hard ___ tried, he couldn't open it.",["as he","as did he","he as"],0,"Sifat + as + ega + fe'l."],["Down the hill ___ the children.",["the children ran","ran","run"],1,"Joy + fe'l + ega."],["So loud ___ that I couldn't sleep.",["the music was","was the music","music was"],1,"So + sifat + fe'l + ega."]]);

T("C1","compadj","Complex noun phrases & compound adjectives","Murakkab ot birikmalari",
"Ko'p ma'lumotni ixcham ifodalash: a five-star hotel, a well-known writer, a two-hour delay.",
"Qo'shma sifatlar va kengaytirilgan ot birikmalari matnni ixcham va professional qiladi.",
["son + ot (birlik!): a ten-minute walk, a three-year-old child","ravish + V3: well-paid, badly-designed, highly-qualified","sifat + ot-ed: blue-eyed, long-haired, open-minded","ot + V-ing: time-consuming, eye-catching","ot + ot: a student loan, the city council"],
["Qo'shma sifatda son bilan ot birlikda: a five-star hotel (five-stars emas).","Defis (-) bilan yoziladi.","to be dan keyin defissiz: The hotel is well known."],
[["We stayed in a five-star hotel.","Besh yulduzli mehmonxonada qoldik."],["It's a twenty-minute walk from here.","Bu yerdan yigirma daqiqalik yo'l."],["She's a highly qualified engineer.","U yuqori malakali muhandis."],["Writing a thesis is very time-consuming.","Dissertatsiya yozish juda ko'p vaqt oladi."],["He's an open-minded, easy-going person.","U keng fikrli, kirishimli odam."]],
["She has a three-years-old daughter.","She has a three-year-old daughter."],
[["a journey that lasts two hours = a ___ journey",["two-hours","two-hour","two hour's"],1,"Birlik ot."],["a job with good pay = a ___ job",["well-paid","good-paid","well-paying"],0,"well-paid."],["a person with blue eyes = a ___ person",["blue-eye","blue-eyed","blue-eyes"],1,"-ed."]]);
T("C2","inversion2","Advanced inversion","Murakkab inversiya",
"Little did I know … · Such was … that … · So + sifat + was … · Nowhere … · In no way …",
"C2 darajasida inversiya adabiy uslub, notiqlik va rasmiy hujjatlarda nozik ma'no beradi.",
["Little + did + ega + V1: Little did she realise …","Such + be + ot + that …: Such was his anger that …","Nowhere / In no way / At no time + inversiya","Not once / Not a word + inversiya: Not a word did he say.","Only by / Only in this way + inversiya"],
["Such was … = (his anger) was so great that …","Little did I know — «hayolimga ham kelmagan».","Ko'p ishlatish uslubni sun'iy qiladi."],
[["Little did I know that my life was about to change.","Hayotim o'zgarmoqchi ekanini xayolimga ham keltirmagan edim."],["Such was the demand that the tickets sold out in minutes.","Talab shunchalik katta ediki, chiptalar bir necha daqiqada tugadi."],["Nowhere else will you find such hospitality.","Bunday mehmondo'stlikni boshqa hech qayerda topmaysiz."],["Not a single word did he say all evening.","U butun kech bir og'iz ham gapirmadi."],["Only by working together can we solve this problem.","Faqat birgalikda ishlash orqaligina bu muammoni hal qila olamiz."]],
["Little I knew about his plans.","Little did I know about his plans."],
[["Little ___ that he was lying.",["I suspected","did I suspect","I did suspect"],1,"Little did I."],["___ was his fame that he couldn't go out.",["Such","So","Very"],0,"Such was + ot."],["At no time ___ the passengers in danger.",["were","they were","was"],0,"At no time were."]]);

T("C2","whatever","Whatever / however / no matter","Qanday bo'lmasin",
"whatever, whoever, wherever, however + sifat; no matter what/how/who — «nima bo'lsa ham».",
"Shartdan qat'i nazar natija o'zgarmasligini ifodalaydi.",
["Whatever + gap: Whatever you do, don't panic.","However + sifat/ravish: However hard I try, …","No matter + wh-: No matter what happens, …","whatever + ot: whatever help you need","Yolg'iz: Whatever! (so'zlashuvda — beparvolik)"],
["However hard I try (How hard I try emas).","Kelajak uchun Present: No matter what happens (will happen emas).","or whatever — yoki shunga o'xshash narsa."],
[["Whatever you decide, I'll support you.","Nima qaror qilsang ham, seni qo'llab-quvvatlayman."],["However hard I try, I can't remember his name.","Qancha urinmay, ismini eslay olmayapman."],["No matter where you go, I'll find you.","Qayerga borsang ham, seni topaman."],["Whoever told you that was lying.","Senga buni kim aytgan bo'lsa ham, yolg'on gapirgan."],["Call me whenever you need anything.","Biror narsa kerak bo'lsa, istalgan payt qo'ng'iroq qil."]],
["How much you pay, it's still too expensive.","However much you pay, it's still too expensive."],
[["___ hard it is, I'll finish it.",["However","Whatever","How"],0,"However + sifat."],["No matter what ___ , stay calm.",["will happen","happens","happened"],1,"Present."],["You can invite ___ you like.",["whoever","however","whenever"],0,"Kim bo'lsa ham."]]);

T("C2","absolute","Absolute constructions","Mustaqil oborotlar",
"O'z egasi bor sifatdosh oborot: Weather permitting, … · The work (being) done, they left.",
"Asosiy gapdan alohida egaga ega bo'lgan ixcham tuzilmalar. Yuqori darajadagi yozma uslubning belgisi.",

T("C2","register","Register: formal vs informal","Uslub: rasmiy va norasmiy",
"Bir fikr — turli uslub: get → obtain, ask for → request, but → however, a lot of → a considerable amount of.",
"Mukammal ingliz tili — vaziyatga mos uslubni tanlay olish. Xat, maqola, suhbat va hisobot uchun turli so'zlar kerak.",
["Phrasal verb → bir so'z: find out → discover, put off → postpone, look into → investigate","Qisqartmalar → to'liq: don't → do not","Shaxsiy → shaxssiz: I think → It is believed","Oddiy bog'lovchi → rasmiy: so → therefore, also → moreover","Faol → majhul: We made a mistake → A mistake was made"],
["Norasmiy uslub xato emas — faqat o'z joyida.","Rasmiy xat: I am writing to …, I look forward to hearing from you.","Norasmiy: Hi, Just wanted to …, Cheers."],
[["Informal: Can you send me the info? → Formal: Could you please forward the details?","Ma'lumotni yubora olasizmi?"],["Informal: We need to put off the meeting. → Formal: The meeting will have to be postponed.","Yig'ilish keyinga qoldirilishi kerak."],["Informal: Sorry for the delay. → Formal: Please accept our apologies for the delay.","Kechikish uchun uzr."],["Informal: Thanks a lot! → Formal: I am most grateful for your assistance.","Yordamingiz uchun minnatdorman."],["Informal: Let me know. → Formal: I look forward to your response.","Javobingizni kutaman."]],
["Dear Sir, I wanna know about the job.","Dear Sir or Madam, I am writing to enquire about the position."],
[["Formal equivalent of «find out»:",["discover","get to know","figure"],0,"discover."],["Formal equivalent of «get»:",["take","obtain","grab"],1,"obtain."],["Which ends a formal letter?",["Cheers!","I look forward to hearing from you.","See ya!"],1,"Rasmiy yakun."]]);

["Ma'nosi so'zlardan kelib chiqmaydi — butun holda yodlang.","Ko'pchiligi vergul bilan ajratiladi.","Ortiqcha ishlatish sun'iy eshitiladi."],
[["The plan is risky. Be that as it may, we must try.","Reja xavfli. Shunday bo'lsa ham, urinib ko'rishimiz kerak."],["Come what may, I'll stand by you.","Nima bo'lsa bo'lsin, yoningda bo'laman."],["He is, so to speak, the brain of the team.","U, ta'bir joiz bo'lsa, jamoaning miyasi."],["The situation hasn't improved; if anything, it's got worse.","Vaziyat yaxshilanmadi; aksincha, yomonlashdi."],["The service was disappointing, to say the least.","Xizmat, yumshoq qilib aytganda, hafsalani pir qildi."]],

["How you dare to speak to me!","How dare you speak to me!"],

const SIMPLE={
alphabet:["Ingliz harflari — aktyorlarga o'xshaydi: bitta aktyor turli filmlarda turli rol o'ynaydi. «a» harfi cat da bir xil, car da boshqa, cake da yana boshqa o'qiladi.","So'zni ko'z bilan emas, quloq bilan yodla."],
tobe:["To be — ingliz gapining «yuragi». O'zbekchada -man, -san, -dir so'z oxiriga yopishadi, inglizchada esa alohida so'z bo'lib turadi: Men talaba-man → I am a student.","I — am, ko'plik — are, qolgan birlik — is."],
tobeq:["To be — lift kabi: so'roq qilsang, u yuqoriga, egadan oldinga chiqadi (Are you…?). Inkor qilsang, yoniga not ni chaqiradi (I am not).","So'roq — almashtir, inkor — not qo'sh."],
subjpron:["I, he, she — «kim?» savolining javobi, harakat egasi. My, his, her — narsaga yopishtirilgan «egasi» yorlig'i: my bag = mening sumkam.","Kim? — I/he/she. Kimning? — my/his/her."],
this:["Qo'lingiz yetadigan narsa — this/these, barmog'ingiz bilan uzoqni ko'rsatsangiz — that/those. Ko'plik bo'lsa so'z ham «semiradi»: this → these.","Yaqin — th-i-s, uzoq — th-a-t; ko'plikda e/o qo'shiladi."],
articles:["a/an — notanish odam bilan birinchi tanishuv: «bir yigit keldi». the — u bilan tanishib bo'ldingiz: «o'sha yigit». Birinchi uchrashuvda a, keyingisida the.","Birinchi marta — a, ikkinchi marta — the."],
plurals:["Ko'plik -s — ko'p narsalarni bog'laydigan arqon. Ba'zi so'zlar (man → men, child → children) arqonga sig'maydi va o'z shaklini o'zgartiradi — ularni alohida yodlang.","Sondan keyin ham -s: three book-s."],
possessive:["'s — kichik «egalik muhri». Alining mashinasi = Ali's car: muhrni egasiga bosasiz, narsani esa orqasiga qo'yasiz.","Ega + 's + narsa."],
havegot:["Have — inglizcha «cho'ntak»: nima bor bo'lsa, shu cho'ntakda. O'zbekcha «Mening mashinam bor» inglizchada «Men mashinaga egaman» bo'ladi: I have a car.","Mening … bor = I have …; he/she — has."],
thereis:["There is — qorovulning hisoboti: «Xonada stol bor». Narsa hech kimga tegishli emas, shunchaki o'sha joyda turibdi.","Joyda bor — there is/are; odamda bor — have."],
presimple:["Present Simple — kundalik «jadval» yoki odatlar kitobi: har kuni, har doim, umuman. He/she/it ga kelganda fe'l «s» shapkasini kiyadi: he work-s.","He, she, it — fe'lga s qo'y."],
presimpleq:["do/does — yordamchi «yuk tashuvchi». Inkor va so'roqda u fe'lning -s yukini o'zi ko'tarib oladi, shuning uchun asosiy fe'l yengil qoladi: She doesn't work.","does ishlatding — fe'ldan s ni olib tashla."],
freq:["Takrorlanish ravishlari — termometr: always 100° dan never 0° gacha. Ular fe'lning oldida qo'riqchi bo'lib turadi, faqat to be dan keyin.","Fe'ldan oldin, to be dan keyin."],
wh:["Savol — poyezd: lokomotiv (Wh- so'z) oldinda, undan keyin darhol vagon (yordamchi fe'l), keyin yo'lovchi (ega) va yuk (asosiy fe'l).","Wh + yordamchi + ega + fe'l."],
can:["Can — «kuch tugmasi». Uni bossangiz, fe'l qanday bo'lsa shundayligicha ishlaydi: to ham, -s ham kerak emas.","can + toza fe'l."],
precont:["Present Continuous — «jonli efir»: kamera aynan hozir nimani ko'rsatyapti. -ing — harakat davom etayotganining belgisi.","Hozir = am/is/are + -ing."],
simplevscont:["Simple — fotoalbom (doimiy holat, odat), Continuous — videokamera (ayni damda yozilayotgan lahza). «Men o'qituvchiman» — albom; «Men hozir dars beryapman» — kamera.","Odat — Simple, hozir — Continuous."],
imperative:["Buyruq gap — navigator ovozi: «Chapga buriling!». Kimga aytilayotgani aniq, shuning uchun ega aytilmaydi.","Fe'l bilan boshla, inkorda — Don't."],
prepplace:["in — quti ichida, on — stol ustida (sirtida), at — xaritadagi nuqta. Joyni o'zgartirib ko'ring: kitob qutiDA — in, stol ustiDA — on, eshik oldiDA — at.","Ichida — in, ustida — on, nuqtada — at."],
preptime:["Vaqt piramidasi: eng uchida kichik vaqt (at 5 o'clock), o'rtada kun (on Monday), asosida katta davr (in June, in 2026).","Soat — at, kun — on, oy/yil — in."],
countable:["Olmani sanaysiz — bir, ikki, uch. Suvni sanay olmaysiz — faqat «bir stakan suv». Sanalmaydigan narsalarga a/an va -s yopishmaydi.","Sanab bo'lsa — many, sanab bo'lmasa — much."],
likeing:["Yoqtirgan ishingiz — sevimli mashg'ulot, mashg'ulot esa -ing bilan nomlanadi: swimming, reading. Shuning uchun like + -ing.","like/love/hate/enjoy + -ing."],
adjectives:["Sifat — ot uchun kiyim: u otdan oldin kiyiladi va hech qachon ko'plik bo'lmaydi. Ikkita qizil mashina — two red cars (reds emas).","Sifat — otdan oldin, -s siz."],
numbers:["Sana — navbat: birinchi, ikkinchi, uchinchi… Shuning uchun sanada tartib son: the fifth of May. Soatda «past» — o'tdi, «to» — qoldi.","Sana — tartib son; past — o'tdi, to — qoldi."],
waswere:["was/were — to be ning «kechagi» kiyimi. am va is ning o'tmishi — was, are niki — were.","am/is → was, are → were."],
pastsimple:["Past Simple — yopilgan kitob: voqea tugagan, sanasi aniq. Did esa kitobni «o'tmishga» bog'laydi, shuning uchun did dan keyin fe'l yana yangi holiga qaytadi.","did bo'lsa — fe'l V1."],
pastcont:["Past Continuous — kinodagi fon: «yomg'ir yog'ayotgan edi…». Past Simple esa to'satdan sodir bo'lgan voqea: «…va eshik taqilladi».","Uzoq fon — was/were + -ing, qisqa voqea — V2."],
goingto:["Going to — kundalikdagi reja: allaqachon yozib qo'ygansiz. Yoki osmondagi qora bulut: hammasi ko'rinib turibdi — yomg'ir yog'adi.","Reja va belgi — going to."],
will:["Will — shu lahzadagi qaror yoki va'da: «Telefon jiringlayapti — men olaman!». Hech narsa oldindan rejalashtirilmagan.","Hozir qaror qildim — will."],
compar:["Qiyosiy daraja — tarozining ikki pallasi. Qisqa so'zga -er dumini ulaysiz, uzun so'zga esa oldidan more qo'yasiz, chunki unga dum og'irlik qiladi.","Qisqa — -er, uzun — more; keyin than."],
superl:["Orttirma — sport musobaqasidagi oltin medal: faqat bitta g'olib, shuning uchun doim «the» bilan: the best, the tallest.","Eng … = the + -est / the most."],
asas:["as … as — muvozanatdagi tarozi (teng). too — idishdan toshgan suv (haddan ortiq). enough — to'la, lekin toshmagan idish (yetarli).","too — ortiqcha, enough — yetarli."],
adverbs:["Sifat — otning rasmi (tez mashina), ravish — harakatning rasmi (tez haydaydi). Ravish ko'pincha sifatga -ly dumini ulaydi: quick → quickly.","Qanday? — sifat + ly; good → well."],
objpron:["Me, him, her — harakat «tegadigan» odamlar: kim? emas, kimni?/kimga?. Mine, yours — «meniki, seniki» — otni takrorlamaslik uchun.","Fe'ldan keyin — me/him; yolg'iz — mine/yours."],
indef:["some/any/no/every — to'rtta kalit, body/thing/where esa eshiklar. Kalitni eshikka qo'shing: some + one = someone (kimdir), no + where = nowhere (hech qayerda).","Darak — some-, so'roq/inkor — any-, hech — no-."],
quant:["a few / a little — «oz, lekin yetarli» (yarim to'la stakan). few / little — «deyarli yo'q» (deyarli bo'sh stakan). Bitta a harfi optimizm qo'shadi!","a bilan — yetarli, a siz — juda kam."],
presperf:["Present Perfect — hayot tarjimai holi (rezyume): qachon bo'lgani emas, bo'lganmi-yo'qmi muhim. «Men Londonda bo'lganman» — sanani so'ramaydilar.","Tajriba, sana yo'q — have + V3."],
presperf2:["just/already/yet — hozirgi lahzaga qaragan uchta ko'rsatkich: just — hozirgina, already — allaqachon, yet — hali (kutyapmiz).","just va already — o'rtada, yet — oxirida."],
musthave:["must — o'zingizning ichki qoidangiz, have to — tashqi qoida (boshliq, qonun), should — do'stona maslahat. mustn't — qizil chiroq, don't have to — yashil chiroq: xohlasang qil.","mustn't — taqiq, don't have to — shart emas."],
gerund:["Ba'zi fe'llar -ing ni «yaxshi ko'radi» (enjoy, finish, mind), ba'zilari esa to ni (want, decide, hope). Kelajakka qaragan fe'llar ko'pincha to bilan: want to, plan to, hope to.","Kelajak niyati — to; jarayon/zavq — -ing."],
purpose:["to + fe'l — «nima uchun?» savoliga eng qisqa javob. Do'konga bordim — nima uchun? — non olish uchun: to buy bread.","Maqsad = to + V1 (for to emas)."],
cond0:["Zero — fizika qonuni (doim shunday): suvni qizdirsang — qaynaydi. First — ob-havo ma'lumoti: yomg'ir yog'sa — uyda qolamiz. If qismi hech qachon will olmaydi.","If tomonda will yo'q."],
both:["both — ikkala qo'l ham ko'tarildi. either — ikkitadan biri, qaysi biri farqi yo'q. neither — hech biri ko'tarilmadi (o'zi inkor, not kerak emas).","neither — inkor, ikkinchi not qo'yma."],
conj:["Bog'lovchilar — gaplar orasidagi ko'priklar: and — qo'shadi, but — qarshi qo'yadi, so — natijaga olib boradi, because — sababga qaytaradi.","Sabab → so → natija; natija → because → sabab."],
wouldlike:["want — bolaning «xohlayman!» degani, would like — kattalarning muloyim «xohlardim». Restoranda doim would like.","Do you like? — umuman; Would you like? — hozir."],
ppcont:["Present Perfect Continuous — sekundomer: qachon boshlangan va hozir ham ishlab turibdi. «Ikki soatdan beri kutyapman» — sekundomer hali to'xtamagan.","Qancha vaqtdan beri? — have been + -ing."],
pastperf:["Past Perfect — o'tmish ichidagi o'tmish, ya'ni «oldinroq» tugmasi. Ikkita o'tgan voqeadan qaysi biri birinchi bo'lsa — had + V3 o'shanga.","Ikkidan birinchisi — had + V3."],
usedto:["used to — eski fotosurat: «bolaligimda shunday edim», lekin endi emas. Hozirgi odat uchun ishlatilmaydi.","Ilgari edi, endi yo'q — used to."],
cond2:["Second Conditional — orzular olami: «Boy bo'lsam edi…». Shakl o'tmishda (had, were), lekin ma'no hozir — orzuni haqiqatdan bir qadam uzoqlashtirish uchun.","Xayol: If + V2, would + V1."],
passive:["Majhul nisbat — yangilik sarlavhasi: «Ko'prik qurildi». Kim qurgani qiziq emas, nima bo'lgani muhim. Zamonni be ko'taradi, asosiy fe'l doim V3.","be + V3."],
reported:["O'zlashtirma gap — xabarni boshqaga yetkazish. Gap aytilgan paytdan uzoqlashganingiz uchun zamon ham bir qadam orqaga ketadi: is → was, will → would.","Yetkazsang — bir zamon orqaga."],
reportedq:["Savolni yetkazganda u «savolligini yo'qotadi»: endi bu shunchaki xabar. Shuning uchun so'z tartibi darak gapdek: She asked where I lived.","Yetkazilgan savol — darak tartibda."],
relative:["Nisbiy gap — otga ilingan tushuntirish yorlig'i: «qo'shnimiz bo'lgan ayol». O'zbekchadagi -gan inglizchada who/which/that bilan ulanadi.","Odam — who, narsa — which, joy — where."],
nondefining:["Vergulli nisbiy gap — qavs ichidagi qo'shimcha ma'lumot: olib tashlasangiz ham gap tushunarli. Shuning uchun u vergullar «qavsi»ga olinadi va that olmaydi.","Vergul bor — that yo'q."],
deduction:["Modallar — detektiv ishonchi: must — 95% «shunday», might — 50% «balki», can't — 95% «bo'lishi mumkin emas». Faktlarga qarab xulosa chiqaramiz.","must — ishonaman, can't — ishonmayman."],
tags:["Tasdiq so'roq — gap oxiridagi «a?». U ko'zgu: gap ijobiy bo'lsa, ko'zguda inkor ko'rinadi va aksincha.","Ijobiy gap — inkor dum."],
sosuch:["so — sifatni kuchaytiradi (so tired), such — butun otni (such a nice day). so — sifatning do'sti, such — otning do'sti.","so + sifat, such (a) + ot."],
makelet:["make — majburlash, let — eshikni ochib qo'yish (ruxsat). Ikkalasi ham to ni yoqtirmaydi: make me cry, let me go.","make/let + V1 (to siz)."],
wish1:["wish — sehrli tayoqcha, lekin u faqat «hozirgi haqiqat» ni orzuga aylantiradi. Hozirni boshqacha istasangiz — o'tgan shakl: I wish I had…","Hozirni istasang — V2."],
phrasal:["Phrasal verb — LEGO: get + up = turmoq, get + on = til topishmoq. Bo'laklar bir xil, lekin har birikma yangi narsa yasaydi.","Butunligicha yodla, bo'laklab emas."],
indirectq:["Bilvosita savol — savolni muloyim «o'ramga» solish: Could you tell me… Savol o'ram ichida bo'lgani uchun u yana oddiy darak gapga aylanadi.","Could you tell me + darak tartib."],
causative:["have something done — xizmat buyurtmasi: sartaroshga borib soch oldirasiz. Ishni o'zingiz emas, boshqa odam qiladi.","O'zim — cut my hair; usta — have my hair cut."],
linking:["although va despite — bir xil ma'noli egizaklar, lekin turli ovqat yeydi: although gap yeydi, despite esa ot yoki -ing.","although + gap, despite + ot/-ing."],
articles2:["Umumiy narsa haqida gapirsangiz (hayot, musiqa, bolalar) — artikl yo'q. Aniq guruh haqida (shu filmdagi musiqa) — the. Daryo, dengiz, tog' tizmasi — doim the.","Umumiy — artiklsiz, aniq — the."],
reflexive:["myself — ko'zgu: harakat o'zingizga qaytadi (I cut myself). each other — ikki ko'zgu bir-biriga qaragan: biz bir-birimizni.","O'zimga — myself, bir-birimizga — each other."],
narrative:["Hikoya — kino: Past Continuous — dekoratsiya va fon, Past Simple — asosiy voqealar, Past Perfect — «flashback», ilgari bo'lgan voqeaga orqaga qaytish.","Fon — -ing, voqea — V2, flashback — had V3."],
pastperfcont:["Past Perfect Continuous — o'tmishdagi sekundomer: o'tmishdagi bir lahzagacha qancha vaqt ishlab turgan edi.","O'tmish nuqtasigacha qancha vaqt — had been + -ing."],
futperf:["Future Continuous — kelajakdagi fotosurat: ertaga soat 9 da qayerdasiz? Future Perfect — muddat chizig'i: dushanbagacha ish tugagan bo'ladi.","Shu paytda — will be -ing; shu paytgacha — will have V3."],
cond3:["Third Conditional — vaqt mashinasi: o'tmishga qaytib, boshqacha qilganingizni tasavvur qilasiz. Afsus va xulosa uchun.","If had V3, would have V3."],
mixedcond:["Aralash shart — ikkita qavat: sabab bir zamonda, natija boshqa zamonda. O'tmishdagi tanlov → bugungi hayot.","Har qism o'z vaqtiga qarab."],
wish2:["wish + had V3 — o'tmish uchun afsus («qani endi…»). wish + would — boshqa odamga «o'zgarsang edi» degan norozilik.","O'tmish afsusi — had V3, norozilik — would."],
pastmodals:["Modal + have + V3 — o'tmishga qarab tuzilgan xulosa yoki afsus. must have — aniq bo'lgan, should have — qilish kerak edi.","O'tmish haqida modal — + have + V3."],
passive2:["Majhul nisbat — har qanday zamonga mos keladigan «qolip»: zamonni be ko'taradi, asosiy fe'l doim V3 bo'lib qoladi.","be (istalgan zamon) + V3."],
passivereport:["It is said that… — yangiliklar diktorining ovozi: «aytishlaricha». Kim aytgani noma'lum yoki muhim emas.","He is said to + V1 / to have V3."],
reportingverbs:["say/tell — oddiy qalam, admit/deny/refuse/warn — rangli qalamlar: har biri gapning ohangini ham yetkazadi.","Har fe'lning o'z «quyrug'i»: to / -ing / sb to."],
relative2:["Rasmiy nutqda predlog «uyidan chiqib» olmosh oldiga o'tadi: the man to whom I spoke. Miqdor so'zlari esa whom/which bilan birlashadi: all of whom.","Predlogdan keyin — whom/which."],
participle:["Sifatdosh oborot — gapni siqib qisqartirish: ikki gapni bittaga «presslash». -ing — faol, V3 — majhul, Having V3 — oldinroq.","Ega ikkala qismda bir bo'lsin."],
gerundmeaning:["remember/stop/try — ikki yuzli fe'llar: -ing — orqaga (o'tmishga) qaraydi, to — oldinga (kelajakka) qaraydi.","-ing — o'tmish, to — kelajak."],
quantifiers2:["every — butun guruhga bir nazar, each — har birini alohida-alohida ko'rish. whole — butunligicha (the whole day), none — birorta ham.","every/each + birlik."],
unreal:["It's time / would rather — vaqt allaqachon yetib kelgan, lekin ish hali bajarilmagan. O'tgan shakl shu «kechikish» hissini beradi.","It's time we + V2."],
soneither:["So do I — «men ham» ning inglizcha aks-sadosi. Darakka — so, inkorga — neither. Yordamchi fe'l gapdagini takrorlaydi.","So/Neither + yordamchi + I."],
compadv:["The more…, the more… — arg'imchoq: biri ko'tarilsa, ikkinchisi ham ko'tariladi. Ko'proq o'qisang — ko'proq bilasan.","The + qiyos…, the + qiyos…"],
inversion:["Inversiya — sahnaga dramatik kirish: inkor so'z oldinga chiqib, gapni «so'roq kiyimiga» kiyintiradi. Never have I seen… — juda ta'sirli eshitiladi.","Inkor so'z oldinda — so'roq tartibi."],
cleft:["Cleft — gapga spotlight (projektor) tushirish: It was ALI who… — aynan Ali, boshqa hech kim emas.","It was X that…; What I need is X."],
advcond:["If o'rniga boshqa kalitlar: provided — shartnoma shartidek, unless — «agar … bo'lmasa», Had I known — rasmiy if ning qisqa varianti.","Had/Should/Were + ega = if."],
subjunctive:["Subyunktiv — rasmiy talab yoki tavsiya: «U kelishi shart». Bu talab hali bajarilmagan, shuning uchun fe'l «xom» holatda qoladi: that he be, that she go.","suggest/insist that + ega + V1 (-s siz)."],
futureinpast:["O'tmishdan turib kelajakka qarash — eski kundalikni o'qiyotgandek: «Men unga qo'ng'iroq qilmoqchi edim…». will → would, going to → was going to.","O'tmishdagi reja — was going to."],
emphasis:["do/did darak gapda — ovozni ko'tarish tugmasi: I DID call you! — «albatta qo'ng'iroq qildim!».","Kuchli tasdiq — do/does/did + V1."],
ellipsis:["Ellipsis — takrorni olib tashlash: tabiiy nutqda bir so'zni ikki marta aytmaymiz. I think so. I'd love to. Have you got a bigger one?","Takrorlama — so/one/to/yordamchi bilan almashtir."],
nominal:["Otlashtirish — harakatni «muzlatish»: decide → decision. Akademik matnda harakatlar narsaga aylanadi, matn rasmiy va ixcham bo'ladi.","Fe'l → ot (-tion, -ment, -ity)."],
hedging:["Hedging — ehtiyot kamari: fikrni haddan tashqari qat'iy aytib, yiqilib tushmaslik uchun. All → most, always → tend to.","Qat'iy emas — tend to, seem, may."],
modalperf:["needn't have — keraksiz ish qildingiz (soyabon oldingiz, yomg'ir yog'madi). didn't need to — kerak emas edi (va ehtimol qilmadingiz).","needn't have V3 — qildim, befoyda."],
fronting:["Fronting — gapning bir qismini sahnaning old qatoriga chiqarish, unga diqqatni tortish: Tired as she was, …","Muhim qismni boshga chiqar."],
compadj:["Qo'shma sifat — bir nechta so'zni defis bilan bitta «vagon»ga ulash: a five-star hotel. Vagon ichida son bo'lsa ham ot birlikda qoladi.","Son + ot (birlik) + defis."],
inversion2:["Little did I know — eng zo'r hikoya boshlanishi: «Hayolimga ham kelmagan edi…». Such was … — natijaning kattaligini ko'rsatish.","Little did + ega + V1."],
whatever:["whatever/however — «nima bo'lsa ham» kaliti: shart qanday bo'lmasin, natija o'zgarmaydi.","However + sifat; No matter + wh-."],
absolute:["Mustaqil oborot — gapga qo'shimcha «ilova»: o'z egasiga ega kichik gapcha. Weather permitting — ob-havo yo'l qo'ysa.","Ot + -ing/V3, asosiy gap."],
distancing:["O'tgan zamon — muloyimlikning «yumshoq qo'lqopi». I was wondering… — bu vaqt haqida emas, iltimosni yumshatish uchun.","Muloyim iltimos — was wondering / wanted to."],
genericref:["Butun tur haqida gapirishning uch usuli: ensiklopediya (The tiger…), ta'rif (A tiger is…), oddiy suhbat (Tigers are…).","Umumiy — ko'plik artiklsiz."],
register:["Uslub — kiyim kabi: to'yga kostyum, uyda futbolka. Rasmiy xatda obtain, do'st bilan get.","Rasmiy — bir so'zli fe'l, norasmiy — phrasal verb."],
fixedstruct:["Qotib qolgan iboralar — tayyor «g'ishtlar»: ularni bo'laklamay, butunligicha ishlating. Be that as it may — shunday bo'lsa ham.","Ma'nosini butunligicha yodla."],
cohesion:["Matn bog'liqligi — gaplar orasidagi ko'zga ko'rinmas iplar: the former/the latter, such, this + ot. Iplar qanchalik nozik bo'lsa, matn shunchalik silliq.","It o'rniga — this + umumlashtiruvchi ot."],
modalnuance:["will/would — xarakterning «odati»: He'll sit there for hours. shall — huquqiy matnning qat'iy «shart»i. dare va need — modal sifatida inkorda.","Xarakterli odat — will/would."]
};

TA("adverbs","A2","edingadj","-ed vs -ing adjectives","bored yoki boring?",
"-ed — odam nimani HIS QILADI (I'm bored). -ing — narsa qanday TA'SIR QILADI (The film is boring).",
"Bu juftliklar o'zbek tilida so'zlashuvchilar eng ko'p adashtiradigan so'zlar. «Men zerikdim» deyish o'rniga «I am boring» desangiz, «Men zerikarli odamman» degan bo'lasiz.",
["Odam + be + V-ed: I am bored / tired / interested","Narsa + be + V-ing: The film is boring / tiring / interesting","Juftliklar: bored–boring · interested–interesting · tired–tiring · excited–exciting · surprised–surprising · confused–confusing"],
["-ed — ichki his (kim his qilyapti?).","-ing — sabab (nima bu hisni keltiryapti?).","Odam ham -ing bo'lishi mumkin: He is boring (u zerikarli odam)."],
[["I'm bored. Let's go out.","Zerikdim. Keling, tashqariga chiqaylik."],["This lesson is really interesting.","Bu dars juda qiziqarli."],["She was surprised by the news.","U yangilikdan hayron bo'ldi."],["The journey was long and tiring.","Safar uzoq va charchatuvchi edi."],["I'm confused. Can you explain again?","Chalkashib ketdim. Yana tushuntira olasizmi?"]],
["I am very interesting in music.","I am very interested in music."],
[["The match was very ___ .",["excited","exciting","excite"],1,"Narsa ta'siri — -ing."],["I'm ___ — I worked all day.",["tired","tiring","tire"],0,"Odam his qiladi — -ed."],["His story was ___ .",["amazed","amazing","amaze"],1,"Hikoya — ta'sir qiluvchi, -ing."]]);

TA("objpron","A2","subjq","Subject & object questions","Ega va to'ldiruvchi so'roqlari",

["Ega so'rog'i: Who/What + V (do yo'q): Who lives here?","To'ldiruvchi so'rog'i: Who/What + do/does/did + S + V1: What did you buy?","Taqqoslang: Who loves Ali? (kim yaxshi ko'radi) ↔ Who does Ali love? (Ali kimni yaxshi ko'radi)"],
["Ega so'rog'ida fe'l -s olishi mumkin: Who wants tea?","O'tgan zamonda: Who called? (did yo'q).","What happened? — eng ko'p ishlatiladigan ega so'rog'i."],
[["Who broke the window?","Derazani kim sindirdi?"],["What did you eat for lunch?","Tushlikka nima yeding?"],["What happened yesterday?","Kecha nima bo'ldi?"],["Who did you call?","Kimga qo'ng'iroq qilding?"],["Which team won the match?","O'yinda qaysi jamoa yutdi?"]],
["Who did call you?","Who called you?"],
[["Who ___ the cake?",["did eat","ate","does ate"],1,"Ega so'rog'i — did yo'q."],["What ___ you do last night?",["did","—","was"],0,"To'ldiruvchi so'rog'i — did."],["What ___ ?",["did happen","happened","happen"],1,"Ega so'rog'i."]]);

["He went in the shop.","He went into the shop."],
[["The dog ran ___ the road.",["across","on","at"],0,"Yo'lni kesib o'tdi."],["She took the keys ___ her bag.",["out of","into","through"],0,"Ichidan chiqardi."],["We walked ___ the forest.",["through","across","onto"],0,"O'rmon ichidan."]]);

"Ikkalasi ham o'zbekchaga «qilmoq» deb tarjima qilinadi, shuning uchun adashtirish oson. Ko'p birikmalarni shunchaki yodlash kerak.",
["make + natija/yaratish: make a cake, make money, make a decision, make a mistake, make noise, make friends","do + ish/vazifa: do homework, do the shopping, do exercise, do your best, do business, do a favour","Umumiy ish: What do you do? / Do something!"],

TA("gerund","A2","ableto","Ability: can / could / be able to","Qobiliyat: be able to",

"can faqat hozirgi va could o'tgan zamonda ishlaydi. Kelajak yoki Present Perfect kerak bo'lsa, be able to ishlatiladi. Bir martalik muvaffaqiyat uchun was able to / managed to.",
["Hozir: S + can + V1","O'tmish (umumiy): S + could + V1","Kelajak: S + will be able to + V1","Perfect: S + have/has been able to + V1","Bir marta uddaladi: S + was/were able to / managed to + V1"],

[["I can swim, but I can't dive.","Suza olaman, lekin sho'ng'iy olmayman."],["When I was six, I could read.","Olti yoshimda o'qiy olardim."],["You'll be able to speak English soon.","Tez orada inglizcha gapira olasiz."],["I haven't been able to sleep well recently.","So'nggi paytlarda yaxshi uxlay olmayapman."],["After hours of searching, we managed to find the key.","Soatlab qidirgach, kalitni topishga muvaffaq bo'ldik."]],
