<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ingliz tili A1–C2: 103 grammatika mavzusi, 5000+ so'z rasmlar bilan, frazalar va mashqlar">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Inglizcha Ustoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: soft clay surface; sidebar on desktop, bottom tab bar on phones; content in raised neumorphic panels */
:root{
  --bg:#E6EBF2; --hi:#FFFFFF; --lo:#C1C9D7; --fg:#273044; --muted:#626D84; --line:#D3DAE5;
  --accent:#4660DC; --accent-2:#6E7FF0; --accent-soft:#D9DFFA; --on-accent:#FFFFFF;
  --ok:#17946A; --ok-soft:#D3EFE3; --bad:#CC4339; --bad-soft:#F6DCD9; --gold:#B7800C;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-lg:26px; --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#242932; --hi:#2E343F; --lo:#181C22; --fg:#E3E8F1; --muted:#9BA5B7; --line:#353C48;
  --accent:#8B9CFF; --accent-2:#A9B6FF; --accent-soft:#30385A; --on-accent:#141A33;
  --ok:#4DCB9B; --ok-soft:#1F3A31; --bad:#FF7F74; --bad-soft:#47282A; --gold:#E3B34A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#242932; --hi:#2E343F; --lo:#181C22; --fg:#E3E8F1; --muted:#9BA5B7; --line:#353C48;
  --accent:#8B9CFF; --accent-2:#A9B6FF; --accent-soft:#30385A; --on-accent:#141A33;
  --ok:#4DCB9B; --ok-soft:#1F3A31; --bad:#FF7F74; --bad-soft:#47282A; --gold:#E3B34A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(22px,3.4vw,30px)}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* neumorphic primitives */
.neu{background:var(--bg);border-radius:var(--r-lg);box-shadow:9px 9px 20px var(--lo),-9px -9px 20px var(--hi)}
.neu-sm{background:var(--bg);border-radius:var(--r);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi)}
.ins{background:var(--bg);border-radius:var(--r);box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;background:var(--bg);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);transition:box-shadow .15s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active,.btn.on{box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);transform:none}
.btn.primary{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:5px 5px 14px var(--lo),-5px -5px 12px var(--hi)}
.btn.primary:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.25)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.ibtn{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);color:var(--accent);flex:none}
.ibtn:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.ibtn svg.i{width:18px;height:18px}

/* app frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:28px 18px 28px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--accent);font-size:17px}
.brand b{font-family:var(--display);font-size:15px;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:12px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;font-weight:700;color:var(--muted);transition:color .15s}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--accent);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.side-foot{margin-top:auto;padding:16px;font-size:13px;color:var(--muted)}
.side-foot b{color:var(--fg);font-variant-numeric:tabular-nums}
main{min-width:0;padding-block:30px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:20px 120px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;gap:4px;background:var(--bg);
    padding:10px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    box-shadow:0 -6px 18px var(--lo)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:7px 8px;border-radius:13px;flex:1;min-width:0}
  .bnav button.on{color:var(--accent);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
}

/* shared bits */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 9px;border-radius:999px;font-family:var(--mono);font-size:11.5px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pad{padding:22px}
.bar{height:10px;border-radius:99px;overflow:hidden;background:var(--bg);box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:8px 15px;border-radius:999px;font-weight:700;font-size:13px;background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);color:var(--muted)}
.chip.on{color:var(--accent);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* home */
.hero{padding:28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr);padding:22px}}
.hero p{color:var(--muted);margin-top:8px;max-width:46ch}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.wotd{padding:22px;text-align:center}
.wotd .w{font-family:var(--display);font-size:clamp(24px,4vw,32px);color:var(--accent);margin:8px 0 4px;word-break:break-word}
.stat{padding:18px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700}
.stat .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--accent)}
.path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.step small{font-size:11.5px;line-height:1.35;font-variant-numeric:tabular-nums}
@media (max-width:600px){.path{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.ring{--p:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500}
.mode{padding:18px;display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.mode .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--accent)}
.mode b{display:block;font-size:15px}
.mode small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:2px}
.mode:active{box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}

/* grammar */
.tcard{padding:18px 20px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tcard b{font-size:15.5px;line-height:1.3}
.tcard small{color:var(--muted);font-size:13px}
.done{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.done.y{background:var(--ok);color:var(--bg)}
.done.y svg.i{width:14px;height:14px;stroke-width:3}
.done.n{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
.lesson{padding:28px;display:flex;flex-direction:column;gap:24px}
@media (max-width:600px){.lesson{padding:20px}}
.lesson .lead{font-size:16px;max-width:68ch}
.formula{padding:18px 20px;display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:13.5px;overflow-x:auto}
.formula div{white-space:nowrap}
.formula div::before{content:"›";color:var(--accent);margin-right:10px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:12px;max-width:72ch}
.rules li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.ex{display:flex;flex-direction:column;gap:14px}
.exrow{display:flex;gap:14px;align-items:center;padding:14px 16px}
.exrow .t{min-width:0;flex:1}
.exrow .en{font-weight:700;font-size:15.5px}
.exrow .uz{color:var(--muted);font-size:14px}
.mist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:600px){.mist{grid-template-columns:minmax(0,1fr)}}
.mist div{padding:14px 16px;border-radius:var(--r);font-weight:600}
.mist .w{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.mist .r{background:var(--ok-soft);color:var(--ok)}
.mist small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;text-decoration:none;margin-bottom:4px;opacity:.85}
.quiz{display:flex;flex-direction:column;gap:22px}
.qq{display:flex;flex-direction:column;gap:12px}
.qq .s{font-weight:700;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{padding:11px 18px;border-radius:14px;font-weight:700;background:var(--bg);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi);min-width:84px;transition:transform .12s}
.opt:hover:not([disabled]){transform:translateY(-1px)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok);color:var(--bg);box-shadow:none}
.opt.wrong{background:var(--bad);color:var(--bg);box-shadow:none}
.note{font-size:14px;padding:12px 14px;border-radius:var(--r-sm);max-width:72ch}
.note.y{background:var(--ok-soft);color:var(--ok)}
.note.n{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.m{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* words */
.search{display:flex;align-items:center;gap:10px;padding:4px 16px}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font:inherit;font-size:15px;color:var(--fg)}
.search input:focus{outline:none}
.search:focus-within{box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi),0 0 0 2px var(--accent)}
.ccard{padding:18px;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px}
.ccard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard b{font-size:15px}
.ccard small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-direction:column}
.wrow{display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .t{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:520px){.wrow .t{grid-template-columns:minmax(0,1fr)}}
.wrow .en{font-weight:700}
.wrow .uz{color:var(--muted)}
.tog{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);color:var(--muted)}
.tog svg.i{width:15px;height:15px;stroke-width:3}
.tog.y{background:var(--ok);color:var(--bg);box-shadow:none}
.flash{perspective:1200px;max-width:520px;width:100%;margin:0 auto}
.fcard{position:relative;height:280px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--display);font-size:clamp(24px,6vw,36px);word-break:break-word}
.face.back .big{color:var(--accent)}
.fbtns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}*{scroll-behavior:auto}}

/* phrases */
.sect{padding:22px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .t{flex:1;min-width:0}
.prow .en{font-weight:700}
.prow .uz{color:var(--muted);font-size:14px}
.prow .ex{font-style:italic;font-size:13.5px;color:var(--muted)}

/* practice session */
.sess{max-width:640px;width:100%;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:22px}
@media (max-width:600px){.sess{padding:20px}}
.sess .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.prompt .big{font-family:var(--display);font-size:clamp(20px,5vw,30px);word-break:break-word;line-height:1.3}
.prompt .hint{font-size:13px;color:var(--muted);font-weight:700}
.mopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:480px){.mopts{grid-template-columns:minmax(0,1fr)}}
.mopts .opt{width:100%;padding:15px 14px;text-align:center}
.tin{display:flex;gap:12px;flex-wrap:wrap}
.tin .ins{flex:1;min-width:0;display:flex}
.tin input{flex:1;min-width:0;border:0;background:none;padding:14px 16px;font:inherit;font-size:17px;font-weight:700;color:var(--fg)}
.tin input:focus{outline:none}
.slots{min-height:64px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tok{padding:9px 13px;border-radius:12px;font-weight:700;background:var(--bg);box-shadow:3px 3px 8px var(--lo),-3px -3px 8px var(--hi)}
.tok.used{opacity:.25;pointer-events:none}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.result .score{font-family:var(--display);font-size:46px;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(28px + env(safe-area-inset-bottom,0px));padding:12px 18px;border-radius:14px;font-weight:700;background:var(--fg);color:var(--bg);opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
/* pictures */
.pic{display:grid;place-items:center;flex:none;overflow:hidden;background:var(--bg);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);line-height:1}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.sm{width:48px;height:48px;border-radius:14px;font-size:26px}
.pic.md{width:92px;height:92px;border-radius:24px;font-size:52px}
.pic.lg{width:150px;height:150px;border-radius:34px;font-size:84px;box-shadow:inset 6px 6px 13px var(--lo),inset -6px -6px 13px var(--hi)}
.pic.lg img,.pic.md img{border-radius:inherit}
.pic.let{font-family:var(--display);color:var(--accent);font-size:20px}
.pic.md.let{font-size:34px}.pic.lg.let{font-size:56px}
.pic.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.cover{display:flex;gap:8px}
.cover .pic.sm{width:42px;height:42px;font-size:22px;border-radius:12px}
.fcard{height:360px}
.face{gap:14px}
@media (max-width:480px){.pic.lg{width:120px;height:120px;font-size:66px}.fcard{height:330px}}
/* levels & lessons */
.tnum{font-variant-numeric:tabular-nums}
.lvl.big{min-width:52px;height:52px;border-radius:16px;font-size:17px;font-weight:700}
.lvl.sm{min-width:0;padding:1px 6px;font-size:10.5px;vertical-align:2px}
.lvlsec{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.lvlhead{display:flex;align-items:center;gap:16px}
.lvlhead .grow{flex:1;min-width:0}
.lvlhead p{font-size:13.5px}
.num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.keyidea{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;max-width:72ch}
.keyidea p{font-weight:700;font-size:16px;margin-top:4px}
.kicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--on-accent);background:linear-gradient(145deg,var(--accent-2),var(--accent))}
.blk{display:flex;flex-direction:column;gap:12px}
.lvltabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:560px){.lvltabs{grid-template-columns:repeat(3,minmax(0,1fr))}}

.opts.col{flex-direction:column;align-items:stretch}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}

T("A1","tobe","To be: am / is / are","«Bo'lmoq» fe'li",

[["I am a teacher at a school.","Men maktabda o'qituvchiman."],["She is tired today.","U bugun charchagan."],["We are from Uzbekistan.","Biz O'zbekistondanmiz."],["My brother is 15 years old.","Ukam 15 yoshda."],["It is cold outside.","Tashqarida sovuq."]],

[["I'm not hungry, thanks.","Men och emasman, rahmat."],["Are you a student? — Yes, I am.","Talabamisiz? — Ha."],["Is he your brother? — No, he isn't.","U akangmi? — Yo'q."],["They aren't at school today.","Ular bugun maktabda emas."],["Where are my keys?","Kalitlarim qayerda?"]],

["he — erkak, she — ayol, it — narsa yoki hayvon.","its (egalik) ≠ it's (it is).","his / her — egasining jinsiga qarab tanlanadi: Ali and his sister; Madina and her brother."],

"Bu ingliz tilining eng muhim qoidalaridan biri. Yordamchi fe'l (do, does) zamon va shaxsni o'ziga oladi, shuning uchun asosiy fe'l doim oddiy shaklda qoladi.",
["Inkor: I/you/we/they + don't + V1","Inkor: He/she/it + doesn't + V1","So'roq: Do / Does + ega + V1 …?","Qisqa javob: Yes, I do. / No, she doesn't."],
["She doesn't work (doesn't works emas).","Wh- so'roq: Where do you live? What does he do?","To be bilan do ishlatilmaydi: Are you happy? (Do you are emas)."],
[["He doesn't eat meat.","U go'sht yemaydi."],["Do you speak English? — Yes, I do.","Inglizcha gapirasizmi? — Ha."],["What time does the train leave?","Poyezd soat nechada jo'naydi?"],["We don't watch TV in the morning.","Biz ertalab televizor ko'rmaymiz."],["Where does your brother work?","Akang qayerda ishlaydi?"]],
["She don't like coffee.","She doesn't like coffee."],
[["___ they live near here?",["Does","Do","Are"],1,"They — Do."],["She doesn't ___ English.",["speaks","speak","speaking"],1,"doesn't dan keyin V1."],["What ___ your father do?",["do","does","is"],1,"your father = he → does."]]);

"Harakat qanchalik tez-tez bo'lishini ko'rsatadi. O'zbekchada joyi erkin, ingliz tilida esa aniq qoidasi bor.",
["always 100% · usually 90% · often 70% · sometimes 50% · rarely 10% · never 0%","Ega + ravish + fe'l: I usually walk.","Ega + to be + ravish: She is always late."],
["never — o'zi inkor: I never eat meat (don't never emas).","Ifodalar gap oxirida: every day, twice a week.","So'roq: How often do you …?"],
[["I always brush my teeth before bed.","Uxlashdan oldin doim tishimni yuvaman."],["He is never late for work.","U ishga hech qachon kechikmaydi."],["We sometimes go to the mountains.","Biz ba'zan tog'ga boramiz."],["She rarely eats fast food.","U kamdan-kam fast-fud yeydi."],["How often do you visit your grandparents?","Buvi-bobongnikiga qanchalik tez-tez borasan?"]],
["I go always to school by bus.","I always go to school by bus."],
[["She ___ coffee in the evening.",["drinks never","never drinks","never drink"],1,"Ravish fe'ldan oldin, she bilan -s."],["They ___ happy.",["are usually","usually are","usually is"],0,"to be dan keyin."],["How ___ do you go swimming?",["much","often","many"],1,"How often — qanchalik tez-tez."]]);

T("A1","wh","Question words","So'roq so'zlari",
"Tartib: So'roq so'zi + yordamchi fe'l + ega + asosiy fe'l.",
"So'roq so'zlari gap boshida keladi. Undan keyin darhol yordamchi fe'l (do, does, is, are, can) turadi.",
["What — nima · Who — kim · Where — qayerda","When — qachon · Why — nega · How — qanday","Which — qaysi · Whose — kimning","How much (sanalmaydigan) · How many (sanaladigan) · How old · How long"],
["Where do you live? (Where you live? emas)","Ega haqida so'ralsa do kerak emas: Who lives here?","Why? ga javob — Because …"],
[["Where do you work?","Qayerda ishlaysiz?"],["Why are you late?","Nega kechikding?"],["How many languages do you speak?","Nechta tilda gaplashasiz?"],["Which bus goes to the centre?","Qaysi avtobus markazga boradi?"],["Who wrote this book?","Bu kitobni kim yozgan?"]],
["What you are doing?","What are you doing?"],

T("A1","can","Can / can't","Qila olmoq",
"can + fe'l — qobiliyat, ruxsat, iltimos. Hamma shaxsda bir xil, -s va to olmaydi.",
"Can — modal fe'l. U «qila olaman», «mumkinmi?» ma'nosini beradi. Modal fe'llardan keyin fe'l doim oddiy shaklda keladi.",
["Ega + can + V1","Inkor: can't (cannot)","So'roq: Can + ega + V1 …?","O'tgan: could / couldn't"],
["She can swim (cans emas, can to swim emas).","Muloyim iltimos: Could you help me?","Ruxsat so'rash: Can I come in?"],
[["I can speak three languages.","Men uch tilda gapira olaman."],["She can't drive a car.","U mashina hayday olmaydi."],["Can I open the window?","Derazani ochsam bo'ladimi?"],["Could you help me with this bag?","Sumkaga yordam bera olasizmi?"],["When I was five, I could read.","Besh yoshimda o'qiy olardim."]],
["He can to play the piano.","He can play the piano."],
[["My grandfather ___ use a smartphone.",["can't","don't can","not can"],0,"Inkor: can't."],["___ you swim?",["Do","Can","Are"],1,"Qobiliyat so'rog'i."],["She can ___ very well.",["sings","to sing","sing"],2,"can + V1."]]);

T("A1","precont","Present Continuous","Hozirgi davomli zamon",
"Ayni paytda bo'layotgan ish: am/is/are + fe'l-ing. O'zbekchadagi «-yapman».",
"Gapirayotgan paytda davom etayotgan harakat yoki vaqtinchalik holat uchun ishlatiladi.",
["am / is / are + V-ing","Inkor: am not / isn't / aren't + V-ing","So'roq: Am / Is / Are + ega + V-ing …?"],
["Signal so'zlar: now, right now, at the moment, Look!, Listen!","Imlo: write → writing, swim → swimming, lie → lying.","Holat fe'llari -ing olmaydi: know, like, want, need, understand."],
[["I am reading a book right now.","Men hozir kitob o'qiyapman."],["Look! It's raining.","Qara! Yomg'ir yog'yapti."],["She is staying with her aunt this week.","U bu hafta xolasinikida turibdi."],["What are you doing?","Nima qilyapsan?"],["The children aren't sleeping.","Bolalar uxlamayapti."]],
["I am wanting a coffee.","I want a coffee."],
[["Be quiet! The baby ___ .",["sleeps","is sleeping","sleep"],1,"Ayni paytdagi harakat."],["They ___ football at the moment.",["are playing","play","plays"],0,"at the moment — davomli."],["I ___ the answer.",["am knowing","know","knowing"],1,"know — holat fe'li."]]);

T("A1","simplevscont","Present Simple vs Continuous","Oddiy va davomli zamon farqi",
"Simple — odat (har doim). Continuous — hozir (ayni damda).",
"Ikkala zamon ham «hozirgi», lekin farqi katta. «Men ishlayman» (umuman, kasbim) = I work. «Men ishlayapman» (hozir) = I am working.",
["Odat, fakt → Present Simple: I drink coffee every day.","Hozirgi harakat → Present Continuous: I'm drinking coffee now.","Doimiy → Simple: I live in Andijan. Vaqtinchalik → Continuous: I'm living with my uncle this month."],
["every day, usually → Simple; now, today, this week → Continuous.","Holat fe'llari (know, love, want) — faqat Simple.","Savol: What do you do? (kasb) — What are you doing? (hozir)"],
[["I usually walk to work, but today I'm taking a taxi.","Odatda ishga piyoda boraman, bugun esa taksida ketyapman."],["What do you do? — I'm a nurse.","Kasbingiz nima? — Hamshiraman."],["What are you doing? — I'm cooking.","Nima qilyapsan? — Ovqat pishiryapman."],["He plays football every Sunday.","U har yakshanba futbol o'ynaydi."],["It's snowing now, but it rarely snows here.","Hozir qor yog'yapti, lekin bu yerda kam yog'adi."]],
["I am going to school every day.","I go to school every day."],
[["She ___ in a bank. She's a manager.",["works","is working","work"],0,"Kasb — doimiy."],["Shh! I ___ to the radio.",["listen","am listening","listens"],1,"Ayni payt."],["Water ___ at 0°C.",["freezes","is freezing","freeze"],0,"Doimiy fakt."]]);

T("A1","imperative","Imperatives & Let's","Buyruq gaplar",
"Buyruq gap fe'l bilan boshlanadi; inkor — Don't; taklif — Let's.",
"Ko'rsatma, maslahat, iltimos va taklif uchun. Ega (you) aytilmaydi.",
["V1 …: Open the door.","Don't + V1: Don't touch it.","Let's + V1: Let's go."],
["please — muloyimroq: Please sit down.","Retsept va yo'l ko'rsatishda juda ko'p.","Let's not … — keling, … qilmaylik."],
[["Turn left at the traffic lights.","Svetofordan chapga buriling."],["Don't forget your passport.","Pasportingni unutma."],["Let's have lunch together.","Keling, birga tushlik qilamiz."],["Please wait here.","Iltimos, shu yerda kuting."],["Add salt and mix well.","Tuz qo'shing va yaxshilab aralashtiring."]],
["You no smoke here.","Don't smoke here."],
[["___ late again!",["Not be","Don't be","No be"],1,"Don't + V1."],["___ go to the cinema tonight.",["Let's","Lets","Let us to"],0,"Let's + V1."],["___ the window, please.",["Closing","Close","To close"],1,"V1 bilan boshlanadi."]]);

T("A1","prepplace","Prepositions of place","Joy predloglari",
"in — ichida, on — ustida (sirtda), at — aniq nuqtada.",
"O'zbekchada joy -da qo'shimchasi bilan beriladi. Inglizchada qaysi predlog kerakligi joyning turiga bog'liq.",
["in — ichida: in the box, in Tashkent, in the car","on — sirtida: on the table, on the wall, on the bus","at — nuqtada: at the door, at school, at home","under · next to · between · behind · in front of · opposite · above"],
["Mamlakat, shahar → in. Ko'cha → on. Aniq manzil → at.","at home, at work, at school, at university.","in the car, lekin on the bus / on the train / on the plane."],
[["The keys are on the table.","Kalitlar stol ustida."],["My cat is hiding under the bed.","Mushugim karavot ostida yashiringan."],["The bank is between the cafe and the pharmacy.","Bank kafe va dorixona orasida."],["I'll wait for you in front of the cinema.","Seni kinoteatr oldida kutaman."],["She lives in Andijan.","U Andijonda yashaydi."]],
["I am in home.","I am at home."],
[["The picture is ___ the wall.",["in","on","at"],1,"Devor sirti — on."],["We met ___ the bus stop.",["at","in","on"],0,"Aniq nuqta — at."],["My parents live ___ Samarkand.",["at","on","in"],2,"Shahar — in."]]);

T("A1","preptime","Prepositions of time","Vaqt predloglari",
"at — soat, on — kun, in — oy/yil/fasl. Kichikdan kattaga: at → on → in.",
"Vaqtni aytishda uchta asosiy predlog bor. Ularni piramida kabi eslab qoling.",
["at + soat: at 7 o'clock, at noon, at night","on + kun/sana: on Monday, on 5 May","in + oy, yil, fasl: in June, in 2026, in winter, in the morning"],
["this, next, last, every oldidan predlog yo'q: next week.","at the weekend (BrE) / on the weekend (AmE).","in the morning, lekin on Monday morning."],
[["The lesson starts at 8:30.","Dars 8:30 da boshlanadi."],["I was born in 1998.","Men 1998-yilda tug'ilganman."],["We have a meeting on Friday.","Juma kuni yig'ilishimiz bor."],["It gets dark early in winter.","Qishda erta qorong'i tushadi."],["I'll call you next week.","Senga keyingi hafta qo'ng'iroq qilaman."]],
["See you in Monday.","See you on Monday."],
[["My birthday is ___ March.",["on","at","in"],2,"Oy — in."],["The shop closes ___ 9 pm.",["in","at","on"],1,"Soat — at."],["What did you do ___ New Year's Day?",["on","in","at"],0,"Aniq kun — on."]]);

T("A1","countable","Countable & uncountable: some / any","Sanaladigan va sanalmaydigan otlar",
"Sanaladigan: an apple, two apples. Sanalmaydigan: water, money (ko'plik yo'q). some — darak, any — inkor/so'roq.",
"Ba'zi narsalarni sanab bo'ladi (olma, stul), ba'zilarini esa yo'q (suv, pul, ma'lumot). Sanalmaydigan otlar a/an va -s olmaydi.",
["some + ko'plik / sanalmaydigan (darak): some eggs, some milk","any — inkor va so'roqda: any questions?","Taklif va iltimosda some: Would you like some tea?"],
["advice, information, news, furniture, luggage, homework — sanalmaydi.","Bo'lak bilan sanash: a glass of water, a piece of advice, a cup of tea.","How much water? / How many eggs?"],
[["We need some eggs and some flour.","Bizga tuxum va un kerak."],["Do you have any brothers?","Aka-ukang bormi?"],["There isn't any bread left.","Non qolmabdi."],["Would you like some coffee?","Qahva ichasizmi?"],["Can I have a glass of water?","Bir stakan suv bera olasizmi?"]],
["I need an information.","I need some information."],
[["Are there ___ messages for me?",["some","any","a"],1,"So'roqda any."],["I'd like ___ water, please.",["a","some","any"],1,"Iltimos — some."],["She gave me some good ___ .",["advices","advice","an advice"],1,"advice — sanalmaydi."]]);

T("A1","likeing","Like / love / hate + -ing","Yoqtirish: like + -ing",
"Yoqtirgan yoki yomon ko'rgan ishingizni aytganda fe'lga -ing qo'shing: I like swimming.",
"Faoliyatni yoqtirish haqida gapirganda like, love, enjoy, hate, don't mind dan keyin fe'l -ing shaklida keladi. would like esa boshqa — «xohlardim» ma'nosida va to + fe'l oladi.",
["like / love / enjoy / hate / don't mind + V-ing","would like + to V1 (hozir xohlash)","Narsa: I like pizza."],
["enjoy faqat -ing bilan: I enjoy reading.","like to + V1 ham mumkin (ayniqsa AmE).","I'd like to … = I want to … (muloyim)."],
[["I like swimming in the sea.","Dengizda suzishni yoqtiraman."],["She loves cooking for her family.","U oilasi uchun ovqat pishirishni yaxshi ko'radi."],["He hates getting up early.","U erta turishni yomon ko'radi."],["Do you enjoy reading?","Kitob o'qishni yoqtirasizmi?"],["I'd like to visit London.","Londonga borishni xohlardim."]],
["I enjoy to watch films.","I enjoy watching films."],
[["My sister loves ___ .",["dance","dancing","to dances"],1,"love + -ing."],["I don't mind ___ the dishes.",["wash","washing","to wash"],1,"don't mind + -ing."],["I'd like ___ a coffee.",["having","to have","have"],1,"would like + to V1."]]);

T("A1","adjectives","Adjectives: position","Sifatlarning o'rni",
"Sifat otdan OLDIN keladi va hech qachon ko'plik olmaydi: a big house, big houses.",
"O'zbek tilidagi kabi, ingliz tilida ham sifat otdan oldin turadi. Lekin sifat ko'plik qo'shimchasini olmaydi va to be dan keyin yolg'iz ham kela oladi.",
["sifat + ot: a red car","to be + sifat: The car is red.","very / really + sifat: very big"],
["Sifat -s olmaydi: beautiful flowers (beautifuls emas).","Bir nechta sifat: o'lcham → yosh → rang: a big old black dog.","Sifatdan keyin ot o'rnida one: I want the red one."],
[["She has long black hair.","Uning uzun qora sochi bor."],["It's a beautiful day.","Ajoyib kun."],["These shoes are very comfortable.","Bu tuflilar juda qulay."],["We live in a small old house.","Biz kichkina eski uyda yashaymiz."],["I don't like this shirt. I want the blue one.","Bu ko'ylak yoqmadi. Ko'kini xohlayman."]],
["I have a car red.","I have a red car."],
[["They are ___ .",["happys","happy","happies"],1,"Sifat ko'plik olmaydi."],["She bought a ___ .",["dress beautiful","beautiful dress","dress beautifully"],1,"Sifat otdan oldin."],["Which pen? — The ___ .",["green one","green","one green"],0,"Sifat + one."]]);

T("A1","numbers","Numbers, dates & time","Sonlar, sana va vaqt",
"Sanada tartib son ishlatiladi: 5 May = the fifth of May. Vaqt: past — o'tdi, to — qoldi.",
"Kundalik hayotda soat, sana, narx va telefon raqamlari juda ko'p kerak bo'ladi. Ingliz tilida bularni aytishning o'z qoidalari bor.",
["Tartib sonlar: first, second, third, fourth … twentieth, twenty-first","Sana: 5 May → the fifth of May / May the fifth","Vaqt: 7:15 — a quarter past seven · 7:30 — half past seven · 7:45 — a quarter to eight","Yil: 1998 — nineteen ninety-eight · 2026 — twenty twenty-six"],
["-teen va -ty farqi: thirteen (13) ↔ thirty (30) — urg'u farqi.","Telefon raqami har bir raqam alohida: 0 — «oh» yoki «zero».","am — tun yarmidan tushgacha, pm — tushdan keyin."],
[["What time is it? — It's half past nine.","Soat necha? — To'qqiz yarim."],["My birthday is on the third of June.","Tug'ilgan kunim 3-iyunda."],["The train leaves at a quarter to six.","Poyezd oltiga chorak qolganda jo'naydi."],["It costs fifteen dollars.","Bu o'n besh dollar turadi."],["She was born in two thousand and five.","U 2005-yilda tug'ilgan."]],
["Today is May five.","Today is the fifth of May."],
[["8:45 = ?",["a quarter past eight","a quarter to nine","half past eight"],1,"15 daqiqa qoldi — a quarter to nine."],["21-o'rin = ?",["twenty-one","twenty-first","twentieth-one"],1,"Tartib son: twenty-first."],["2:30 = ?",["half past two","half to three","two half"],0,"half past two."]]);
T("A2","waswere","Past of be: was / were","O'tgan zamonda to be",
"am/is → was, are → were. «Edi» ma'nosi.",
"O'tmishdagi holat, joy yoki kasbni aytish uchun. O'zbekchadagi «edim, edi, edik» shakllari.",
["I / He / She / It + was","You / We / They + were","Inkor: wasn't / weren't","So'roq: Was he …? / Were you …?"],
["Tug'ilish: I was born in 2000 (I born emas).","Yesterday, last week, in 2010 — o'tgan vaqt belgilari.","There was / There were — o'tmishda bor edi."],
[["I was at home yesterday.","Kecha uyda edim."],["The film was very interesting.","Film juda qiziqarli edi."],["Were you tired after the trip?","Safardan keyin charchadingmi?"],["We weren't at school on Monday.","Dushanba kuni maktabda emas edik."],["I was born in Andijan.","Men Andijonda tug'ilganman."]],
["I born in 1999.","I was born in 1999."],
[["They ___ at the party last night.",["was","were","are"],1,"They — were."],["___ it cold yesterday?",["Were","Was","Did"],1,"It — was."],["She ___ born in 2001.",["is","was","were"],1,"Tug'ilish — was born."]]);

T("A2","pastsimple","Past Simple","O'tgan oddiy zamon",
"Tugagan ish, aniq o'tgan vaqtda: V2 (-ed yoki noto'g'ri shakl). Inkor/so'roqda did + V1.",
"Kecha, o'tgan hafta, 2020-yilda — tugab bo'lgan harakatlar. To'g'ri fe'llar -ed oladi, noto'g'ri fe'llarni yodlash kerak (go → went). Ro'yxat «Frazalar → Noto'g'ri fe'llar» bo'limida.",
["Ega + V2: I worked, she went","Inkor: didn't + V1","So'roq: Did + ega + V1 …?"],
["did dan keyin fe'l asl holiga qaytadi: Did you go? (went emas)","Imlo: stop → stopped, study → studied, live → lived.","-ed talaffuzi: /t/ worked, /d/ played, /ɪd/ wanted."],
[["I watched a great film yesterday.","Kecha ajoyib film ko'rdim."],["We went to Samarkand last summer.","O'tgan yozda Samarqandga bordik."],["She didn't call me.","U menga qo'ng'iroq qilmadi."],["Did you finish your homework?","Uy vazifangni tugatdingmi?"],["He bought this car two years ago.","U bu mashinani ikki yil oldin sotib olgan."]],
["I didn't went to school.","I didn't go to school."],
[["They ___ in Bukhara in 2015.",["live","lived","living"],1,"O'tgan zamon: lived."],["___ you see the news?",["Do","Did","Was"],1,"Did + V1."],["I ___ my keys yesterday.",["lose","losed","lost"],2,"lose — noto'g'ri: lost."]]);

T("A2","pastcont","Past Continuous","O'tgan davomli zamon",
"was/were + -ing — o'tmishning ma'lum bir paytida davom etayotgan ish. Ko'pincha qisqa harakat (Past Simple) bilan bo'linadi.",
"«Men ovqat pishirayotgan edim, telefon jiringladi» — uzoq harakat va uni bo'lgan qisqa voqea. Hikoya va voqealarni tasvirlashda juda ko'p ishlatiladi.",
["was / were + V-ing","when + qisqa harakat (Past Simple)","while + uzoq harakat (Past Continuous)"],
["I was cooking when the phone rang.","While I was reading, she was sleeping — ikki parallel harakat.","Hikoya foni: The sun was shining and birds were singing."],
[["I was sleeping at 11 pm last night.","Kecha soat 11 da uxlayotgan edim."],["She was driving when the accident happened.","Avariya bo'lganida u mashina haydayotgan edi."],["What were you doing at that moment?","O'sha paytda nima qilayotgan eding?"],["While we were having dinner, the lights went out.","Kechki ovqat paytida chiroq o'chib qoldi."],["It was raining all morning.","Ertalab bo'yi yomg'ir yog'di."]],
["When he arrived, I cooked dinner. (o'sha payt davom etayotgan edi)","When he arrived, I was cooking dinner."],
[["I ___ TV when you called.",["watched","was watching","am watching"],1,"Uzoq harakat."],["They ___ chess at 5 pm.",["was playing","were playing","are playing"],1,"They — were."],["While she ___ , I cleaned the house.",["was studying","studied","studies"],0,"while + davomli."]]);

T("A2","goingto","Be going to","Reja va bashorat: going to",
"Oldindan qilingan reja yoki ko'rinib turgan belgi: am/is/are going to + fe'l.",
"«Men … qilmoqchiman» — allaqachon qaror qilingan reja. Shuningdek, hozir ko'rinib turgan belgiga asoslangan bashorat: bulutlar → yomg'ir yog'adi.",
["am / is / are + going to + V1","Inkor: I'm not going to …","So'roq: Are you going to …?"],
["Reja: I'm going to visit my grandma on Sunday.","Belgi: Look at those clouds! It's going to rain.","going to go → ko'pincha qisqaroq: I'm going to the cinema."],
[["We're going to buy a new house next year.","Kelasi yili yangi uy sotib olmoqchimiz."],["She's going to study medicine.","U tibbiyotni o'qimoqchi."],["Look out! You're going to fall!","Ehtiyot bo'l! Yiqilasan!"],["I'm not going to tell anyone.","Hech kimga aytmoqchi emasman."],["What are you going to do this weekend?","Dam olish kunlari nima qilmoqchisan?"]],
["I going to call him.","I'm going to call him."],
[["I've bought paint. I ___ my room.",["will paint","am going to paint","paint"],1,"Oldindan reja."],["Look at the sky! It ___ rain.",["is going to","will to","goes to"],0,"Ko'rinib turgan belgi."],["___ you going to come?",["Do","Are","Will"],1,"Are + going to."]]);

T("A2","will","Will vs going to","Kelasi zamon: will",
"will — hozir qabul qilingan qaror, va'da, taklif, fikrga asoslangan taxmin.",
"Gapirayotgan paytda to'satdan qaror qilsangiz yoki va'da bersangiz — will. Oldindan rejalashtirgan bo'lsangiz — going to. Aniq kelishilgan uchrashuv va tadbirlar uchun esa Present Continuous ishlatiladi.",
["will + V1 · won't + V1","Qaror hozir: I'll get some water.","Kelishilgan reja: I'm meeting Ali at 6 (Present Continuous)."],
["I think / probably / I'm sure + will: I think it will rain.","Taklif: Shall I open the window?","will dan keyin to yo'q: I will call (will to call emas)."],
[["Don't worry, I'll help you.","Xavotir olma, senga yordam beraman."],["I think it will be sunny tomorrow.","Menimcha, ertaga quyoshli bo'ladi."],["I'm thirsty. — I'll get you some water.","Chanqadim. — Senga suv olib kelaman."],["I won't tell anyone, I promise.","Hech kimga aytmayman, va'da beraman."],["We're flying to Dubai on Friday.","Juma kuni Dubayga uchamiz (chipta olingan)."]],
["I will to call you later.","I will call you later."],
[["The phone is ringing. I ___ answer it.",["am going to","will","going"],1,"Hozirgi qaror."],["I'm sure you ___ the exam.",["will pass","are passing","pass"],0,"Fikrga asoslangan taxmin."],["I ___ the dentist at 4 tomorrow. It's booked.",["will see","am seeing","see"],1,"Kelishilgan uchrashuv."]]);

T("A2","compar","Comparatives","Qiyosiy daraja",
"Ikki narsani solishtirish: qisqa sifat + er + than; uzun sifat: more … than.",
"«Toshkent Andijondan kattaroq» = Tashkent is bigger than Andijan. «-roq» qo'shimchasi ingliz tilida -er yoki more bilan beriladi.",
["Qisqa: tall → taller than","-y: happy → happier","Undosh qo'shiladi: big → bigger, hot → hotter","Uzun: expensive → more expensive than"],
["Noto'g'ri: good → better, bad → worse, far → further.","much / a lot / a bit + qiyos: much better, a bit cheaper.","Ikki barobar: more taller emas, faqat taller."],
[["Tashkent is bigger than Andijan.","Toshkent Andijondan kattaroq."],["My English is better than last year.","Ingliz tilim o'tgan yildagidan yaxshiroq."],["This phone is more expensive than that one.","Bu telefon unisidan qimmatroq."],["Today is a bit warmer than yesterday.","Bugun kechagidan biroz iliqroq."],["Trains are much faster than buses.","Poyezdlar avtobuslardan ancha tez."]],
["She is more taller than me.","She is taller than me."],
[["A plane is ___ than a train.",["fast","faster","fastest"],1,"Ikkitasini solishtirish."],["This book is ___ than that one.",["interestinger","more interesting","most interesting"],1,"Uzun sifat — more."],["My cold is ___ today.",["badder","worse","more bad"],1,"bad → worse."]]);

T("A2","superl","Superlatives","Orttirma daraja",
"Eng …: the + sifat-est; uzun sifat: the most …",
"Uch yoki undan ko'p narsa ichida eng zo'rini ajratish. «Eng» so'zi ingliz tilida the … -est yoki the most bilan beriladi.",
["the tallest · the biggest · the happiest","the most beautiful · the most expensive","the best · the worst · the furthest"],
["the albatta kerak: the best (best emas).","in + joy/guruh: the tallest in the class. of + davr: the best day of my life.","Present Perfect bilan: the best film I've ever seen."],
[["Mount Everest is the highest mountain in the world.","Everest dunyodagi eng baland tog'."],["This is the most interesting book I've ever read.","Bu men o'qigan eng qiziqarli kitob."],["Today is the hottest day of the year.","Bugun yilning eng issiq kuni."],["She is the best student in our class.","U sinfimizdagi eng yaxshi o'quvchi."],["That was the worst meal of my life.","Bu hayotimdagi eng yomon ovqat edi."]],
["He is the most fast runner.","He is the fastest runner."],
[["It was the ___ day of my life.",["better","best","good"],1,"good → the best."],["Who is ___ person in your family?",["the oldest","older","the most old"],0,"the oldest."],["This is ___ hotel in the city.",["the most expensive","the expensivest","more expensive"],0,"Uzun sifat — the most."]]);

T("A2","asas","(not) as … as · too / enough","Tenglik, too va enough",
"as … as — teng; not as … as — kamroq; too — haddan ortiq; enough — yetarli.",
"Narsalarni teng deb solishtirish va «juda (ortiqcha)», «yetarlicha» ma'nolarini berish.",
["as + sifat + as: as tall as","not as + sifat + as: not as expensive as","too + sifat: too hot (ortiqcha, salbiy)","sifat + enough: old enough · enough + ot: enough money"],
["too ≠ very: too hot — ichib bo'lmaydi; very hot — juda issiq.","enough sifatdan KEYIN, otdan OLDIN.","too/enough + to V1: too tired to walk."],
[["He is as tall as his father.","U otasi bilan bir xil bo'yda."],["My car isn't as fast as yours.","Mening mashinam senikichalik tez emas."],["This coffee is too hot to drink.","Bu qahva ichish uchun juda issiq."],["She isn't old enough to drive.","U mashina haydash uchun hali yosh."],["Do we have enough chairs?","Stullarimiz yetarlimi?"]],
["I am enough tall for this.","I am tall enough for this."],
[["This bag is ___ heavy. I can't carry it.",["very","too","enough"],1,"Ortiqcha — too."],["He's not ___ strong as me.",["so","as","than"],1,"not as … as."],["We don't have ___ time.",["enough","too","as"],0,"enough + ot."]]);

T("A2","adverbs","Adverbs of manner","Holat ravishlari",
"Qanday? — sifat + ly: quick → quickly. Fe'lni tasvirlaydi.",
"Sifat otni tasvirlaydi (a quick car), ravish esa harakatni (He drives quickly). O'zbekchada ko'pincha bir xil so'z: «tez mashina», «tez haydaydi».",
["sifat + ly: slow → slowly, careful → carefully","-y → -ily: easy → easily, happy → happily","Noto'g'ri: good → well, fast → fast, hard → hard"],
["hardly ≠ hard: hardly — zo'rg'a.","Ravish odatda fe'l/to'ldiruvchidan keyin: She speaks English well.","Sezgi fe'llaridan keyin sifat: You look tired. It smells good."],
[["She speaks English very well.","U inglizchani juda yaxshi gapiradi."],["Please drive carefully.","Iltimos, ehtiyotkorlik bilan haydang."],["He works hard every day.","U har kuni qattiq ishlaydi."],["The children played happily in the garden.","Bolalar bog'da xursand o'ynashdi."],["You look tired.","Charchagan ko'rinasan."]],
["He speaks English good.","He speaks English well."],
[["She sings ___ .",["beautiful","beautifully","beauty"],1,"Fe'lni tasvirlaydi — ravish."],["He plays football very ___ .",["good","well","goodly"],1,"good → well."],["This soup tastes ___ .",["delicious","deliciously","delicio"],0,"taste + sifat."]]);

T("A2","objpron","Object & possessive pronouns","Obyekt va egalik olmoshlari",
"Fe'ldan keyin: me, him, her, us, them. Yolg'iz turgan egalik: mine, yours, his, hers, ours, theirs.",
"Harakat kimga qaratilganini ko'rsatish uchun obyekt olmoshlari, otni takrorlamaslik uchun esa egalik olmoshlari ishlatiladi.",
["I → me · he → him · she → her · we → us · they → them","my → mine · your → yours · her → hers · our → ours · their → theirs","Predlogdan keyin ham obyekt: with me, for them"],
["This is my book → This book is mine.","Me and him … emas → He and I …","its uchun egalik olmoshi deyarli ishlatilmaydi."],
[["Can you help me?","Menga yordam bera olasizmi?"],["I saw her at the market.","Uni bozorda ko'rdim."],["Tell them about the meeting.","Ularga yig'ilish haqida ayt."],["This phone isn't mine. It's hers.","Bu telefon meniki emas. Uniki."],["Their house is bigger than ours.","Ularning uyi biznikidan kattaroq."]],
["This is my bag, not your.","This is my bag, not yours."],
[["Can you help ___ ?",["I","me","my"],1,"Fe'ldan keyin — me."],["This bag isn't mine. It's ___ .",["her","hers","she"],1,"Yolg'iz — hers."],["Come with ___ !",["we","us","our"],1,"Predlogdan keyin — us."]]);

T("A2","indef","Something / anyone / nobody …","Gumon olmoshlari",
"some- (darak), any- (inkor/so'roq), no- (inkor ma'no), every- (hamma).",
"«Kimdir, nimadir, hech kim, hamma joyda» kabi so'zlar some/any/no/every + body/one/thing/where qo'shilishidan yasaladi.",
["somebody / something / somewhere — darak gap","anybody / anything / anywhere — inkor, so'roq","nobody / nothing / nowhere — o'zi inkor (not kerak emas)","everybody / everything / everywhere — hamma"],
["Bitta inkor yetarli: I know nothing = I don't know anything.","Everybody is … (birlik fe'l!).","Taklifda some-: Would you like something to drink?"],
[["Someone is knocking at the door.","Kimdir eshikni taqillatyapti."],["I didn't see anything.","Hech narsani ko'rmadim."],["Nobody knows the answer.","Javobni hech kim bilmaydi."],["Everybody is waiting for you.","Hamma seni kutyapti."],["Let's go somewhere nice.","Biror yaxshi joyga boraylik."]],
["I don't know nothing.","I don't know anything."],
[["Is there ___ in the fridge?",["something","anything","nothing"],1,"So'roq — any-."],["___ called you. I don't know who.",["Somebody","Anybody","Everybody"],0,"Darak — some-."],["Everybody ___ happy.",["are","is","be"],1,"everybody — birlik."]]);

T("A2","quant","Quantifiers: a few / a little / a lot of","Miqdor so'zlari",
"Sanaladigan: many, a few, few. Sanalmaydigan: much, a little, little. Ikkalasi: a lot of, some, any, no.",
"Qancha ekanini aniq son bilan aytmaslik uchun. Tanlov otning sanaladigan yoki sanalmasligiga bog'liq.",
["many / a few + sanaladigan: a few friends","much / a little + sanalmaydigan: a little time","a lot of / lots of — ikkalasi bilan","much — ko'proq inkor va so'roqda: not much money"],
["a few (bir nechta, yetarli) ≠ few (juda kam, yetarli emas).","a little (biroz) ≠ little (deyarli yo'q).","too much / too many — haddan ortiq."],
[["I have a few friends in London.","Londonda bir nechta do'stim bor."],["Can I have a little sugar?","Biroz shakar olsam bo'ladimi?"],["There isn't much time.","Vaqt ko'p emas."],["How many people came?","Necha kishi keldi?"],["She has a lot of books.","Uning kitoblari juda ko'p."]],
["I don't have many money.","I don't have much money."],
[["There isn't ___ milk left.",["many","much","a few"],1,"milk — sanalmaydi."],["She has ___ friends here.",["a few","a little","much"],0,"friends — sanaladi."],["There are too ___ cars in the city.",["much","many","little"],1,"cars — sanaladi."]]);

T("A2","presperf","Present Perfect: experience","Hozirgi tugallangan: tajriba",
"have/has + V3 — hayotimda (qachonligi muhim emas). ever? never.",
"«Siz hech Samarqandda bo'lganmisiz?» — vaqt aytilmaydi, tajriba so'raladi. Bu Present Perfect ning asosiy vazifasi.",
["have / has + V3","Have you ever + V3 …?","I have never + V3"],
["Aniq vaqt bo'lsa — Past Simple: I went there in 2019.","been (borib kelgan) ≠ gone (ketgan, hali u yerda).","Javobdan keyin tafsilot — Past Simple: Yes, I have. I went there last year."],
[["I have visited London twice.","Men Londonda ikki marta bo'lganman."],["Have you ever eaten sushi?","Hech sushi yeganmisan?"],["She has never seen snow.","U hech qachon qor ko'rmagan."],["We've been to Samarkand many times.","Samarqandda ko'p marta bo'lganmiz."],["He has gone to Dubai. (hozir u yerda)","U Dubayga ketgan."]],
["I have seen this film last week.","I saw this film last week."],
[["___ you ever ___ to Japan?",["Did / go","Have / been","Have / went"],1,"Tajriba: Have you ever been."],["She ___ never flown before.",["have","has","is"],1,"She — has."],["I ___ him yesterday.",["have met","met","meet"],1,"yesterday — Past Simple."]]);

T("A2","presperf2","Present Perfect: just / already / yet","Hozirgi tugallangan: just, already, yet",
"Natijasi hozir muhim bo'lgan yaqindagi ish. just — hozirgina, already — allaqachon, yet — hali (inkor/so'roq).",
"«Men hozirgina ovqatlandim, och emasman» — ish o'tgan, natija hozir. Bunday holatlar uchun Present Perfect.",
["just / already — have va V3 orasida: I've just eaten.","yet — oxirida, inkor va so'roqda: Have you finished yet?","for + davr / since + boshlanish: for 3 years, since 2020"],
["already — kutilganidan ertaroq.","still … not — hali ham … emas: I still haven't finished.","so far — hozirgacha."],
[["She has just finished her report.","U hozirgina hisobotini tugatdi."],["I've already done my homework.","Uy vazifamni allaqachon qildim."],["Have you called him yet?","Unga hali qo'ng'iroq qildingmi?"],["We haven't decided yet.","Hali qaror qilmadik."],["I've lived here since 2018.","2018-yildan beri shu yerda yashayman."]],
["I didn't finish yet.","I haven't finished yet."],
[["I ___ my homework. Can I go out?",["finished yesterday","have finished","finish"],1,"Natija hozir muhim."],["Have you eaten ___ ?",["already","yet","just"],1,"So'roq oxirida — yet."],["She has worked here ___ 2019.",["for","since","ago"],1,"Boshlanish nuqtasi — since."]]);

T("A2","musthave","Must / have to / should","Majburiyat va maslahat",
"must — o'zim zarur deb bilaman yoki qat'iy qoida; have to — tashqi majburiyat; should — maslahat. mustn't = taqiq, don't have to = shart emas.",
"Modal fe'llar orqali «kerak», «shart», «mumkin emas» ma'nolari beriladi. Eng ko'p adashtiriladigani — mustn't va don't have to.",
["must / mustn't + V1","have to / has to / don't have to + V1","should / shouldn't + V1"],
["O'tmishda must o'rniga had to.","should — yumshoq: You should see a doctor.","must — yozma qoidalarda ko'p: Passengers must wear seatbelts."],
[["You must wear a seatbelt.","Xavfsizlik kamarini taqishingiz shart."],["I have to get up at six for work.","Ish uchun oltida turishim kerak."],["You don't have to come if you're busy.","Band bo'lsang, kelishing shart emas."],["You mustn't use your phone in the exam.","Imtihonda telefondan foydalanish taqiqlanadi."],["You should drink more water.","Ko'proq suv ichishing kerak."]],
["She musts work today.","She has to work today."],
[["It's a free museum. You ___ pay.",["mustn't","don't have to","should"],1,"Shart emas."],["You ___ smoke in the hospital.",["mustn't","don't have to","should"],0,"Taqiq."],["You look tired. You ___ rest.",["should","mustn't","has to"],0,"Maslahat."]]);

T("A2","gerund","Verb + -ing or to + verb","Fe'l + -ing yoki to + fe'l",
"Ba'zi fe'llardan keyin -ing (enjoy reading), ba'zilaridan keyin to + fe'l (want to go) keladi.",
"Qoidadan ko'ra yodlash masalasi. Eng ko'p ishlatiladigan fe'llarni guruhlab yodlang.",
["+ V-ing: enjoy, finish, avoid, mind, suggest, keep, practise, imagine","+ to V1: want, decide, hope, plan, need, promise, agree, learn, would like","Predlogdan keyin doim -ing: interested in learning"],
["like, love, hate, start, begin — ikkalasi ham.","look forward to + -ing (to bu yerda predlog!).","Gap boshida ot sifatida -ing: Swimming is good for you."],
[["I enjoy reading before bed.","Uxlashdan oldin kitob o'qishni yoqtiraman."],["She decided to study abroad.","U chet elda o'qishga qaror qildi."],["Would you mind opening the window?","Derazani ochib yuborsangiz maylimi?"],["I'm looking forward to seeing you.","Sizni ko'rishni intiqlik bilan kutyapman."],["Don't forget to lock the door.","Eshikni qulflashni unutma."]],
["I want going home.","I want to go home."],
[["He finished ___ the report.",["to write","writing","write"],1,"finish + -ing."],["We hope ___ you soon.",["seeing","to see","see"],1,"hope + to."],["She is good at ___ .",["to draw","drawing","draw"],1,"Predlogdan keyin -ing."]]);

T("A2","purpose","Infinitive of purpose","Maqsad: to + fe'l",
"Nima uchun? — to + fe'l: I went to the shop to buy bread.",
"O'zbekchadagi «… uchun», «… gani» ma'nosi ingliz tilida oddiy to + fe'l bilan beriladi. for + to emas!",
["… to + V1: I came to see you.","in order to + V1 (rasmiyroq)","for + ot: I went there for a holiday."],
["for to buy — xato. Faqat to buy.","Inkor maqsad: so as not to / in order not to.","Why …? — To + V1 bilan qisqa javob: To learn English."],
[["I went to the shop to buy bread.","Non olish uchun do'konga bordim."],["She studies hard to pass the exam.","U imtihondan o'tish uchun qattiq o'qiyapti."],["We saved money to buy a car.","Mashina olish uchun pul yig'dik."],["Why are you learning English? — To get a better job.","Nega ingliz tilini o'rganyapsan? — Yaxshiroq ish topish uchun."],["He left early in order to catch the train.","U poyezdga ulgurish uchun erta chiqdi."]],
["I came here for learn English.","I came here to learn English."],
[["I called him ___ say sorry.",["for","to","for to"],1,"Maqsad — to."],["She went to Italy ___ a holiday.",["to","for","for to"],1,"Ot bilan — for."],["We left early ___ miss the bus.",["so as not to","not to for","for not"],0,"Inkor maqsad."]]);

T("A2","cond0","Zero & First Conditional","Nol va birinchi shart gap",
"Zero: If + Present, Present (doimiy haqiqat). First: If + Present, will + V1 (real kelajak). If qismida will yo'q!",
"«Agar yomg'ir yog'sa, uyda qolamiz» — kelajakda bo'lishi mumkin bo'lgan real holat. O'zbekcha «-sa» shakli.",
["Zero: If you heat ice, it melts.","First: If it rains, we will stay home.","unless = if … not"],
["If it will rain — xato.","when, as soon as, before, after dan keyin ham Present: I'll call you when I arrive.","Natija qismi oldin kelsa vergul yo'q: We'll stay home if it rains."],
[["If you study hard, you will pass the exam.","Qattiq o'qisang, imtihondan o'tasan."],["If it rains tomorrow, we'll cancel the picnic.","Ertaga yomg'ir yog'sa, piknikni bekor qilamiz."],["If you heat water to 100°C, it boils.","Suvni 100°C gacha qizdirsangiz, qaynaydi."],["Unless you hurry, you'll miss the train.","Shoshilmasang, poyezddan qolasan."],["I'll call you as soon as I arrive.","Yetib borishim bilan qo'ng'iroq qilaman."]],
["If I will see him, I will tell him.","If I see him, I will tell him."],
[["If she ___ early, she will catch the bus.",["will leave","leaves","left"],1,"If + Present."],["We ___ late if we don't hurry.",["will be","are","would be"],0,"Natija — will."],["I'll call you when I ___ .",["will arrive","arrive","arrived"],1,"when + Present."]]);

T("A2","both","Both / either / neither","Ikkalasi, biri, hech biri",
"both — ikkalasi; either — biri (qaysi bo'lsa ham); neither — hech biri.",
"Ikki narsa yoki odam haqida gapirganda ishlatiladi.",
["both … and …: both Ali and Vali","either … or …: either tea or coffee","neither … nor …: neither Ali nor Vali","both of / either of / neither of + them/us"],
["neither — o'zi inkor: Neither of them came (didn't kerak emas).","either — inkor gap oxirida «ham»: I don't like it either.","both fe'ldan oldin / to be dan keyin: They both work. They are both teachers."],
[["Both my parents are doctors.","Ota-onamning ikkalasi ham shifokor."],["You can have either tea or coffee.","Choy yoki qahva ichishingiz mumkin."],["Neither of them speaks Chinese.","Ularning hech biri xitoycha gapirmaydi."],["I can't swim. — I can't either.","Suza olmayman. — Men ham."],["Both of us were tired.","Ikkalamiz ham charchagan edik."]],
["Neither of them didn't come.","Neither of them came."],
[["___ my brothers live in Tashkent.",["Both","Either","Neither"],0,"Ikkalasi — both."],["I don't like coffee. — I don't ___ .",["too","either","neither"],1,"Inkor — either."],["___ Ali nor Vali was there.",["Either","Neither","Both"],1,"neither … nor."]]);

T("A2","conj","And / but / so / because","Asosiy bog'lovchilar",
"and — qo'shish, but — qarama-qarshilik, so — natija, because — sabab.",
"Qisqa gaplarni birlashtirib, nutqni ravon qilish. Ular A2 darajasidagi har bir gapda kerak bo'ladi.",
["and: I like tea and coffee.","but: It's cheap but good.","so (natija): It was late, so I went home.","because (sabab): I went home because it was late."],
["so va because — teskari yo'nalish: sabab → so → natija; natija → because → sabab.","or — tanlov: tea or coffee?","Gap boshida because — vergul bilan: Because it was late, I went home."],
[["I was tired, so I went to bed early.","Charchagan edim, shuning uchun erta yotdim."],["She stayed at home because she was ill.","U kasal bo'lgani uchun uyda qoldi."],["The hotel was small but very clean.","Mehmonxona kichik, lekin juda toza edi."],["Do you want tea or coffee?","Choy ichasizmi yoki qahva?"],["He studied hard and passed the exam.","U qattiq o'qidi va imtihondan o'tdi."]],
["Because I was tired. (yolg'iz yarim gap)","I went home because I was tired."],
[["It was raining, ___ we stayed inside.",["because","so","but"],1,"Natija — so."],["I like him ___ he's funny.",["so","because","or"],1,"Sabab — because."],["It's old ___ it works well.",["but","so","because"],0,"Qarama-qarshilik."]]);

T("A2","wouldlike","Would like / Would you like …?","Muloyim istak va taklif",
"would like = want (muloyim). Would you like …? — taklif.",
"Restoranda, do'konda va mehmonda muloyim gapirish uchun want o'rniga would like ishlatiladi.",
["I'd like + ot: I'd like a coffee.","I'd like + to V1: I'd like to book a table.","Would you like …? — taklif","Would you like to …? — taklif (harakat)"],
["Do you like …? (umuman yoqadimi) ≠ Would you like …? (hozir xohlaysizmi).","Javob: Yes, please. / No, thank you.","I'd = I would."],
[["I'd like a cup of tea, please.","Bir piyola choy olsam."],["Would you like something to eat?","Biror narsa yeysizmi?"],["I'd like to book a room for two nights.","Ikki kechaga xona bron qilmoqchiman."],["Would you like to come to my party?","Ziyofatimga kelasizmi?"],["Do you like pizza? — Yes, I love it.","Pitsani yoqtirasanmi? — Ha, juda."]],
["I would like eat something.","I would like to eat something."],
[["___ you like a drink? — Yes, please.",["Do","Would","Are"],1,"Taklif — Would."],["I'd like ___ a table for four.",["book","to book","booking"],1,"would like + to."],["Do you like tennis? — Yes, I ___ .",["would","do","like"],1,"Do you like? — Yes, I do."]]);
T("B1","ppcont","Present Perfect Continuous","Hozirgi tugallangan davomli zamon",
"have/has been + -ing — qachondan beri davom etyapti? Davomiylikka urg'u.",
"O'tmishda boshlanib, hozirgacha davom etayotgan (yoki hozirgina tugab, izi qolgan) harakat. «Ikki yildan beri o'rganyapman» = I've been learning for two years.",
["have / has + been + V-ing","How long have you been + V-ing?","for + davr · since + boshlanish nuqtasi"],
["Natija ko'rinib tursa: You're wet. Have you been swimming?","Holat fe'llari bilan oddiy Present Perfect: I've known him for years.","Perfect = nechta/natija (I've read 3 books); Perfect Continuous = qancha vaqt (I've been reading all day)."],
[["I have been learning English for two years.","Ikki yildan beri ingliz tilini o'rganyapman."],["It has been raining since morning.","Ertalabdan beri yomg'ir yog'yapti."],["How long have you been waiting?","Qancha vaqtdan beri kutyapsiz?"],["She's tired because she has been working all day.","U kun bo'yi ishlagani uchun charchagan."],["We've been living here since 2021.","Biz 2021-yildan beri shu yerda yashayapmiz."]],
["I am waiting for you for an hour.","I have been waiting for you for an hour."],
[["They ___ football for two hours.",["have been playing","are playing","played since"],0,"Davomiylik hozirgacha."],["He ___ here since 2018.",["is working","has been working","works"],1,"since — Perfect."],["Your eyes are red. ___ crying?",["Did you","Have you been","Are you been"],1,"Izi qolgan harakat."]]);

T("B1","pastperf","Past Perfect","O'tgan tugallangan zamon",
"had + V3 — o'tmishdagi ikki harakatdan OLDINROG'I. «O'tmishning o'tmishi».",
"«Men kelganimda film allaqachon boshlangan edi» — ikkala harakat o'tmishda, lekin film oldinroq boshlangan. Oldingi harakat — Past Perfect.",
["had + V3","hadn't + V3","Had + ega + V3 …?"],
["Signal so'zlar: already, before, after, by the time, when.","Ketma-ketlik aniq bo'lsa (after, before) Past Simple ham mumkin.","Reported speech va 3-shartda ham ishlatiladi."],
[["When I arrived, the film had already started.","Men kelganimda film allaqachon boshlangan edi."],["She had never seen snow before she moved to Moscow.","Moskvaga ko'chishdan oldin u hech qor ko'rmagan edi."],["We had finished dinner by the time he came.","U kelguniga qadar kechki ovqatni tugatgan edik."],["I realised I had left my phone at home.","Telefonimni uyda qoldirganimni angladim."],["Had you met her before the party?","Ziyofatdan oldin u bilan tanishmidingiz?"]],
["When we arrived, the train left. (u allaqachon ketgan edi)","When we arrived, the train had left."],
[["After she ___ her work, she went home.",["finished already","had finished","has finished"],1,"Oldingi harakat."],["I couldn't get in because I ___ my key.",["had lost","have lost","lose"],0,"Kalit oldinroq yo'qolgan."],["By the time we got there, everyone ___ .",["left","had left","has left"],1,"by the time."]]);

T("B1","usedto","Used to & would","O'tmishdagi odatlar",
"used to + V1 — ilgari shunday edi, endi emas. would + V1 — o'tmishdagi takroriy harakat (holat emas).",
"«Bolaligimda futbol o'ynardim» — endi o'ynamayman. O'zbekchadagi «-ardim» shakli.",
["used to + V1","didn't use to + V1","Did you use to …?","would + V1 (faqat harakatlar)"],
["Holat uchun faqat used to: I used to have long hair (would have emas).","Hozirgi odat uchun used to ishlatilmaydi — usually.","be used to + -ing (ko'nikkan) — boshqa ma'no, B2 da."],
[["I used to play football every day.","Har kuni futbol o'ynardim."],["There used to be a cinema here.","Bu yerda ilgari kinoteatr bor edi."],["She didn't use to like coffee.","U ilgari qahvani yoqtirmasdi."],["Every summer we would go to the mountains.","Har yozi tog'ga borardik."],["Did you use to have long hair?","Ilgari sochingiz uzun edimi?"]],
["I use to live in Fergana.","I used to live in Fergana."],
[["When I was a child, I ___ climb trees.",["use to","used to","was used to"],1,"O'tmish odati."],["Did you ___ wear glasses?",["used to","use to","using to"],1,"So'roqda use to."],["I ___ have a dog. (holat)",["would","used to","use"],1,"Holat — used to."]]);

T("B1","cond2","Second Conditional","Ikkinchi shart gap",
"If + Past Simple, would + V1 — hozirgi xayoliy, real bo'lmagan holat.",
"«Boy bo'lsam, dunyo bo'ylab sayohat qilardim» — hozir boy emasman. Shakl o'tgan zamonda, ma'no esa hozirgi.",
["If + Past Simple, would + V1","If I were you, I would … (maslahat)","could / might — would o'rnida"],
["If I would … — xato.","were barcha shaxslarda: If he were here…","1-shart — real imkoniyat; 2-shart — xayol yoki kam ehtimol."],
[["If I had a million dollars, I would travel the world.","Million dollarim bo'lsa, dunyoni kezardim."],["If I were you, I would accept the offer.","Sening o'rningda bo'lsam, taklifni qabul qilardim."],["What would you do if you lost your job?","Ishingni yo'qotsang, nima qilarding?"],["If she lived closer, we would see her more often.","U yaqinroq yashaganida, uni tez-tez ko'rardik."],["I could help you if I had more time.","Ko'proq vaqtim bo'lsa, yordam bera olardim."]],
["If I would know, I would tell you.","If I knew, I would tell you."],
[["If I ___ wings, I would fly.",["have","had","would have"],1,"If + Past."],["If I were you, I ___ apologise.",["will","would","am"],1,"Maslahat."],["She would be happier if she ___ more.",["slept","sleeps","will sleep"],0,"If + Past."]]);

T("B1","passive","Passive voice: present & past","Majhul nisbat",
"Kim qilgani emas, nima qilingani muhim: be + V3. «Qurilgan», «yozilgan».",
"Majhul nisbatda harakat egasi muhim emas yoki noma'lum. Yangiliklar, ilmiy matnlar va rasmiy hujjatlarda juda keng ishlatiladi.",
["Present: am/is/are + V3 — English is spoken here.","Past: was/were + V3 — The bridge was built in 1965.","Bajaruvchi: by + …"],
["by faqat muhim bo'lsa aytiladi.","Zamon be orqali, asosiy fe'l doim V3.","Faqat to'ldiruvchi oladigan fe'llar majhul bo'ladi."],
[["This bridge was built in 1965.","Bu ko'prik 1965-yilda qurilgan."],["English is spoken all over the world.","Ingliz tilida butun dunyoda gaplashiladi."],["The book was written by Abdulla Qodiriy.","Kitob Abdulla Qodiriy tomonidan yozilgan."],["Cotton is grown in Uzbekistan.","O'zbekistonda paxta yetishtiriladi."],["The thieves were caught yesterday.","O'g'rilar kecha qo'lga olindi."]],
["The house built in 1990.","The house was built in 1990."],
[["The letters ___ every morning.",["deliver","are delivered","delivered"],1,"Present Passive."],["The car ___ last night.",["was stolen","stole","is stealing"],0,"Past Passive."],["Rice ___ in many countries.",["grows","is grown","grown"],1,"Present Passive."]]);

T("B1","reported","Reported speech: statements","O'zlashtirma gap: darak",
"Boshqaning gapini yetkazishda zamon bir pog'ona orqaga suriladi; olmosh va vaqt so'zlari o'zgaradi.",
"«Men charchadim», — dedi u → U charchaganini aytdi. Ingliz tilida bunday yetkazishda fe'l zamoni o'zgaradi.",
["is/am → was · do → did · did → had done","will → would · can → could · have done → had done","now → then · today → that day · tomorrow → the next day · here → there","say (that) … · tell + kishi (that) …"],
["tell dan keyin doim kishi: She told me … (She said me emas).","Hali ham to'g'ri bo'lsa, zamon o'zgarmasligi mumkin.","Reporting fe'l Present bo'lsa (says), zamon o'zgarmaydi."],
[["«I'm tired.» → She said she was tired.","U charchaganini aytdi."],["«I will call you.» → He said he would call me.","U menga qo'ng'iroq qilishini aytdi."],["«I can't swim.» → He told me he couldn't swim.","U suza olmasligini aytdi."],["«I saw her yesterday.» → She said she had seen her the day before.","U uni bir kun oldin ko'rganini aytdi."],["«We're leaving now.» → They said they were leaving then.","Ular o'sha payt ketayotganlarini aytishdi."]],
["She said me that she was busy.","She told me that she was busy."],
[["«I like pizza.» → He said he ___ pizza.",["likes","liked","like"],1,"like → liked."],["She ___ me she was busy.",["said","told","asked"],1,"tell + kishi."],["«I will help.» → He said he ___ help.",["will","would","can"],1,"will → would."]]);

T("B1","reportedq","Reported questions & commands","O'zlashtirma: so'roq va buyruq",
"So'roq → darak tartibi (asked where I lived). Ha/yo'q → if/whether. Buyruq → told/asked + to V1.",
"Savolni yetkazganda so'roq tartibi yo'qoladi va do/does/did tushib qoladi.",
["Wh-: She asked where I lived.","Ha/yo'q: He asked if I was ready.","Buyruq: The teacher told us to sit down.","Iltimos: She asked me to help her.","Inkor buyruq: He told me not to be late."],
["She asked where did I live — xato.","Savol belgisi qo'yilmaydi.","Zamon siljishi saqlanadi."],
[["«Where do you live?» → She asked where I lived.","U qayerda yashashimni so'radi."],["«Can you swim?» → He asked if I could swim.","U suza olishimni so'radi."],["«Sit down.» → The teacher told us to sit down.","O'qituvchi bizga o'tirishni aytdi."],["«Don't be late.» → She told me not to be late.","U menga kechikmaslikni aytdi."],["«What time is it?» → He asked what time it was.","U soat necha bo'lganini so'radi."]],
["He asked me where was the station.","He asked me where the station was."],
[["She asked me where I ___ .",["work","worked","did I work"],1,"Darak tartibi + siljish."],["He asked ___ I was hungry.",["that","if","what"],1,"Ha/yo'q — if."],["Mum told me ___ my room.",["clean","to clean","cleaning"],1,"tell + to V1."]]);

T("B1","relative","Defining relative clauses","Aniqlovchi ergash gaplar",
"who (odam), which (narsa), that (ikkalasi), whose (egalik), where (joy). O'zbekchadagi «-gan» sifatdoshi.",
"«Men ko'rgan film» = the film (that) I saw. Ikki gapni bittaga birlashtirib, qaysi narsa haqida gap ketayotganini aniqlaydi.",
["who — odamlar: the man who lives here","which / that — narsalar: the book which I read","whose — egalik: the girl whose father is a pilot","where — joy: the house where I was born"],
["Olmosh to'ldiruvchi bo'lsa tushirish mumkin: the book (that) I read.","Ega bo'lsa tushmaydi: the man who called.","when — vaqt: the day when we met."],
[["The woman who lives next door is a doctor.","Qo'shni ayol shifokor."],["This is the phone that I bought yesterday.","Bu men kecha olgan telefon."],["That's the house where I grew up.","Bu men o'sgan uy."],["I have a friend whose brother is a pilot.","Akasi uchuvchi bo'lgan do'stim bor."],["The film we watched was boring.","Biz ko'rgan film zerikarli edi."]],
["The man which called you is my boss.","The man who called you is my boss."],
[["The girl ___ won the prize is my sister.",["which","who","whose"],1,"Odam — who."],["This is the city ___ I was born.",["which","where","who"],1,"Joy — where."],["He's the man ___ car was stolen.",["who","whose","which"],1,"Egalik — whose."]]);

T("B1","nondefining","Non-defining relative clauses","Qo'shimcha ma'lumot beruvchi ergash gaplar",
"Vergullar orasida qo'shimcha ma'lumot: My father, who is 60, still works. that ishlatilmaydi.",
"Aniqlovchi gap «qaysi?» degan savolga javob beradi. Qo'shimcha gap esa allaqachon aniq bo'lgan narsa haqida qo'shimcha axborot beradi — uni olib tashlasangiz ham gap tushunarli.",
["…, who …, — odamlar","…, which …, — narsalar","…, which … — butun gapga ishora: He passed, which surprised everyone."],
["Vergul shart.","that ishlatilmaydi.","Olmoshni tushirib bo'lmaydi."],
[["My father, who is 60, still works.","60 yoshli otam hali ham ishlaydi."],["Samarkand, which is very old, attracts many tourists.","Juda qadimiy bo'lgan Samarqand ko'p sayyohlarni jalb qiladi."],["Our teacher, whose son is a doctor, lives near us.","O'g'li shifokor bo'lgan o'qituvchimiz yaqinimizda yashaydi."],["He failed the exam, which upset his parents.","U imtihondan yiqildi, bu esa ota-onasini xafa qildi."],["We visited Bukhara, where my grandparents live.","Buvi-bobom yashaydigan Buxoroga bordik."]],
["My car, that is red, is new.","My car, which is red, is new."],
[["Tashkent, ___ is the capital, is very big.",["that","which","who"],1,"Vergulli — which."],["My sister, ___ lives in Seoul, is a nurse.",["who","which","that"],0,"Odam — who."],["It rained all day, ___ ruined our picnic.",["what","which","that"],1,"Butun gapga — which."]]);

T("B1","deduction","Modals of deduction: present","Taxmin modallari (hozir)",
"must — deyarli aniq ha; might/may/could — ehtimol; can't — deyarli aniq yo'q.",
"Dalillarga qarab xulosa chiqarish. «Charchagan bo'lsa kerak» = He must be tired.",
["must + V1 — 95% ha","might / may / could + V1 — 50%","can't + V1 — 95% yo'q","Davomli: must be + V-ing"],
["Taxminda mustn't emas, can't: It can't be true.","may not / might not — ehtimol emas.","O'tmish taxmini — B2 da (must have done)."],
[["He's been working all day. He must be tired.","U kun bo'yi ishladi. Charchagan bo'lsa kerak."],["She isn't answering. She might be busy.","U javob bermayapti. Band bo'lishi mumkin."],["That can't be Ali. He's in London.","Bu Ali bo'lishi mumkin emas. U Londonda."],["The lights are on. They must be at home.","Chiroqlar yoniq. Ular uyda bo'lsa kerak."],["He may be sleeping. Don't call now.","U uxlayotgan bo'lishi mumkin. Hozir qo'ng'iroq qilma."]],
["He mustn't be at home, the lights are off.","He can't be at home, the lights are off."],
[["She's got a Ferrari. She ___ be rich.",["can't","must","mustn't"],1,"Deyarli aniq."],["He ___ be hungry. He just ate.",["must","can't","might"],1,"Deyarli imkonsiz."],["I'm not sure. It ___ be true.",["must","might","can't"],1,"Ehtimol."]]);

T("B1","tags","Question tags","Tasdiq so'roqlar",
"Darak → inkor tag; inkor → darak tag. «…, shundaymi?»",
"Gap oxiridagi qisqa so'roq tasdiq kutadi yoki suhbatni davom ettiradi.",
["You're tired, aren't you?","She doesn't smoke, does she?","They went home, didn't they?","Yordamchi fe'l + olmosh"],
["I am → aren't I?","Let's → shall we? · Buyruq → will you?","never, nobody — inkor ma'no: He never comes, does he?"],
[["It's a beautiful day, isn't it?","Ajoyib kun, shundaymi?"],["You live in Tashkent, don't you?","Siz Toshkentda yashaysiz, to'g'rimi?"],["She can't swim, can she?","U suza olmaydi, shundaymi?"],["They went home, didn't they?","Ular uyga ketishdi, to'g'rimi?"],["Let's start, shall we?","Boshlaymizmi?"]],
["You are a student, isn't it?","You are a student, aren't you?"],
[["He works here, ___ ?",["doesn't he","isn't he","don't he"],0,"Present Simple."],["You haven't seen my keys, ___ ?",["haven't you","have you","did you"],1,"Inkor → darak."],["I'm late, ___ ?",["amn't I","aren't I","isn't I"],1,"Istisno."]]);

T("B1","sosuch","So / such","So va such (kuchaytirish)",
"so + sifat/ravish; such (a) + (sifat) + ot. Natija: so … that.",
"«Shunchalik … ki» ma'nosi. Qaysi so'z ishlatilishi undan keyin nima kelishiga bog'liq.",
["so + sifat: so tired","so + ravish: so quickly","such a + sifat + birlik ot: such a nice day","such + ko'plik/sanalmaydigan: such good friends, such bad weather","… so/such … that + natija"],
["so many / so much + ot: so many people.","such a lot of = so much/many.","so a nice day — xato."],
[["I was so tired that I fell asleep.","Shunchalik charchadimki, uxlab qoldim."],["It was such a nice day!","Qanday ajoyib kun edi!"],["They are such good friends.","Ular shunday yaxshi do'stlar."],["There were so many people at the concert.","Konsertda shunchalik ko'p odam bor edi."],["He spoke so quickly that I didn't understand.","U shunchalik tez gapirdiki, tushunmadim."]],
["It was so a good film.","It was such a good film."],
[["It was ___ cold that we stayed in.",["such","so","such a"],1,"so + sifat."],["She is ___ kind person.",["so","such a","such"],1,"such a + sifat + ot."],["There was ___ much traffic.",["so","such","such a"],0,"so much."]]);

T("B1","makelet","Make / let / allow / get","Majburlash va ruxsat",
"make sb do (majburlamoq), let sb do (qo'ymoq), allow sb to do (ruxsat bermoq), get sb to do (ko'ndirmoq).",
"Birovni nimadir qilishga majburlash yoki ruxsat berish. make va let dan keyin to yo'q!",
["make + kishi + V1","let + kishi + V1","allow + kishi + to V1","get + kishi + to V1"],
["Majhulda make → to: He was made to wait.","let majhul shakli yo'q — be allowed to.","help + kishi + (to) V1 — ikkalasi ham mumkin."],
[["My mum made me clean my room.","Onam meni xonamni tozalashga majbur qildi."],["My parents let me stay up late.","Ota-onam kech yotishimga ruxsat berishadi."],["We aren't allowed to use phones in class.","Darsda telefondan foydalanishga ruxsat yo'q."],["I got my brother to help me.","Akamni menga yordam berishga ko'ndirdim."],["Sad films make me cry.","Qayg'uli filmlar meni yig'latadi."]],
["My boss made me to work late.","My boss made me work late."],
[["My dad let me ___ his car.",["drive","to drive","driving"],0,"let + V1."],["They don't allow us ___ here.",["park","to park","parking"],1,"allow + to."],["The film made me ___ .",["laugh","to laugh","laughing"],0,"make + V1."]]);

T("B1","wish1","Wish + past simple","Istak: wish (hozir)",
"Hozirgi holat boshqacha bo'lishini xohlash: wish + Past Simple. «… bo'lsa edi».",
"Hozirgi haqiqatdan norozilik yoki orzu. Shakl o'tgan zamonda, ma'no hozir — xuddi 2-shart gapdagidek.",
["I wish + Past Simple: I wish I had a car.","I wish I could + V1","I wish + were: I wish I were taller."],
["I wish I have — xato.","If only — kuchliroq his.","Kelajak uchun hope: I hope you pass (I wish you pass emas)."],
[["I wish I spoke Chinese.","Xitoycha gapira olsam edi."],["I wish I had more free time.","Ko'proq bo'sh vaqtim bo'lsa edi."],["She wishes she lived near the sea.","U dengiz bo'yida yashashni orzu qiladi."],["I wish I could fly.","Ucha olsam edi."],["If only it were Friday!","Qani endi juma bo'lsa!"]],
["I wish I have a car.","I wish I had a car."],
[["I wish I ___ taller.",["am","were","will be"],1,"wish + were."],["I wish I ___ swim.",["can","could","will"],1,"wish + could."],["I ___ you get the job!",["wish","hope","want"],1,"Real kelajak — hope."]]);

T("B1","phrasal","Phrasal verbs","Frazali fe'llar",
"Fe'l + kichik so'z = yangi ma'no: give up (taslim bo'lmoq), look after (qaramoq).",
"So'zlashuv ingliz tilining asosi. Ma'nosini so'zma-so'z tarjimadan topib bo'lmaydi — butun birikma sifatida yodlang. Ro'yxat «Frazalar» bo'limida.",
["Ajraladigan: turn off the light / turn the light off","Olmosh o'rtada: turn it off (turn off it emas)","Ajralmaydigan: look after the kids, get on the bus","Uch qismli: look forward to, run out of, get on with"],
